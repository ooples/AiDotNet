name: Website E2E (production)

# The Playwright suite against https://www.aidotnet.dev, shared by the post-deploy smoke run
# (deploy-website.yml) and the nightly health check (website-health.yml). The auth-backed
# specs use the real backend: they issue, email, validate and revoke a labelled test license
# and register the test user's community license.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      part:
        description: 'Preview checks to run'
        type: choice
        options: [suite, all, anon, free, pro-stripe, pro-granted, admin]
        default: suite
      repair_email:
        description: 'Verify the existing repository mail key and synchronize the function mail secret'
        type: boolean
        default: false
      configure_preview_auth:
        description: 'Add the existing preview host to the Supabase Auth redirect allow list'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preview-auth:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.configure_preview_auth }}
    environment: Preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Configure the existing preview Auth redirects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node website/scripts/configure-preview-auth.mjs

  e2e:
    name: Playwright (${{ matrix.part }})
    environment: ${{ github.event_name == 'workflow_dispatch' && 'Preview' || 'Production' }}
    runs-on: ubuntu-latest
    # One job runs the suite; the full-site crawl runs as one job per kind of visitor, in parallel.
    # Run back to back on one worker, with failures retried, they took hours.
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.part != 'all' && format('["{0}"]', inputs.part) || '["suite","anon","free","pro-stripe","pro-granted","admin"]') }}
    timeout-minutes: 60
    # The license-lifecycle spec writes to production; never run two suites at once. Each crawl
    # makes its own throwaway users, so only the same part of two runs is serialized.
    concurrency:
      group: website-e2e-production-${{ matrix.part }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        # We only run Chromium in CI (see playwright.config.ts). Skipping
        # Firefox + WebKit saves ~3 minutes of browser install per run.
        run: npx playwright install --with-deps chromium

      - name: Verify required E2E secrets
        env:
          PLAYWRIGHT_USER_EMAIL: ${{ secrets.PLAYWRIGHT_USER_EMAIL }}
          PLAYWRIGHT_USER_PASSWORD: ${{ secrets.PLAYWRIGHT_USER_PASSWORD }}
          PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
          PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
        run: |
          # All four are mandatory — the user.setup / admin.setup projects
          # fail loudly if they're missing, but surfacing the missing-
          # secret error here (before browsers launch) keeps the failure
          # attribution clean: "secret not set" vs. "login form regressed".
          : "${PLAYWRIGHT_USER_EMAIL:?Missing PLAYWRIGHT_USER_EMAIL secret}"
          : "${PLAYWRIGHT_USER_PASSWORD:?Missing PLAYWRIGHT_USER_PASSWORD secret}"
          : "${PLAYWRIGHT_ADMIN_EMAIL:?Missing PLAYWRIGHT_ADMIN_EMAIL secret}"
          : "${PLAYWRIGHT_ADMIN_PASSWORD:?Missing PLAYWRIGHT_ADMIN_PASSWORD secret}"

      - name: Wait for Vercel propagation
        # Vercel's alias swap is nearly instant but the CDN edge can serve
        # a stale version for a few seconds after deploy. A short sleep is
        # cheaper than flaky first-run failures on the live smoke pass.
        run: sleep 15

      - name: Install Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v1
        with:
          version: 2.84.4

      - name: Fetch the service-role key for the journeys
        # The real-backend journeys create and delete throwaway users and read their rows. The key
        # is fetched at run time (never stored as a repo secret) and masked in the log.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          key=$(supabase projects api-keys --project-ref yfkqwpgjahoamlgckjib -o json | jq -r '.[] | select(.name == "service_role") | .api_key')
          [ -n "$key" ] && [ "$key" != null ] || { echo "::error::No service_role key returned"; exit 1; }
          echo "::add-mask::$key"
          echo "SUPABASE_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"

      - name: Verify and synchronize the existing mail key
        id: mail
        continue-on-error: true
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_email && matrix.part == 'suite' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          : "${RESEND_API_KEY:?Missing RESEND_API_KEY}"
          trap 'rm -f "$RUNNER_TEMP/mail-check.json" "$RUNNER_TEMP/function-mail.env"' EXIT
          code=$(curl -sS --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/mail-check.json" -w '%{http_code}' \
            -H "Authorization: Bearer $RESEND_API_KEY" -H 'Content-Type: application/json' \
            --data '{"from":"AiDotNet <noreply@aidotnet.dev>","to":["delivered@resend.dev"],"subject":"AiDotNet automated delivery check","html":"Automated test inbox verification."}' \
            https://api.resend.com/emails)
          [ "$code" = 200 ] || [ "$code" = 201 ] || { echo "::error::Repository mail credential failed verification: HTTP $code"; exit 1; }
          printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY" > "$RUNNER_TEMP/function-mail.env"
          supabase secrets set --project-ref yfkqwpgjahoamlgckjib --env-file "$RUNNER_TEMP/function-mail.env"

      - name: Run Playwright E2E smoke tests
        # Nothing is retried. A crawl re-run reaches the same broken link again, and a suite test that
        # passes only on a retry is a flaky check that should show red, not spend the job's budget.
        run: |
          config=playwright.config.ts
          if [ "$PREVIEW_RUN" = true ]; then config=playwright.deployed.config.ts; fi
          if [ "$PART" = suite ]; then
            npx playwright test --config "$config" --grep-invert "every link and control works for" --retries=0
          else
            npx playwright test --config "$config" --project=journeys tests/e2e/journeys/every-control.spec.ts --grep "every link and control works for: $PART\$" --retries=0
          fi
        env:
          PART: ${{ matrix.part }}
          PREVIEW_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          PLAYWRIGHT_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && 'https://test.aidotnet.dev' || 'https://www.aidotnet.dev' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PLAYWRIGHT_USER_EMAIL: ${{ secrets.PLAYWRIGHT_USER_EMAIL }}
          PLAYWRIGHT_USER_PASSWORD: ${{ secrets.PLAYWRIGHT_USER_PASSWORD }}
          PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
          PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CI: '1'

      - name: Keep failed environment preparation visible
        if: ${{ always() && steps.mail.outcome == 'failure' }}
        run: |
          echo "::error::The preview journeys ran, but the requested mail preparation failed. See that step for its exact permission or configuration error."
          exit 1

      - name: Upload Playwright report
        # Always upload (success or fail) — on failure the HTML report +
        # trace viewer is the fastest path to diagnosing a broken deploy;
        # on success the artifact proves the run happened with the
        # expected test counts.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.part }}
          path: website/playwright-report/
          retention-days: 14
