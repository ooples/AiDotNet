name: Deploy reviewed website backend

on:
  # Source checks only on this review branch; all mutation inputs default false.
  push:
    branches: [fix/e2e-findings-1]
    paths:
      - .github/workflows/website-backend.yml
      - website/supabase/migrations/20261117000000_close_legacy_policy_bypasses.sql
      - website/supabase/migrations/20261118000000_unique_subscription_entitlement.sql
      - website/supabase/migrations/20261118010000_independent_subscription_entitlements.sql
      - website/supabase/migrations/20261118020000_secure_checkout_ownership.sql
      - website/supabase/verify-entitlement-prerequisites.sql
      - website/supabase/require-existing-entitlement-history.sql
      - website/tests/database/rls.test.mjs
  workflow_dispatch:
    inputs:
      target:
        description: 'Preview variants or canonical production functions'
        type: choice
        options: [preview, production]
        default: preview
      apply_rls:
        description: Apply the reviewed website migrations
        type: boolean
        default: false
      deploy_functions:
        description: Deploy reviewed billing, deletion, fulfillment and Community handlers
        type: boolean
        default: false
      configure_stripe:
        description: Verify delayed-payment success on the existing live Stripe endpoint
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'push' && format('website-backend-check-{0}', github.ref) || 'website-preview-verification' }}
  cancel-in-progress: false
  queue: max

jobs:
  backend:
    name: Verify and deploy the shared preview backend
    environment: ${{ inputs.target == 'production' && 'Production' || 'Preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Verify the handlers and real PostgreSQL policy tests before deployment
        run: |
          npm run check
          npm run test:backend
          npm run test:rls
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13
        with:
          version: 2.84.4
      - name: Link the existing shared project
        if: ${{ inputs.apply_rls || inputs.deploy_functions }}
        run: supabase link --project-ref yfkqwpgjahoamlgckjib --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Apply only the reviewed migrations and record their exact versions
        if: ${{ inputs.apply_rls }}
        run: |
          set -euo pipefail
          database_url=$(cat supabase/.temp/pooler-url)
          psql "$database_url" -X -v ON_ERROR_STOP=1 -f supabase/require-existing-entitlement-history.sql
          for filename in 20261118020000_secure_checkout_ownership; do
          version=${filename%%_*}
          migration=supabase/migrations/${filename}.sql
          migration_name=${filename#*_}
          recorded=$(psql "$database_url" -X -At -v ON_ERROR_STOP=1 -c "select count(*) from supabase_migrations.schema_migrations where version='$version'")
          if [ "$recorded" = 0 ]; then
            # DDL and migration history succeed together. Other pending migrations are not applied.
            PGOPTIONS='-c lock_timeout=2000 -c statement_timeout=5000' psql "$database_url" -X --single-transaction -v ON_ERROR_STOP=1 \
              --set=migration_source="$(cat "$migration")" --set=migration_version="$version" --set=migration_name="$migration_name" \
              -f "$migration" -f - <<'SQL'
          insert into supabase_migrations.schema_migrations(version,name,statements)
          values (:'migration_version',:'migration_name',array[:'migration_source']);
          SQL
          elif [ "$recorded" = 1 ]; then
            echo 'Reviewed RLS migration is already recorded.'
          else
            echo '::error::Unexpected migration history'; exit 1
          fi
          done
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Record aggregate rollout evidence without customer data
        if: ${{ inputs.apply_rls || inputs.deploy_functions }}
        run: |
          psql "$(cat supabase/.temp/pooler-url)" -X -v ON_ERROR_STOP=1 <<'SQL'
          select count(*) as license_rows,pg_total_relation_size('public.license_keys') as license_bytes from public.license_keys;
          select count(*) as duplicate_checkout_receipts from (select stripe_checkout_session_id,product from public.license_keys where stripe_checkout_session_id is not null group by stripe_checkout_session_id,product having count(*)>1) duplicates;
          select count(*) as duplicate_legacy_checkout_notes from (select notes,product from public.license_keys where notes ~ '^Issued by Stripe Checkout \(session ' group by notes,product having count(*)>1) duplicates;
          select count(*) as conflicting_customer_owners from (select customer_id from (select stripe_customer_id customer_id,id user_id from public.profiles where stripe_customer_id is not null union all select stripe_customer_id,user_id from public.license_keys where stripe_customer_id is not null) legacy group by customer_id having count(distinct user_id)>1) conflicts;
          select version,name from supabase_migrations.schema_migrations where version in ('20261117000000','20261118000000','20261118010000','20261118020000') order by version;
          SQL
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Function credentials are managed separately. Deploying code preserves the
      # installed key; the hosted license-email journey verifies actual sending.
      - name: Require valid entitlement prerequisites before any function deployment
        if: ${{ inputs.deploy_functions }}
        run: psql "$(cat supabase/.temp/pooler-url)" -X -v ON_ERROR_STOP=1 -f supabase/verify-entitlement-prerequisites.sql
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Deploy only the reviewed billing and Community functions
        if: ${{ inputs.deploy_functions }}
        run: |
          suffix=-preview
          if [ "$FUNCTION_TARGET" = production ]; then suffix=; fi
          for name in billing-portal stripe-webhook register-community-license delete-account; do
            supabase functions deploy "$name$suffix" --project-ref yfkqwpgjahoamlgckjib
          done
        env:
          FUNCTION_TARGET: ${{ inputs.target || 'preview' }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Verify the existing Stripe webhook event subscription
        if: ${{ inputs.configure_stripe }}
        run: node scripts/configure-stripe-webhook.mjs
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      - name: Record exact deployed function revisions
        if: ${{ inputs.deploy_functions }}
        run: |
          supabase functions list --project-ref yfkqwpgjahoamlgckjib --output json > "$RUNNER_TEMP/reviewed-functions.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const suffix=process.env.FUNCTION_TARGET==='production'?'':'-preview';
          const expected=['billing-portal','stripe-webhook','register-community-license','delete-account'].map(name=>name+suffix);
          const functions=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/reviewed-functions.json','utf8'));
          const selected=functions.filter(f=>expected.includes(f.slug));
          if(selected.length!==4||selected.some(f=>f.status!=='ACTIVE'||f.verify_jwt!==false)) throw Error('Reviewed function deployment metadata is incomplete');
          console.log(JSON.stringify(selected.map(({slug,version,status,updated_at,verify_jwt})=>({slug,version,status,updated_at,verify_jwt})),null,2));
          JS
        env:
          FUNCTION_TARGET: ${{ inputs.target || 'preview' }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
