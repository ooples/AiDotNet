name: Deploy reviewed website backend

on:
  # Source checks only on this review branch; all mutation inputs default false.
  push:
    branches: [fix/e2e-findings-1]
    paths:
      - .github/workflows/website-backend.yml
      - website/supabase/migrations/20261117000000_close_legacy_policy_bypasses.sql
      - website/supabase/migrations/20261118000000_unique_subscription_entitlement.sql
      - website/tests/database/rls.test.mjs
  workflow_dispatch:
    inputs:
      apply_rls:
        description: Apply the reviewed website migrations
        type: boolean
        default: false
      deploy_functions:
        description: Deploy only billing-portal and stripe-webhook
        type: boolean
        default: false
      configure_stripe:
        description: Enable delayed-payment success on the existing Stripe endpoint
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: website-preview-verification
  cancel-in-progress: false

jobs:
  backend:
    name: Verify and deploy the shared preview backend
    environment: Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Verify the handlers and real PostgreSQL policy tests before deployment
        run: |
          npm run check
          npm run test:backend
          npm run test:rls
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13
        with:
          version: 2.84.4
      - name: Link the existing shared project
        if: ${{ inputs.apply_rls || inputs.deploy_functions }}
        run: supabase link --project-ref yfkqwpgjahoamlgckjib --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Apply only the reviewed migrations and record their exact versions
        if: ${{ inputs.apply_rls }}
        run: |
          set -euo pipefail
          database_url=$(cat supabase/.temp/pooler-url)
          for filename in 20261117000000_close_legacy_policy_bypasses 20261118000000_unique_subscription_entitlement; do
          version=${filename%%_*}
          migration=supabase/migrations/${filename}.sql
          migration_name=${filename#*_}
          recorded=$(psql "$database_url" -X -At -v ON_ERROR_STOP=1 -c "select count(*) from supabase_migrations.schema_migrations where version='$version'")
          if [ "$recorded" = 0 ]; then
            # DDL and migration history succeed together. Other pending migrations are not applied.
            psql "$database_url" -X --single-transaction -v ON_ERROR_STOP=1 \
              --set=migration_source="$(cat "$migration")" --set=migration_version="$version" --set=migration_name="$migration_name" \
              -f "$migration" -f - <<'SQL'
          insert into supabase_migrations.schema_migrations(version,name,statements)
          values (:'migration_version',:'migration_name',array[:'migration_source']);
          SQL
          elif [ "$recorded" = 1 ]; then
            echo 'Reviewed RLS migration is already recorded.'
          else
            echo '::error::Unexpected migration history'; exit 1
          fi
          done
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Function credentials are managed separately. Deploying code preserves the
      # installed key; the hosted license-email journey verifies actual sending.
      - name: Deploy only the reviewed billing functions
        if: ${{ inputs.deploy_functions }}
        run: |
          supabase functions deploy billing-portal --project-ref yfkqwpgjahoamlgckjib
          supabase functions deploy stripe-webhook --project-ref yfkqwpgjahoamlgckjib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Verify the existing Stripe webhook event subscription
        if: ${{ inputs.configure_stripe }}
        run: node scripts/configure-stripe-webhook.mjs
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
