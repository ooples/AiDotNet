name: Compiler-guided evolution

on:
  pull_request:
    paths:
      - 'src/AiDotNet.Evolution.CSharp/**'
      - 'src/Evolution/Programs/**'
      - 'src/Configuration/ProgramEvolution*.cs'
      - 'src/AiModelBuilder.Evolution.cs'
      - 'src/Interfaces/IProgramMeasurementEvidenceStore.cs'
      - 'src/AiDotNet.csproj'
      - 'src/Directory.Build.props'
      - 'AiDotNet.sln'
      - 'tests/AiDotNet.Evolution.CSharp.Tests/**'
      - 'tests/AiDotNet.Evolution.Integration.Tests/**'
      - 'tests/AiDotNet.Tests/UnitTests/Evolution/**'
      - 'tests/AiDotNet.Tests/IntegrationTests/Evolution/**'
      - 'tests/AiDotNet.Tests/IntegrationTests/AutoML/MapElitesAutoMLIntegrationTests.cs'
      - 'tests/AiDotNet.Tests/IntegrationTests/Configuration/EvolutionYamlConfigTests.cs'
      - 'tools/AiDotNet.CSharp.Worker/**'
      - 'tools/AiDotNet.Evolve.Cli/**'
      - 'tests/AiDotNet.Evolve.Cli.Tests/**'
      - 'Directory.Packages.props'
      - '.github/workflows/evolution-csharp.yml'
      - '.github/scripts/check-evolution-cli-coverage.ps1'
      - '.github/scripts/tests/check-evolution-cli-coverage.tests.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evolution-csharp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: consumer
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net8.0]
    env:
      # Temporary source-path contract check for companion PR #15. This does not prove that the
      # older published preview contains these APIs or bypass the normal package-path release gate.
      EvolutionProjectPath: ${{ github.workspace }}/evolution/src/AiDotNet.Evolution/AiDotNet.Evolution.csproj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: consumer
          persist-credentials: false
      - name: Checkout pinned companion source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ooples/AiDotNet.Evolution
          ref: 76d8343939f9ec1a58c4994384a249e6ecc93dc0
          # Keep sibling repositories separate: nesting core under the consumer inherits its CPM file.
          path: evolution
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Restore and build real dependencies
        run: >-
          dotnet build tests/AiDotNet.Evolution.CSharp.Tests/AiDotNet.Evolution.CSharp.Tests.csproj
          -c Release -f ${{ matrix.framework }} -p:UseLocalEvolution=true -m:2
      - name: Test compiler, worker, repair, facade and receipts without a live provider
        run: >-
          dotnet test tests/AiDotNet.Evolution.CSharp.Tests/AiDotNet.Evolution.CSharp.Tests.csproj
          -c Release -f ${{ matrix.framework }} --no-build --no-restore -p:UseLocalEvolution=true
          --logger "trx;LogFileName=compiler.trx" --results-directory TestResults/compiler-${{ matrix.framework }}
          --collect:"XPlat Code Coverage" -- "DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include=[AiDotNet.Evolution.CSharp]*,[AiDotNet.CSharp.Worker]*"
      - name: Build and test the authored runtime CLI pilot
        if: matrix.framework == 'net10.0'
        run: |
          dotnet build tests/AiDotNet.Evolve.Cli.Tests/AiDotNet.Evolve.Cli.Tests.csproj -c Release -p:UseLocalEvolution=true -m:2
          # Coverlet rejects literal hyphens in filters; use a wildcard and verify the reported module.
          dotnet test tests/AiDotNet.Evolve.Cli.Tests/AiDotNet.Evolve.Cli.Tests.csproj -c Release --no-build --no-restore -p:UseLocalEvolution=true --logger "trx;LogFileName=cli.trx" --results-directory TestResults/compiler-net10.0/cli --collect:"XPlat Code Coverage" -- "DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include=[aidotnet*evolve]*"
      - name: Test the consumer facade and persistent fitness against pinned core
        run: >-
          dotnet test tests/AiDotNet.Evolution.Integration.Tests/AiDotNet.Evolution.Integration.Tests.csproj
          -c Release -f ${{ matrix.framework }} -p:UseLocalEvolution=true -m:2
          --logger "trx;LogFileName=consumer.trx" --results-directory TestResults/compiler-${{ matrix.framework }}/consumer
          --collect:"XPlat Code Coverage" -- "DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include=[AiDotNet]AiDotNet.Evolution.*,[AiDotNet]AiDotNet.AiModelBuilder*"
      - name: Verify CLI module and runtime pilot coverage
        if: matrix.framework == 'net10.0'
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -Path TestResults/compiler-net10.0/cli -Filter coverage.cobertura.xml -Recurse -File)
          if ($reports.Count -eq 0) { throw 'Expected a CLI coverage report.' }
          & .github/scripts/tests/check-evolution-cli-coverage.tests.ps1
          & .github/scripts/check-evolution-cli-coverage.ps1 -CoveragePath $reports.FullName
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compiler-${{ matrix.framework }}
          path: consumer/TestResults/compiler-${{ matrix.framework }}
          if-no-files-found: error
