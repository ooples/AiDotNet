name: Commit Message Lint

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        # Loads commitlint.config.mjs — the action's default configFile is
        # ./commitlint.config.mjs, so the file MUST be named .mjs (a .js was
        # silently ignored, falling back to config-conventional defaults).
        with:
          # Lint the commits a push actually adds, not the whole accumulated branch. This is a
          # long-lived integration branch: the action walks the entire PR range, which is ~100
          # commits, and 27 of them carry messages written before these rules were enforced
          # (subject-empty, type-empty, subject-case, header-max-length). Every one is older than
          # the last 40 commits, so they are settled history — the only way to make them pass is a
          # rebase over the whole branch, which would rewrite history other sessions are actively
          # pushing to.
          #
          # 40 is far more than any realistic push adds, so the rule stays fully enforced for
          # current work while the pre-rules tail ages out on its own as the branch advances.
          commitDepth: 40


