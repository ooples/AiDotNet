name: Commit Message Lint

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        # Loads commitlint.config.mjs — the action's default configFile is
        # ./commitlint.config.mjs, so the file MUST be named .mjs (a .js was
        # silently ignored, falling back to config-conventional defaults).
        # No commitDepth: it does NOT mean "the newest N commits". Setting it to 40 made the action
        # lint a 40-commit window from the far end of the PR range — every entry hundreds of commits
        # old, none of them the ones under review. That is worse than the default in both
        # directions: it still failed on legacy messages while no longer checking any new commit.
        # The default (the PR's full base..head range) is the correct scope; the branch's ~27
        # pre-hook messages are a history problem, not a configuration one.


