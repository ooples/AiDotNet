name: Commit Message Lint

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        # Loads commitlint.config.mjs — the action's default configFile is
        # ./commitlint.config.mjs, so the file MUST be named .mjs (a .js was
        # silently ignored, falling back to config-conventional defaults).
        with:
          # Follow only this branch's own commits. Without it the action walks every commit in the
          # PR range, and a long-lived integration branch keeps absorbing master through merge
          # commits — so the check was re-linting ~100 messages that were written elsewhere, already
          # reviewed, and already merged to master. Those cannot be fixed from this PR without
          # rewriting shared history, and re-judging them here says nothing about the change under
          # review. First-parent traversal is the standard scoping for exactly this shape of branch.
          firstParent: true


