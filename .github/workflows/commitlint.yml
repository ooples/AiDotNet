name: Commit Message Lint

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    if: ${{ (github.event.pull_request.draft != true) && (!startsWith(github.head_ref, 'release-please--')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Lint every ordinary commit in the PR
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Retain the existing action's 6.2.1 commitlint dependencies, pinned by image digest.
        # Its API enumerator stops at 100 commits and discards parent counts. Read the full
        # local graph instead, excluding only actual multi-parent merge commits.
        run: |
          docker run --rm --network none --entrypoint node \
            --volume "$GITHUB_WORKSPACE:/github/workspace:ro" \
            --workdir /github/workspace \
            wagoid/commitlint-github-action@sha256:86a04e0a99128551a7555c269d2b675c3c85f61358cf7dd558f6b873b66f561a \
            tools/CommitLint/lint-pr-commits.mjs "$PR_BASE_SHA" "$PR_HEAD_SHA"
