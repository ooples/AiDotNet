name: Auto-Fix Formatting (dotnet format + EOL normalize)

on:
  schedule:
    # Daily at 03:15 UTC (adjust as needed)
    - cron: '15 3 * * *'
  workflow_dispatch:

concurrency:
  group: dotnet-format-autofix
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  AUTOFIX_REVIEWERS: ${{ vars.AUTOFIX_REVIEWERS }}
  FORMAT_BRANCH: automation/dotnet-format-autofix
  # A pull request in this repository holds at most 100 changed files.
  FORMAT_BATCH_MAX_FILES: 100

jobs:
  format:
    name: Run dotnet format and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # global.json pins a 10.0 SDK; `dotnet format` ships in the SDK, so no separate tool.
          dotnet-version: '10.0.x'

      - name: Run dotnet format
        run: |
          # Folder mode formats every .cs file against .editorconfig from syntax alone. The
          # solution mode this replaced loads the MSBuild workspace and compiles every project
          # for every target framework to run the style and analyzer passes; that never fit
          # this job (20-minute timeout each night, then a runner shutdown), and the rules
          # .editorconfig raises to warning or error (CS15xx docs, ADN/AIDN, CA2000) have no
          # code fix for those passes to apply.
          dotnet format whitespace . --folder --verbosity minimal

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # One batch of at most FORMAT_BATCH_MAX_FILES files per run, never the whole backlog: the first
      # run after ten months of drift would otherwise push about 1777 files in one commit. The script
      # also re-applies the .gitattributes line-ending policy (dotnet format does not), commits the
      # batch on top of master and leaves the branch alone when it already holds that batch.
      - name: Commit and push one batch
        id: batch
        env:
          # IMPORTANT:
          # - If AUTOFIX_PAT is set, we can create a PR that triggers normal CI workflows.
          # - If not set, pushes/PRs created with GITHUB_TOKEN may not trigger other workflows due to GitHub safeguards.
          AUTOFIX_PAT: ${{ secrets.AUTOFIX_PAT }}
        shell: bash
        run: |
          remote=origin
          if [ -n "$AUTOFIX_PAT" ]; then
            remote="https://x-access-token:${AUTOFIX_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          else
            echo "::warning::AUTOFIX_PAT is not set. The PR may not trigger CI automatically when created by GitHub Actions."
          fi
          bash .github/scripts/format-autofix-batch.sh "$FORMAT_BRANCH" "$FORMAT_BATCH_MAX_FILES" "$remote"

      # The PR is opened for review and is never merged from here: no auto-merge, no approval. Merging
      # a batch is what releases the next one.
      - name: Create or update PR
        if: steps.batch.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_FILES: ${{ steps.batch.outputs.batch_files }}
          REMAINING_FILES: ${{ steps.batch.outputs.remaining_files }}
          TOTAL_FILES: ${{ steps.batch.outputs.total_files }}
        shell: bash
        run: |
          title='chore: automated dotnet format + line-ending normalization'
          body="$RUNNER_TEMP/format-autofix-pr-body.md"
          {
            echo 'Automated formatting maintenance PR. It is not merged automatically.'
            echo
            echo "This batch: **${BATCH_FILES}** file(s), the first in path order of **${TOTAL_FILES}** that"
            echo "differ from the formatted tree. **${REMAINING_FILES}** file(s) wait for later batches; a batch"
            echo "holds at most ${FORMAT_BATCH_MAX_FILES} files, and the next one is opened by the first run after"
            echo 'this one is merged (nightly, or dispatch the workflow by hand).'
            echo
            echo '- `dotnet format whitespace . --folder`: whitespace only, from `.editorconfig`.'
            echo '- `git add --renormalize`: the `.gitattributes` EOL policy (dotnet format does not normalize line endings).'
            echo
            echo 'If CI does not run automatically, ensure `AUTOFIX_PAT` is configured as a repository secret with `repo` and `workflow` scopes.'
          } > "$body"

          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$FORMAT_BRANCH" --base master --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            echo "Updating existing PR #$number"
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
          else
            echo 'Creating new PR'
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$FORMAT_BRANCH" \
              --title "$title" --body-file "$body")
            number=${url##*/}
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --add-label chore --add-label autofix --add-label formatting ||
              echo "::warning::Could not apply labels to PR #$number."
          fi

          reviewers=${AUTOFIX_REVIEWERS:-$GITHUB_REPOSITORY_OWNER}
          reviewers=${reviewers// /}
          gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --add-reviewer "$reviewers" ||
            echo "::warning::Could not request review from $reviewers on PR #$number."

          {
            echo "### Formatting batch"
            echo "PR #$number: ${BATCH_FILES} file(s) of ${TOTAL_FILES} drifted; ${REMAINING_FILES} left for later batches."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No changes
        if: steps.batch.outputs.has_changes == 'false'
        run: echo "No formatting changes detected."
