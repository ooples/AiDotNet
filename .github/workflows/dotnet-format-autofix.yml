name: Auto-Fix Formatting (dotnet format + EOL normalize)

on:
  schedule:
    # Daily at 03:15 UTC (adjust as needed)
    - cron: '15 3 * * *'
  workflow_dispatch:

# Runs queue instead of cancelling each other: this job pushes a branch and then opens a pull request,
# and a cancellation between the two would leave the branch without one until the next run.
concurrency:
  group: dotnet-format-autofix
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  AUTOFIX_REVIEWERS: ${{ vars.AUTOFIX_REVIEWERS }}
  FORMAT_BRANCH: automation/dotnet-format-autofix
  FORMAT_BASE: master
  # A pull request in this repository holds at most 100 changed files.
  FORMAT_BATCH_MAX_FILES: 100
  # With AUTOFIX_PAT the push and the pull request start the normal workflows, so the required CI Gate
  # check can run. With the job token GitHub starts none (its safeguard against recursive runs).
  HAS_PAT: ${{ secrets.AUTOFIX_PAT != '' }}

jobs:
  format:
    name: Run dotnet format and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # The batch is formatted from, committed on and compared with master. A manual dispatch on any
      # other ref would publish that ref's commits under the formatting pull request.
      - name: Refuse a run from another ref
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::This workflow only runs on master; it was dispatched on $GITHUB_REF."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: master
          fetch-depth: 0
          # checkout persists this token as the credential git sends to github.com; a different token
          # in a push URL would be overridden by it. So the PAT goes here, and every later git command
          # talks to plain `origin`: the token is never in a URL or on a command line.
          token: ${{ secrets.AUTOFIX_PAT || github.token }}

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # global.json pins a 10.0 SDK; `dotnet format` ships in the SDK, so no separate tool.
          dotnet-version: '10.0.x'

      - name: Run dotnet format
        run: |
          # Folder mode formats every .cs file against .editorconfig from syntax alone. The
          # solution mode this replaced loads the MSBuild workspace and compiles every project
          # for every target framework to run the style and analyzer passes; that never fit
          # this job (20-minute timeout each night, then a runner shutdown), and the rules
          # .editorconfig raises to warning or error (CS15xx docs, ADN/AIDN, CA2000) have no
          # code fix for those passes to apply.
          dotnet format whitespace . --folder --verbosity minimal

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Find the open batch pull request
        id: open
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_PAT || github.token }}
        shell: bash
        run: |
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$FORMAT_BRANCH" --base "$FORMAT_BASE" --state open \
            --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Open batch pull request: ${number:-none}"

      # One batch of at most FORMAT_BATCH_MAX_FILES files per run, never the whole backlog: the first
      # run after ten months of drift would otherwise push about 1777 files in one commit. The script
      # also re-applies the .gitattributes line-ending policy (dotnet format does not), leaves out the
      # paths in .github/format-autofix-skip.txt, keeps an open batch on the same files, and does not
      # overwrite a branch somebody else has committed to. See its header for the rules.
      - name: Commit and push one batch
        id: batch
        env:
          FORMAT_OPEN_PR: ${{ steps.open.outputs.number != '' }}
        shell: bash
        run: |
          if [ "$HAS_PAT" != true ]; then
            echo "::warning::AUTOFIX_PAT is not set. The batch is pushed and opened with the job token, so GitHub starts no workflows for it and the required CI Gate check will not run."
          fi
          bash .github/scripts/format-autofix-batch.sh "$FORMAT_BRANCH" "$FORMAT_BATCH_MAX_FILES" origin "origin/$FORMAT_BASE"

      # The pull request is opened for review and is never merged from here: no auto-merge, no approval.
      # Merging a batch is what releases the next one.
      - name: Create or update PR
        if: steps.batch.outputs.has_changes == 'true' || steps.batch.outputs.obsolete == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_PAT || github.token }}
          OPEN_PR_NUMBER: ${{ steps.open.outputs.number }}
          BRANCH_SHA: ${{ steps.batch.outputs.branch_sha }}
          BATCH_FILES: ${{ steps.batch.outputs.batch_files }}
          REMAINING_FILES: ${{ steps.batch.outputs.remaining_files }}
          TOTAL_FILES: ${{ steps.batch.outputs.total_files }}
          SKIPPED_FILES: ${{ steps.batch.outputs.skipped_files }}
          HELD: ${{ steps.batch.outputs.held }}
          OBSOLETE: ${{ steps.batch.outputs.obsolete }}
        shell: bash
        run: bash .github/scripts/format-autofix-pr.sh

      - name: No changes
        if: steps.batch.outputs.has_changes == 'false'
        run: echo "No formatting changes detected."
