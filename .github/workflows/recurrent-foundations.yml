name: Recurrent foundation integration
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'tests/AiDotNet.FoundationReview/**'
      - 'tests/AiDotNet.Tests/**'
      - '.github/workflows/recurrent-foundations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  opencl-foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: library
    env:
      AIDOTNET_OPENCL_ALLOW_CPU: '1'
      AIDOTNET_REQUIRE_GPU_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: library
          persist-credentials: false
      # The companion source is the release Directory.Packages.props references, read from the file
      # rather than pinned here: a hard-coded commit went stale when the package moved to 0.149.0,
      # and the build then failed on an API that only 0.149.0 has.
      - name: Read the referenced AiDotNet.Tensors version
        id: tensors
        shell: bash
        # Runs in the job default working directory, the library checkout.
        run: |
          version=$(sed -n 's/.*Include="AiDotNet.Tensors" Version="\([^"]*\)".*/\1/p' Directory.Packages.props)
          if [ -z "$version" ]; then
            echo "::error::No AiDotNet.Tensors version in Directory.Packages.props."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ooples/AiDotNet.Tensors
          ref: v${{ steps.tensors.outputs.version }}
          path: companion-tensors
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Install OpenCL runtime
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd clinfo
          clinfo
      - name: Run CPU and OpenCL foundation regressions against companion kernels
        run: >-
          dotnet test tests/AiDotNet.FoundationReview/AiDotNet.FoundationReview.csproj
          -c Release -f net10.0 -p:UseLocalTensors=true
          -p:LocalTensorsRoot=${{ github.workspace }}/companion-tensors
          -p:GeneratePackageOnBuild=false --logger 'trx;LogFileName=foundations.trx'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: recurrent-foundation-results
          path: library/tests/AiDotNet.FoundationReview/TestResults/*.trx
