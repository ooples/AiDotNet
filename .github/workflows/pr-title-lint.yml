name: Auto-Fix PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  select-runner:
    if: ${{ (github.event.pull_request.draft != true) && (!startsWith(github.head_ref, 'release-please--')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      use_self_hosted: ${{ steps.probe.outputs.use_self_hosted }}
    steps:
      - name: Probe online idle self-hosted CPU runner
        id: probe
        shell: pwsh
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          RUNNER_TOKEN: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.SELF_HOSTED_RUNNER_TOKEN || '' }}
          REPO: ${{ github.repository }}
        run: |
          $use = 'false'
          if ($env:SAME_REPO -ceq 'true' -and -not [string]::IsNullOrWhiteSpace($env:RUNNER_TOKEN)) {
            try {
              $headers = @{ Authorization = "Bearer $($env:RUNNER_TOKEN)"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
              $resp = Invoke-RestMethod -Uri "https://api.github.com/repos/$($env:REPO)/actions/runners?per_page=100" -Headers $headers -TimeoutSec 10 -ErrorAction Stop
              $idle = @($resp.runners | Where-Object { $_.status -eq 'online' -and -not $_.busy -and @($_.labels.name) -contains 'aidotnet-cpu' })
              if ($idle.Count -gt 0) { $use = 'true' }
            } catch {
              Write-Host "Self-hosted runner probe fell back to ubuntu-latest: $($_.Exception.Message)"
            }
          }
          "use_self_hosted=$use" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

  auto-fix-pr-title-self-hosted:
    needs: [select-runner]
    if: ${{ needs.select-runner.outputs.use_self_hosted == 'true' }}
    name: Auto-Fix PR Title (self-hosted attempt)
    runs-on: [self-hosted, aidotnet-cpu]
    continue-on-error: true
    timeout-minutes: 5
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps: &pr-title-steps
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Auto-fix PR title to conventional commits format
        id: fix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const prTitle = context.payload.pull_request.title;
            const pattern = /^(feat|fix|docs|refactor|perf|test|chore|ci|style|deps)(\(.+\))?!?: .+/;

            if (pattern.test(prTitle)) {
              core.info(`✅ PR title already valid: ${prTitle}`);
              return;
            }

            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const filenames = files.data.map(f => f.filename);
            core.info(`Files changed: ${filenames.join(', ')}`);

            let type = 'chore';
            let reasoning = 'default type';

            const hasDocsFiles = filenames.some(f => f.match(/\.(md|txt)$/) || f.includes('README') || f.includes('CONTRIBUTING'));
            const hasTestFiles = filenames.some(f => f.includes('test') || f.includes('Test') || f.includes('.spec.') || f.includes('.test.'));
            const hasCIFiles = filenames.some(f => f.startsWith('.github/workflows/') || f.includes('ci/') || f.includes('.yml'));
            const hasSrcFiles = filenames.some(f => f.match(/\.(cs|js|ts|py|java|cpp|c|h)$/));

            const lowerTitle = prTitle.toLowerCase();

            if (lowerTitle.match(/^(add|implement|create|introduce)/)) {
              type = 'feat';
              reasoning = 'title starts with add/implement/create/introduce';
            } else if (lowerTitle.match(/^(fix|correct|resolve|patch)/)) {
              type = 'fix';
              reasoning = 'title starts with fix/correct/resolve/patch';
            } else if (lowerTitle.match(/^(update|improve|enhance|optimize)/)) {
              if (hasDocsFiles) {
                type = 'docs';
                reasoning = 'updating documentation files';
              } else {
                type = 'refactor';
                reasoning = 'title suggests improvement/enhancement';
              }
            } else if (lowerTitle.match(/^(refactor|restructure|reorganize)/)) {
              type = 'refactor';
              reasoning = 'title starts with refactor/restructure/reorganize';
            } else if (lowerTitle.match(/^(deps|dependency|bump)/)) {
              type = 'deps';
              reasoning = 'title mentions dependency update';
            } else if (hasDocsFiles && filenames.length === filenames.filter(f => f.match(/\.(md|txt)$/)).length) {
              type = 'docs';
              reasoning = 'only documentation files changed';
            } else if (hasTestFiles && !hasSrcFiles) {
              type = 'test';
              reasoning = 'only test files changed';
            } else if (hasCIFiles) {
              type = 'ci';
              reasoning = 'CI/workflow files changed';
            } else if (lowerTitle.includes('document') || lowerTitle.includes('readme')) {
              type = 'docs';
              reasoning = 'title mentions documentation';
            } else if (lowerTitle.includes('test')) {
              type = 'test';
              reasoning = 'title mentions tests';
            } else if (lowerTitle.includes('perf') || lowerTitle.includes('performance') || lowerTitle.includes('optimi')) {
              type = 'perf';
              reasoning = 'title mentions performance';
            }

            let description = prTitle.trim();
            description = description.charAt(0).toLowerCase() + description.slice(1);
            const newTitle = `${type}: ${description}`;

            core.info(`Original: ${prTitle}`);
            core.info(`New: ${newTitle}`);
            core.info(`Type: ${type} (${reasoning})`);

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              title: newTitle
            });

            let versionBump = 'No release';
            if (['feat', 'fix', 'docs', 'refactor', 'perf'].includes(type)) {
              versionBump = 'MINOR version bump (0.1.0 → 0.2.0)';
            }

            const comment = `🤖 **PR Title Auto-Fixed**

            Your PR title was automatically updated to follow [Conventional Commits](https://www.conventionalcommits.org/) format.

            **Original title:**
            \`${prTitle}\`

            **New title:**
            \`${newTitle}\`

            **Detected type:** \`${type}:\` (${reasoning})
            **Version impact:** ${versionBump}

            ---

            **Valid types and their effects:**
            - \`feat:\` - New feature (MINOR bump: 0.1.0 → 0.2.0)
            - \`fix:\` - Bug fix (MINOR bump)
            - \`docs:\` - Documentation (MINOR bump)
            - \`refactor:\` - Code refactoring (MINOR bump)
            - \`perf:\` - Performance improvement (MINOR bump)
            - \`test:\` - Tests only (no release)
            - \`chore:\` - Build/tooling (no release)
            - \`ci:\` - CI/CD changes (no release)
            - \`style:\` - Code formatting (no release)
            - \`deps:\` - Dependency update (no release)

            If the detected type is incorrect, you can manually edit the PR title.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: comment
            });

      - name: Record self-hosted success
        id: mark
        if: steps.fix.outcome == 'success'
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  auto-fix-pr-title:
    needs: [select-runner, auto-fix-pr-title-self-hosted]
    if: ${{ always() && !cancelled() && (github.event.pull_request.draft != true) && (!startsWith(github.head_ref, 'release-please--')) }}
    name: Auto-Fix PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip hosted fallback when self-hosted succeeded
        if: needs.auto-fix-pr-title-self-hosted.outputs.passed == 'true'
        run: echo "Auto-Fix PR Title already succeeded on self-hosted runner."

      - name: Checkout code (ubuntu-latest fallback)
        if: needs.auto-fix-pr-title-self-hosted.outputs.passed != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Auto-fix PR title to conventional commits format (ubuntu-latest fallback)
        if: needs.auto-fix-pr-title-self-hosted.outputs.passed != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const prTitle = context.payload.pull_request.title;
            const pattern = /^(feat|fix|docs|refactor|perf|test|chore|ci|style|deps)(\(.+\))?!?: .+/;

            if (pattern.test(prTitle)) {
              core.info(`✅ PR title already valid: ${prTitle}`);
              return;
            }

            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const filenames = files.data.map(f => f.filename);
            let type = 'chore';
            let reasoning = 'default type';

            const hasDocsFiles = filenames.some(f => f.match(/\.(md|txt)$/) || f.includes('README') || f.includes('CONTRIBUTING'));
            const hasTestFiles = filenames.some(f => f.includes('test') || f.includes('Test') || f.includes('.spec.') || f.includes('.test.'));
            const hasCIFiles = filenames.some(f => f.startsWith('.github/workflows/') || f.includes('ci/') || f.includes('.yml'));
            const hasSrcFiles = filenames.some(f => f.match(/\.(cs|js|ts|py|java|cpp|c|h)$/));
            const lowerTitle = prTitle.toLowerCase();

            if (lowerTitle.match(/^(add|implement|create|introduce)/)) {
              type = 'feat'; reasoning = 'title starts with add/implement/create/introduce';
            } else if (lowerTitle.match(/^(fix|correct|resolve|patch)/)) {
              type = 'fix'; reasoning = 'title starts with fix/correct/resolve/patch';
            } else if (lowerTitle.match(/^(update|improve|enhance|optimize)/)) {
              type = hasDocsFiles ? 'docs' : 'refactor';
              reasoning = hasDocsFiles ? 'updating documentation files' : 'title suggests improvement/enhancement';
            } else if (lowerTitle.match(/^(refactor|restructure|reorganize)/)) {
              type = 'refactor'; reasoning = 'title starts with refactor/restructure/reorganize';
            } else if (lowerTitle.match(/^(deps|dependency|bump)/)) {
              type = 'deps'; reasoning = 'title mentions dependency update';
            } else if (hasDocsFiles && filenames.length === filenames.filter(f => f.match(/\.(md|txt)$/)).length) {
              type = 'docs'; reasoning = 'only documentation files changed';
            } else if (hasTestFiles && !hasSrcFiles) {
              type = 'test'; reasoning = 'only test files changed';
            } else if (hasCIFiles) {
              type = 'ci'; reasoning = 'CI/workflow files changed';
            } else if (lowerTitle.includes('document') || lowerTitle.includes('readme')) {
              type = 'docs'; reasoning = 'title mentions documentation';
            } else if (lowerTitle.includes('test')) {
              type = 'test'; reasoning = 'title mentions tests';
            } else if (lowerTitle.includes('perf') || lowerTitle.includes('performance') || lowerTitle.includes('optimi')) {
              type = 'perf'; reasoning = 'title mentions performance';
            }

            let description = prTitle.trim();
            description = description.charAt(0).toLowerCase() + description.slice(1);
            const newTitle = `${type}: ${description}`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              title: newTitle
            });

            let versionBump = 'No release';
            if (['feat', 'fix', 'docs', 'refactor', 'perf'].includes(type)) {
              versionBump = 'MINOR version bump (0.1.0 → 0.2.0)';
            }

            const comment = `🤖 **PR Title Auto-Fixed**\n\nYour PR title was automatically updated to follow [Conventional Commits](https://www.conventionalcommits.org/) format.\n\n**Original title:** \`${prTitle}\`\n**New title:** \`${newTitle}\`\n**Detected type:** \`${type}:\` (${reasoning})\n**Version impact:** ${versionBump}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: comment
            });
