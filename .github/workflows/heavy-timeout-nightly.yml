name: Heavy Timeout Models (nightly)

# Best-effort tracking lane for models tagged [Trait("Category","HeavyTimeout")].
#
# These models are CORRECT but inherently too slow for the per-test / 45-min budget of the
# default sharded test workflow (Build & SonarCloud), so they are EXCLUDED there via
# `&Category!=HeavyTimeout` and the default PR gate stays green. This workflow runs them
# separately with a long job budget so we keep visibility on them and notice if one regresses
# or — as the perf work lands — becomes fast enough to graduate back into the default shards
# (drop the trait, restore a normal [Fact(Timeout)]).
#
# It is INFORMATIONAL, not a merge gate: it is not a required check and never blocks a PR.
# Individual tests may still hit their own [Fact(Timeout=...)] — that is expected for the
# heaviest models and is exactly what the umbrella tracking issue records. The point is the
# dashboard, not a pass/fail gate.

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC nightly
  workflow_dispatch:
    inputs:
      chunk_size:
        description: 'Test classes per test-host process. Lower bounds peak memory; higher spends less time re-discovering the assembly.'
        required: false
        default: '6'

# Don't fight the PR test workflow's concurrency group; this is its own long-running lane.
concurrency:
  group: heavy-timeout-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  heavy-timeout:
    name: Heavy Timeout Models
    runs-on: ubuntu-latest
    timeout-minutes: 350   # generous budget; these models are the slow ones by definition
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # This lane only reads + uploads test artifacts; it never pushes, so don't leave the
          # GITHUB_TOKEN persisted in .git/config where it could leak into an uploaded artifact (artipacked).
          persist-credentials: false

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/AiDotNet.Tests/AiDotNetTests.csproj

      - name: Inject license public key (aidn2 offline verification, test-only key set)
        # Embed the TEST key set (prod + ci-2026a) so the build can verify the offline aidn2 CI token in
        # AIDOTNET_LICENSE_KEY on the real path (else the ModuleInitializer falls back to a synthetic license —
        # tests still pass, just not exercising real verification). The CI key is NOT shipped: only
        # release-please.yml's separate AIDOTNET_LICENSE_PUBLIC_KEY_JSON (prod-only) reaches published NuGets.
        shell: bash
        run: |
          mkdir -p src/BuildKey
          if [ -n "${{ vars.AIDOTNET_LICENSE_PUBLIC_KEY_JSON_TEST || vars.AIDOTNET_LICENSE_PUBLIC_KEY_JSON || secrets.AIDOTNET_LICENSE_PUBLIC_KEY_JSON }}" ]; then
            printf '%s' "${{ vars.AIDOTNET_LICENSE_PUBLIC_KEY_JSON_TEST || vars.AIDOTNET_LICENSE_PUBLIC_KEY_JSON || secrets.AIDOTNET_LICENSE_PUBLIC_KEY_JSON }}" > src/BuildKey/LicensePublicKey.json
            echo "Injected LicensePublicKey.json ($(wc -c < src/BuildKey/LicensePublicKey.json) bytes)"
          else
            echo "No license public key configured — using the committed src/BuildKey/LicensePublicKey.json if present."
          fi

      - name: Build (Release, net10.0)
        run: dotnet build tests/AiDotNet.Tests/AiDotNetTests.csproj -c Release --framework net10.0 --no-restore

      - name: Run heavy-timeout models (best-effort, non-gating)
        # Only the tagged models. A category filter alone does NOT keep xUnit serial, so the built
        # xunit.runner.json is rewritten to serialize collection execution (one model in flight at a
        # time) and Workstation GC is selected. Without this the heaviest models stack memory and
        # OOM/cancel the lane instead of giving the visibility this workflow exists for.
        #
        # Hardening comes from harden-xunit-runner.ps1 rather than being repeated here. This lane had
        # its own copy, and the copy had already drifted: it serialized and disabled theory
        # pre-enumeration but never turned the discovery diagnostics off, which is the one setting
        # that keeps this job's log under GitHub's per-job cap. --filter is applied AFTER xUnit has
        # discovered the WHOLE assembly, so the diagnostic volume is set by the assembly's ~72k cases
        # and not by the 11 tests this lane selects; see harden-xunit-runner.ps1, which records a job
        # that emitted 57,102 discovery lines and a 16.9 MB log covering only its first 2m44s, with
        # zero test results retained. (The 20-lines-to-0 figure in the PR description is a different
        # scope: a local --no-build run already filtered to the 11 tests.) That is the same drift that
        # left the sonarcloud.yml jobs unhardened until they were switched to the script.
        #
        # Invoked inline in THIS pwsh process on purpose: the script sets DOTNET_gcServer for the
        # current process (and GITHUB_ENV for a later step), and environment variables are
        # process-wide, so the dotnet test below inherits it without a separate step that
        # workflow-level env would override.
        shell: pwsh
        continue-on-error: true
        # Scoped to this test step only (not job-wide) so the credential is not exposed to other steps or
        # third-party actions. Licensed key keeps save/load-heavy suites under the free-trial op limit.
        env:
          # Dedicated enterprise CI license key (save-capable, ~unlimited activations). ModuleInitializer
          # swaps it for the deterministic synthetic offline license for the suite; it also validates online.
          AIDOTNET_LICENSE_KEY: ${{ secrets.AIDOTNET_LICENSE_KEY }}
          HEAVY_CHUNK_SIZE: ${{ inputs.chunk_size }}
        run: |
          # Exits 1 when the runner config is missing, which is the same fail-fast this lane had: these
          # models are flagged heavy precisely because they OOM without serialization, so falling
          # through to a parallel run would waste the runner to reach the same failure.
          ./.github/scripts/harden-xunit-runner.ps1 -RunnerJson 'tests/AiDotNet.Tests/bin/Release/net10.0/xunit.runner.json'

          # RUN IN CHUNKS, EACH IN ITS OWN PROCESS (#2087).
          #
          # A single `dotnet test` over the whole category ran every paper-scale model in one test
          # host, and the host's memory only ever grew: serialized execution stops them overlapping
          # but does not return a model's weights to the OS between classes. The 16 GB hosted runner
          # was reached partway through and the OOM killer took the runner agent with it, which
          # GitHub reports as "The runner has received a shutdown signal" rather than as a test
          # failure. `continue-on-error` cannot catch that -- a dead runner is not a failed step.
          #
          # That it was cumulative rather than one bad model is visible in where it died on five
          # consecutive nights: Mask2Former (09-09), MoMask (09-08), CogView4 (09-06) and SDXLTurbo
          # (09-05), between 9 minutes and 1.5 hours in. Different model every night, always a few
          # minutes after the previous test passed.
          #
          # Chunking rather than one-process-per-class: this lane now covers 219 classes / ~3,800
          # tests, not the 11 tests the previous comment here described, because the generator's
          # HeavyTimeoutTestClassNames set has grown to include the whole Diffusion family. VSTest
          # discovers the entire ~72k-case assembly on every invocation regardless of --filter, so
          # 219 invocations would spend most of the budget re-discovering. A chunk bounds peak
          # memory to ChunkSize classes while paying discovery once per chunk.
          #
          # ChunkSize is deliberately small. Past runs died within roughly 8-19 minutes of starting
          # tests, which is only a handful of these classes, so the ceiling is reached quickly.
          $chunkSize   = if ($env:HEAVY_CHUNK_SIZE) { [int]$env:HEAVY_CHUNK_SIZE } else { 6 }
          $testProject = 'tests/AiDotNet.Tests/AiDotNetTests.csproj'
          $resultsDir  = 'artifacts/heavy-timeout'
          New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null

          function Get-AvailableMemoryMb {
            # /proc/meminfo is the runner's own view. nproc-based estimates and GC counters both
            # report the process, and the thing being exhausted here is the machine.
            $line = Select-String -Path '/proc/meminfo' -Pattern '^MemAvailable:\s+(\d+) kB' -ErrorAction SilentlyContinue
            if ($null -eq $line) { return -1 }
            return [int]([int]$line.Matches[0].Groups[1].Value / 1024)
          }

          # Discovered, not hardcoded. HeavyTimeout comes from two places -- hand-written
          # [Trait("Category","HeavyTimeout")] attributes AND TestScaffoldGenerator's
          # HeavyTimeoutTestClassNames set -- so any list written here would drift out of step with
          # the generator the first time a model is added to it.
          Write-Host '--- discovering HeavyTimeout test classes ---'
          $listed = dotnet test $testProject -c Release --framework net10.0 --no-build --no-restore `
            --filter 'Category=HeavyTimeout' --list-tests 2>&1

          $classes = $listed |
            ForEach-Object { $_ -replace '\r', '' } |
            Where-Object { $_ -match '^\s{4}\S+\.\S+' } |
            ForEach-Object { ($_.Trim() -split '\(')[0] } |
            ForEach-Object { $_.Substring(0, $_.LastIndexOf('.')) } |
            Sort-Object -Unique

          if (-not $classes -or $classes.Count -eq 0) {
            # Discovery returning nothing would otherwise "pass" this lane by running no tests at
            # all, which is the same silent zero-coverage this issue is about.
            Write-Host '::error title=No HeavyTimeout tests discovered::The lane found no test classes, so it would report success having run nothing.'
            $listed | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }
            exit 1
          }

          $chunks = @()
          for ($i = 0; $i -lt $classes.Count; $i += $chunkSize) {
            $end = [Math]::Min($i + $chunkSize - 1, $classes.Count - 1)
            $chunks += ,@($classes[$i..$end])
          }

          Write-Host "--- $($classes.Count) HeavyTimeout class(es) in $($chunks.Count) chunk(s) of up to $chunkSize, one process each ---"

          $rows   = @()
          $failed = 0
          $index  = 0

          foreach ($chunk in $chunks) {
            $index++
            $label   = 'chunk{0:d3}' -f $index
            $filter  = 'Category=HeavyTimeout&(' + (($chunk | ForEach-Object { "FullyQualifiedName~$_" }) -join '|') + ')'
            $names   = ($chunk | ForEach-Object { $_.Substring($_.LastIndexOf('.') + 1) }) -join ', '
            $memPre  = Get-AvailableMemoryMb
            $started = Get-Date

            Write-Host "::group::$label ($($chunk.Count)): $names  -- MemAvailable ${memPre} MB before"

            dotnet test $testProject -c Release --framework net10.0 --no-build --no-restore `
              --filter $filter `
              --logger "trx;LogFileName=$label.trx" `
              --logger 'console;verbosity=normal' `
              --results-directory $resultsDir
            $exit = $LASTEXITCODE

            $memPost  = Get-AvailableMemoryMb
            $duration = [int]((Get-Date) - $started).TotalSeconds
            Write-Host '::endgroup::'

            if ($exit -ne 0) { $failed++ }
            $rows += [pscustomobject]@{
              Label = $label; Names = $names; Exit = $exit
              Seconds = $duration; MemPre = $memPre; MemPost = $memPost
            }
            Write-Host "$label -> exit $exit in ${duration}s (MemAvailable ${memPre} MB -> ${memPost} MB)"
          }

          # The dashboard this lane exists to be. Reading it should not require opening the log,
          # and the memory columns are what turns the next runner death into evidence rather than
          # another "shutdown signal" with nothing behind it.
          $summary = @()
          $summary += '## Heavy Timeout Models'
          $summary += ''
          $summary += "$($classes.Count) classes in $($chunks.Count) chunk(s) of up to $chunkSize, one process each. $failed chunk(s) failed."
          $summary += ''
          $summary += '| Chunk | Result | Seconds | Mem before | Mem after | Classes |'
          $summary += '|---|---|---:|---:|---:|---|'
          foreach ($r in $rows) {
            $result = if ($r.Exit -eq 0) { 'pass' } else { "FAIL (exit $($r.Exit))" }
            $summary += "| $($r.Label) | $result | $($r.Seconds) | $($r.MemPre) MB | $($r.MemPost) MB | $($r.Names) |"
          }
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          Write-Host "=== $($chunks.Count) chunk(s) run, $failed failed ==="
          if ($failed -gt 0) { exit 1 }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: heavy-timeout-results
          path: artifacts/heavy-timeout
          if-no-files-found: ignore
