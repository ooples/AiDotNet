name: DIAG StyDiff clone flake

# TEMPORARY DIAGNOSTIC SCAFFOLDING — deleted before the fix PR is opened.
#
# diag/** triggers no other workflow (ci-proof/** would trigger the full
# sonarcloud.yml matrix), and this file exists only on the diag branch.
#
# RUN 4: reproduce the REAL shard, in ONE process, under the REAL conditions.
#
# What the earlier runs established on this same ubuntu-latest runner:
#   run 1  standalone probe, 50 iterations, clean process ......... 0 divergence
#          also measured Conv2D vs Conv2DInto on Linux with
#          IsOSPlatform(Windows)=false -> differing=0, killing the
#          ConvolutionalLayer.cs:1503 platform-fork theory at Tensors 0.130.3
#   run 2  MDOP {1,2,4,8} x burners {0,4,8}, 120 comparisons ...... 0 divergence
#          killing the managed-GEMM-partitioning / CPU-contention theory
#   run 3  (cancelled, superseded) looped the real test but in a FRESH PROCESS
#          per loop and with DOTNET_gcServer=1 -- neither matches the shard
#
# Meanwhile the real failures were recovered straight from CI history:
#   2026-09-11 StyDiffModelTests.Clone_ShouldProduceIdenticalOutput
#     output[58] = 9.178478E-002 differs from 9.180490E-002 by 2.012402E-005,
#     exceeds tolerance 1.137707E-005   (= 1e-5 + 1.5e-5*|expected|, i.e. the
#     StyDiff override IS active and STILL fails)
#   2026-09-08 InstantStyleModelTests.Clone_ShouldProduceIdenticalOutput
#     output[2] = -4.626447E+000 differs from -4.626425E+000 by 2.241135E-005,
#     exceeds tolerance 1.601435E-005   (= 1e-5 + 1.3e-6*|expected|, the BASE
#     tolerance -- so this is NOT StyDiff-specific)
#
# In the failing run Predict_ShouldBeDeterministic PASSED in the same class, so
# it is not general run-to-run nondeterminism. The one variable every clean-room
# attempt lacked is in-process pollution from sibling models, plus the heavy
# shard's Workstation GC. This run supplies exactly that.

on:
  push:
    branches:
      - 'diag/**'
  workflow_dispatch:
    inputs:
      phase_a_minutes:
        description: 'Minutes looping the FULL Step-Sync shard (fidelity)'
        required: false
        default: '26'
      phase_b_minutes:
        description: 'Minutes looping only the Clone tests of that shard (power)'
        required: false
        default: '26'

permissions: read-all

concurrency:
  group: diag-stydiff-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  # The failing shard is in $heavyShards, and heavy shards run
  # "Workstation GC (DOTNET_gcServer=0) + serial collections".
  DOTNET_gcServer: 0

jobs:
  repro:
    name: Loop the real Diffusion Step-Sync shard (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/swift /usr/local/share/boost || true
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium || true
          df -h /

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Report runner topology
        run: |
          echo "nproc : $(nproc)"; uname -a; ldd --version | head -1; free -g

      - name: Restore dependencies
        run: dotnet restore

      - name: Build source generator
        run: dotnet build src/AiDotNet.Generators/AiDotNet.Generators.csproj -c Release --no-restore

      - name: Build test project (net10.0)
        run: dotnet build tests/AiDotNet.Tests/AiDotNetTests.csproj -c Release --no-restore -f net10.0 -m:4

      - name: Serialize collections like a heavy shard
        run: |
          cfg=tests/AiDotNet.Tests/bin/Release/net10.0/xunit.runner.json
          if [ -f "$cfg" ]; then
            jq '.parallelizeAssembly=false | .parallelizeTestCollections=false | .maxParallelThreads=1' \
              "$cfg" > "$cfg.tmp" && mv "$cfg.tmp" "$cfg"
            echo "serialized runner config:"; cat "$cfg"
          else
            echo "::warning::runner config not found at $cfg"
          fi

      - name: Phase A — loop the FULL Step-Sync shard in one process each
        env:
          AIDOTNET_LICENSE_KEY: ${{ secrets.AIDOTNET_LICENSE_KEY }}
        run: |
          set +e
          mkdir -p diag-out
          SHARD='FullyQualifiedName~ModelFamilyTests.Diffusion&(FullyQualifiedName~Diffusion.Step|FullyQualifiedName~Diffusion.Stitch|FullyQualifiedName~Diffusion.Streaming|FullyQualifiedName~Diffusion.Sty|FullyQualifiedName~Diffusion.SUPIR|FullyQualifiedName~Diffusion.Swift|FullyQualifiedName~Diffusion.Sync)'
          minutes="${{ github.event.inputs.phase_a_minutes || '26' }}"
          deadline=$(( $(date +%s) + (minutes * 60) ))
          runs=0; fails=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            runs=$((runs + 1))
            set -o pipefail
            dotnet test tests/AiDotNet.Tests/AiDotNetTests.csproj -c Release -f net10.0 --nologo \
              --no-build --no-restore \
              --filter "(${SHARD})&Category!=HeavyTimeout&Category!=ModelPerformanceCensus" \
              2>&1 | tee current.txt
            status=${PIPESTATUS[0]}
            set +o pipefail
            if grep -aq "Clone() output\[" current.txt; then
              fails=$((fails + 1))
              echo "::warning::PHASE A CLONE DIVERGENCE on loop ${runs}"
              {
                echo "########## phase A loop ${runs} (exit ${status}) ##########"
                grep -aE "Clone\(\) output\[|\[FAIL\]" current.txt | head -40
              } >> diag-out/failures.txt
            fi
            rm -f current.txt
          done
          echo "PHASE A: ${runs} full-shard runs, ${fails} with a clone divergence" | tee -a diag-out/summary.txt

      - name: Phase B — loop only the shard's Clone tests (max iterations)
        if: always()
        env:
          AIDOTNET_LICENSE_KEY: ${{ secrets.AIDOTNET_LICENSE_KEY }}
        run: |
          set +e
          mkdir -p diag-out
          SHARD='FullyQualifiedName~ModelFamilyTests.Diffusion&(FullyQualifiedName~Diffusion.Step|FullyQualifiedName~Diffusion.Stitch|FullyQualifiedName~Diffusion.Streaming|FullyQualifiedName~Diffusion.Sty|FullyQualifiedName~Diffusion.SUPIR|FullyQualifiedName~Diffusion.Swift|FullyQualifiedName~Diffusion.Sync)'
          minutes="${{ github.event.inputs.phase_b_minutes || '26' }}"
          deadline=$(( $(date +%s) + (minutes * 60) ))
          runs=0; fails=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            runs=$((runs + 1))
            set -o pipefail
            dotnet test tests/AiDotNet.Tests/AiDotNetTests.csproj -c Release -f net10.0 --nologo \
              --no-build --no-restore \
              --filter "(${SHARD})&Category!=HeavyTimeout&Category!=ModelPerformanceCensus&FullyQualifiedName~Clone_ShouldProduceIdenticalOutput" \
              2>&1 | tee current.txt
            status=${PIPESTATUS[0]}
            set +o pipefail
            if grep -aq "Clone() output\[" current.txt; then
              fails=$((fails + 1))
              echo "::warning::PHASE B CLONE DIVERGENCE on loop ${runs}"
              {
                echo "########## phase B loop ${runs} (exit ${status}) ##########"
                grep -aE "Clone\(\) output\[|\[FAIL\]" current.txt | head -40
              } >> diag-out/failures.txt
            fi
            rm -f current.txt
          done
          echo "PHASE B: ${runs} clone-only runs, ${fails} with a clone divergence" | tee -a diag-out/summary.txt

      - name: Report
        if: always()
        run: |
          echo "===== SUMMARY ====="; cat diag-out/summary.txt 2>/dev/null || echo "(none)"
          echo "===== DIVERGENCES ====="
          cat diag-out/failures.txt 2>/dev/null || echo "(none captured - did NOT reproduce)"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: stydiff-repro-output
          path: diag-out/
          if-no-files-found: warn
