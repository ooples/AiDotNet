name: DIAG StyDiff clone flake

# TEMPORARY DIAGNOSTIC SCAFFOLDING — deleted before the fix PR is opened.
#
# diag/** triggers no other workflow (ci-proof/** would trigger the full
# sonarcloud.yml matrix), and this file exists only on the diag branch.
#
# RUN 6 — chase the DETERMINISTIC case, cheaply.
#
# A wider scan of 40 failed CI runs turned up FOUR distinct clone assertions, and
# one of them is not flaky at all:
#
#   ModelFamily - Diffusion D-I, 6 runs across 2026-09-06/07/08, BIT-IDENTICAL:
#     Clone() output[2] = -4.626447E+000 differs from -4.626425E+000
#     by 2.241135E-005, exceeds its own tolerance 1.601435E-005  (= base 1.3e-6 rtol)
#   -> InstantStyleModelTests. Same index, same values, same diff to 7 digits.
#
#   ModelFamily - Diffusion Step-Sync (StyDiff, rtol 1.5e-5) hits a DIFFERENT
#   element every time: output[311], output[347], output[58]. That one is the
#   genuinely intermittent case.
#
# A deterministic divergence is directly localisable, so this run targets it.
# Locally on Windows the InstantStyle clone is bit-identical (0/3) — but the value
# itself is platform-dependent (Windows output[2]=-4.626414 vs Linux -4.626425),
# a ~1.1e-5 gap of the same order as the divergence. So this must run on Linux.
#
# This run is PROBE-ONLY and therefore cheap: no test-project build (~13 min saved)
# and no test loops (~50 min saved). It also adds the discriminator the suite has
# never had — comparing clone PARAMETERS, not just output:
#   parameters identical -> compute-path difference
#   parameters differ    -> a real clone weight-fidelity bug
#
# Earlier runs, all on this same runner:
#   run 1  50 iterations, clean process ................. 0 divergence; also proved
#          Conv2D vs Conv2DInto agree on Linux at Tensors 0.130.3
#   run 2  MDOP {1,2,4,8} x burners {0,4,8} ............. 0 divergence
#   run 3  cancelled (fresh process per loop, wrong GC mode)
#   run 4  cancelled (superseded)
#   run 5  cancelled (its Phase 0 arms are inert — invalidating InferenceWeightCache
#          costs 0.96-1.08x, so that cache is not engaged on this path — and its
#          Phase 1 filtered Step-Sync, which cannot reach InstantStyle)

on:
  push:
    branches:
      - 'diag/**'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Iterations for the InstantStyle deterministic probe'
        required: false
        default: '6'

permissions: read-all

concurrency:
  group: diag-stydiff-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  AIDOTNET_DISABLE_GPU: 1

jobs:
  probe:
    name: InstantStyle deterministic probe (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/swift /usr/local/share/boost || true
          df -h /

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Report runner topology
        run: |
          echo "nproc : $(nproc)"; uname -a; ldd --version | head -1

      - name: Build source generator
        run: dotnet build src/AiDotNet.Generators/AiDotNet.Generators.csproj -c Release

      - name: Build probe
        run: dotnet build tools/StyDiffCloneProbe/StyDiffCloneProbe.csproj -c Release -m:4

      - name: Arm 1 — probe with tiered JIT ON (default)
        run: |
          mkdir -p diag-out
          dotnet run --project tools/StyDiffCloneProbe/StyDiffCloneProbe.csproj \
            -c Release --no-build \
            -- --iterations "${{ github.event.inputs.iterations || '6' }}" --mdop-sweep "4" \
            2>&1 | tee diag-out/probe-tiering-on.txt

      # Run 6 showed this runner reports Avx512=True while run 1's reported False, so the
      # ubuntu-latest fleet is heterogeneous and emits different SIMD codegen for the same IL.
      # The remaining untested mechanism is the Tier0 -> Tier1 transition: the original's
      # Predict drives the hot kernels past the tier-up threshold, so the CLONE's Predict can
      # execute differently-vectorised code with identical weights. If the cold-start arm
      # diverges with tiering ON and is clean with it OFF, that is the mechanism.
      - name: Arm 2 — probe with DOTNET_TieredCompilation=0
        if: always()
        env:
          DOTNET_TieredCompilation: '0'
        run: |
          mkdir -p diag-out
          dotnet run --project tools/StyDiffCloneProbe/StyDiffCloneProbe.csproj \
            -c Release --no-build \
            -- --iterations "${{ github.event.inputs.iterations || '6' }}" --mdop-sweep "4" \
            2>&1 | tee diag-out/probe-tiering-off.txt

      - name: Compare the two arms
        if: always()
        run: |
          echo "===== COLD START, TIERING ON ====="
          grep -A6 "COLD START" diag-out/probe-tiering-on.txt 2>/dev/null || echo "(none)"
          echo "===== COLD START, TIERING OFF ====="
          grep -A6 "COLD START" diag-out/probe-tiering-off.txt 2>/dev/null || echo "(none)"
          echo "===== ISA (fleet is heterogeneous) ====="
          grep -h "Sse2/Avx" diag-out/*.txt 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: stydiff-probe-output
          path: diag-out/
          if-no-files-found: warn
