name: DIAG StyDiff clone flake

# TEMPORARY DIAGNOSTIC SCAFFOLDING — deleted before the fix PR is opened.
#
# Deliberately NOT named ci-proof/** (that prefix triggers the full
# sonarcloud.yml matrix). The diag/** prefix triggers no other workflow, and
# this file exists only on the diag branch, so the cost is one ubuntu runner.
#
# Builds ONLY the source generator + src/AiDotNet.csproj + the probe console
# app, skipping the ~13-minute test-project build entirely.

on:
  push:
    branches:
      - 'diag/**'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Clone-vs-original iterations to run'
        required: false
        default: '50'
      procs:
        description: 'DOTNET_PROCESSOR_COUNT override (empty = runner default)'
        required: false
        default: ''

permissions: read-all

concurrency:
  group: diag-stydiff-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  AIDOTNET_DISABLE_GPU: 1

jobs:
  probe:
    name: StyDiff clone probe (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/swift /usr/local/share/boost || true
          df -h /

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Report runner topology
        run: |
          echo "nproc            : $(nproc)"
          echo "kernel           : $(uname -a)"
          echo "libc             : $(ldd --version | head -1)"
          lscpu | grep -Ei 'model name|^cpu\(s\)|thread|core|flags' | head -8

      - name: Build source generator
        run: dotnet build src/AiDotNet.Generators/AiDotNet.Generators.csproj -c Release

      - name: Build probe (pulls src/AiDotNet.csproj transitively)
        run: dotnet build tools/StyDiffCloneProbe/StyDiffCloneProbe.csproj -c Release -m:4

      - name: Run StyDiff clone probe
        env:
          DOTNET_PROCESSOR_COUNT: ${{ github.event.inputs.procs }}
        run: |
          dotnet run --project tools/StyDiffCloneProbe/StyDiffCloneProbe.csproj \
            -c Release --no-build \
            -- --iterations "${{ github.event.inputs.iterations || '50' }}" \
            2>&1 | tee probe-output.txt

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: stydiff-probe-output
          path: probe-output.txt
          if-no-files-found: warn
