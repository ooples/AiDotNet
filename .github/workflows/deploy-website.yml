name: Deploy Marketing Website

on:
  push:
    branches: [master]
    # NOTE: intentionally NOT triggering on src/** — this workflow runs Supabase migrations and
    # a Vercel prod deploy, so it must not fire on every library change. The wiki is regenerated
    # here from the current src at deploy time; a pure-src doc-comment change refreshes the live
    # wiki on the next website deploy (or via workflow_dispatch).
    paths: ['website/**', '.github/workflows/deploy-website.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-deploy
  cancel-in-progress: true

jobs:
  migrate-database:
    name: Apply Supabase Migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v1
        with:
          version: 2.84.4

      - name: Link Supabase project
        run: supabase link --project-ref yfkqwpgjahoamlgckjib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # --include-all: a migration merged after a later-dated one was already applied (for example the
      # 20260921 files, which were still pending when 20261027 was applied) must still be pushed. Without it
      # db push refuses to insert a migration before the newest remote version.
      - name: Apply Supabase migrations
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Edge functions used to be deployed by hand, so production drifted from the repo (the admin
      # resend-license-email function was never deployed at all). Deploy every function on each run;
      # per-function verify_jwt comes from supabase/config.toml.
      - name: Deploy Supabase edge functions
        run: supabase functions deploy --project-ref yfkqwpgjahoamlgckjib
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  build-and-deploy:
    name: Build & Deploy Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify required build secrets
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_STRIPE_PRO_MONTHLY_LINK: ${{ secrets.PUBLIC_STRIPE_PRO_MONTHLY_LINK }}
          PUBLIC_STRIPE_PRO_YEARLY_LINK: ${{ secrets.PUBLIC_STRIPE_PRO_YEARLY_LINK }}
          PUBLIC_STRIPE_ENTERPRISE_MONTHLY_LINK: ${{ secrets.PUBLIC_STRIPE_ENTERPRISE_MONTHLY_LINK }}
          PUBLIC_STRIPE_ENTERPRISE_YEARLY_LINK: ${{ secrets.PUBLIC_STRIPE_ENTERPRISE_YEARLY_LINK }}
        run: |
          # Fail the job here rather than deploying a site that silently
          # disables auth or ships a pricing page with dead Subscribe buttons.
          # Astro bakes these at build time — a missing or rotated secret
          # would otherwise produce a broken production bundle.
          : "${PUBLIC_SUPABASE_URL:?Missing PUBLIC_SUPABASE_URL GitHub secret}"
          : "${PUBLIC_SUPABASE_ANON_KEY:?Missing PUBLIC_SUPABASE_ANON_KEY GitHub secret}"
          # Stripe Payment Links are business-critical for /pricing/: without
          # them the Subscribe buttons become dead-end alerts. Fail fast in
          # the production deploy workflow rather than shipping a broken
          # conversion funnel. Preview/PR builds aren't guarded by this job
          # (it only runs on push to master), so contributors aren't blocked.
          : "${PUBLIC_STRIPE_PRO_MONTHLY_LINK:?Missing PUBLIC_STRIPE_PRO_MONTHLY_LINK GitHub secret}"
          : "${PUBLIC_STRIPE_PRO_YEARLY_LINK:?Missing PUBLIC_STRIPE_PRO_YEARLY_LINK GitHub secret}"
          : "${PUBLIC_STRIPE_ENTERPRISE_MONTHLY_LINK:?Missing PUBLIC_STRIPE_ENTERPRISE_MONTHLY_LINK GitHub secret}"
          : "${PUBLIC_STRIPE_ENTERPRISE_YEARLY_LINK:?Missing PUBLIC_STRIPE_ENTERPRISE_YEARLY_LINK GitHub secret}"

      # The API reference wiki is generated (not committed) from the library's XML docs.
      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Generate API reference wiki
        working-directory: ${{ github.workspace }}
        run: |
          dotnet build src/AiDotNet.csproj -c Debug -f net8.0
          dotnet run --project tools/WikiGenerator -c Debug -- src/bin/Debug/net8.0/AiDotNet.xml website/src/content/docs/reference/wiki

      - name: Build website
        run: npm run build   # astro build + pagefind index (postbuild)
        env:
          VERCEL: '1'
          # The API reference wiki adds ~10.7K content pages; raise the V8 heap so the
          # static build doesn't OOM on the runner.
          NODE_OPTIONS: '--max-old-space-size=6144'
          # Astro bakes import.meta.env.PUBLIC_* values at build time. Without these
          # the client-side Supabase client throws "Missing Supabase environment
          # variables" at page load, which in turn means every script that imports
          # src/lib/supabase.ts crashes — sign-in buttons silently become no-ops.
          # Keep these in lockstep with the Vercel project env vars.
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          # Stripe Payment Link URLs for /pricing/ Subscribe buttons.
          # Missing / empty values are rejected earlier by the "Verify required
          # build secrets" step above, which fails the job before the build
          # runs. That keeps a production deploy from ever shipping a pricing
          # page with dead-end Subscribe buttons — set the four secrets in
          # GitHub repo settings before running this workflow.
          PUBLIC_STRIPE_PRO_MONTHLY_LINK: ${{ secrets.PUBLIC_STRIPE_PRO_MONTHLY_LINK }}
          PUBLIC_STRIPE_PRO_YEARLY_LINK: ${{ secrets.PUBLIC_STRIPE_PRO_YEARLY_LINK }}
          PUBLIC_STRIPE_ENTERPRISE_MONTHLY_LINK: ${{ secrets.PUBLIC_STRIPE_ENTERPRISE_MONTHLY_LINK }}
          PUBLIC_STRIPE_ENTERPRISE_YEARLY_LINK: ${{ secrets.PUBLIC_STRIPE_ENTERPRISE_YEARLY_LINK }}

      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::Build output missing dist/index.html"
            exit 1
          fi
          PAGE_COUNT=$(find dist -name '*.html' | wc -l)
          echo "Built $PAGE_COUNT pages"
          if [ "$PAGE_COUNT" -lt 10 ]; then
            echo "::error::Suspiciously low page count ($PAGE_COUNT). Expected at least 10."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm i -g vercel@50.37.3

      - name: Prepare and deploy to Vercel Production
        working-directory: /tmp
        run: |
          mkdir -p vercel-deploy/website/dist
          cp -r $GITHUB_WORKSPACE/website/dist/* vercel-deploy/website/dist/
          cat > vercel-deploy/website/package.json << 'PKGJSON'
          {"scripts":{"build":"echo already built"}}
          PKGJSON
          cd vercel-deploy
          # One compressed archive, not a file-by-file upload: the API reference wiki (~10.7K pages) and its
          # Pagefind index put ~24.7K files in dist, and Vercel rejects an upload of more than 15,000 files
          # ("`files` should NOT have more than 15000 items"). Every production deploy failed on that since 2026-06.
          vercel deploy --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deployment summary
        if: success()
        run: |
          echo "## Marketing Website Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to Vercel Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Home](https://aidotnet.dev/)" >> $GITHUB_STEP_SUMMARY
          echo "- [Features](https://aidotnet.dev/features/)" >> $GITHUB_STEP_SUMMARY
          echo "- [Pricing](https://aidotnet.dev/pricing/)" >> $GITHUB_STEP_SUMMARY

  e2e-smoke:
    name: Post-Deploy E2E Smoke Tests
    # Gate on both the schema push and the site deploy so a partially-failed release doesn't
    # produce a green smoke signal.
    needs:
      - migrate-database
      - build-and-deploy
    uses: ./.github/workflows/website-e2e.yml
    secrets: inherit

  alert:
    name: Alert on failure
    needs: [migrate-database, build-and-deploy, e2e-smoke]
    # A failed deploy went unnoticed from June to November 2026. Open (or update) an issue.
    if: failure() && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/website-alert.yml
    permissions:
      issues: write
    with:
      result: failure
      source: Deploy Marketing Website
