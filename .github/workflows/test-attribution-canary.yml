name: Test attribution canary

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tools/TestImpact/fixtures/TestAttribution/**'
      - 'tools/TestImpact/Attribution.Protocol/**'
      - 'tools/TestImpact/Attribution.Runtime/**'
      - 'tools/TestImpact/Attribution.Xunit/**'
      - 'tools/TestImpact/Attribution.Cli/**'
      - 'tools/TestImpact/AttributionBuild.props'
      - 'tests/AiDotNet.Tests/AiDotNetTests.csproj'
      - 'tests/AiDotNet.Tests/Startup.cs'
      - 'tests/AiDotNet.Tests/ModuleInitializer.cs'
      - 'tests/AiDotNet.Tests/TestInfrastructure/IsolateTrialStateAttribute.cs'
      - 'tools/TestImpact/Test-AttributionPrototype.ps1'
      - 'tools/TestImpact/Test-AttributionBuildBinding.ps1'
      - 'tools/TestImpact/Test-PlannedAttribution.ps1'
      - 'tools/TestImpact/Test-SourceSelection.ps1'
      - 'tools/TestImpact/Test-RuntimeEffectsSlice.ps1'
      - 'Directory.Build.targets'
      - '.github/workflows/test-attribution-canary.yml'

permissions:
  contents: read

concurrency:
  group: attribution-canary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  collector-proof:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build fixture and verify attribution, negative paths, and overhead
        shell: pwsh
        run: |
          ./tools/TestImpact/Test-AttributionPrototype.ps1 -EvidenceDirectory "$env:RUNNER_TEMP/attribution-proof"
      - name: Preserve actual execution evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: attribution-proof-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/attribution-proof/proof.json
            ${{ runner.temp }}/attribution-proof/build-binding/*
            ${{ runner.temp }}/attribution-proof/discovery-*.jsonl
            ${{ runner.temp }}/attribution-proof/*.map.json
            ${{ runner.temp }}/attribution-proof/*/results.trx
            ${{ runner.temp }}/attribution-proof/*/attribution/*.json
            ${{ runner.temp }}/attribution-proof/*/attribution/*.pending
            ${{ runner.temp }}/attribution-proof/*/attribution/*.invalid
            ${{ runner.temp }}/attribution-proof/planned/*.json
            ${{ runner.temp }}/attribution-proof/planned/*.log
            ${{ runner.temp }}/attribution-proof/planned/*/results.trx
            ${{ runner.temp }}/attribution-proof/planned/*/reports/*
            ${{ runner.temp }}/attribution-proof/source-selection/*.json
            ${{ runner.temp }}/attribution-proof/source-selection/*.log
            ${{ runner.temp }}/attribution-proof/source-selection/*/results.trx
            ${{ runner.temp }}/attribution-proof/source-selection/*/reports/*
            ${{ runner.temp }}/attribution-proof/cross-assembly/*.json
            ${{ runner.temp }}/attribution-proof/cross-assembly/*.log
            ${{ runner.temp }}/attribution-proof/cross-assembly/*/results.trx
            ${{ runner.temp }}/attribution-proof/cross-assembly/*/reports/*
