name: Build & SonarCloud

permissions: read-all

# Primary build workflow - other workflows depend on this.
# Runs on ubuntu-latest; net471 targets cross-compile via the modern .NET SDK's
# auto-included reference assembly pack (no Windows runner required).
on:
  push:
    branches:
      - master
      - main
      # Permanent acceptance harness: a canary PR can be merged into an isolated proof branch to
      # exercise the real post-merge push path before a CI-routing change reaches master.
      - 'ci-proof/**'
  pull_request:
    # ready_for_review is REQUIRED: the build/test/sonar jobs below are gated on
    # `github.event.pull_request.draft != true`, so without this event type a draftâ†’ready
    # transition never re-triggers them and the PR is left with no Build/Tests run.
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge-queue compatibility: when the repository enables a queue, this is the authoritative
  # final candidate containing the latest target branch plus every PR ahead of this one.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Optional: PR number to run SonarCloud PR analysis (decorates the PR).'
        required: false
      pr_base:
        description: 'Optional: PR base branch name (e.g. master). Used only when pr_number is set.'
        required: false
        default: 'master'
      pr_repo:
        description: 'Optional: GitHub repo for PR decoration (e.g. owner/repo). Used only when pr_number is set.'
        required: false
        default: 'ooples/AiDotNet'
      collect_coverage_everywhere:
        description: 'Collect coverage on heavy and timing shards too, so the test-impact map can cover them. Slower and memory-hungry; intended for the nightly map-feeding run, not for PR validation.'
        required: false
        type: boolean
        default: false
      test_impact_map_run_id:
        description: 'Internal: exact Test impact map run whose artifact should be audited against this forced run.'
        required: false
        default: ''
  schedule:
    # Weekly CodeQL scan on Mondays at 8am UTC
    - cron: '0 8 * * 1'

concurrency:
  # Coverage-map runs are deliberately isolated from ordinary master activity. The Monday CodeQL
  # schedule and a master push must not cancel the full matrix that feeds the next map.
  # Isolate push retries: concurrency cancellation happens before the resolver can recheck the tip.
  group: build-${{ inputs.collect_coverage_everywhere && 'coverage-map' || github.event.pull_request.number || (github.event_name == 'push' && github.run_attempt > 1 && format('push-retry-{0}', github.run_id)) || github.ref }}
  # A synchronize event captured while a PR was still a draft can be delivered after the
  # ready_for_review run has started. Its job-level draft gates intentionally skip validation,
  # so it must never cancel the real ready run and replace it with an all-skipped check suite.
  cancel-in-progress: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

  # ---------------------------------------------------------------------------
  # Memory-management knobs for CI test execution
  # ---------------------------------------------------------------------------
  #
  # Streaming-pool threshold engagement (AIDOTNET_STREAMING_THRESHOLD_PARAMS
  # below the compiled 10 B default) has been attempted twice in this PR:
  #  1. b43dd9323: 1 M â€” produced
  #     `WeightRegistry.Configure: existing streaming pool has N registered
  #     entries` because the pool state leaked across xUnit-parallel
  #     collections.
  #  2. 81052b16f: 100 M â€” even with `WeightRegistry.Reset()` in
  #     NeuralNetworkModelTestBase.InitializeAsync (commit 8ab358d2b), this
  #     produced a new class of failures: `Streaming pool: handle N is
  #     unknown` on SimCSE and other models. The pool was being reset, but
  #     tensor instances from the prior test still hold stale streaming-pool
  #     handle references that point at the cleared state; on materialize the
  #     pool throws because the handle was just cleared.
  #
  # Fix is non-trivial (need per-tensor handle reset in
  # WeightRegistry.Reset, or test-isolation strategy that doesn't reset the
  # pool mid-run). Left at the compiled default until the underlying
  # handle-leak is fixed properly.
  #
  # Memory pressure on heavy shards is handled instead by rewriting the
  # built xunit.runner.json to serial for those shards (see the test step
  # below), which serializes model loads on the heaviest shards. (The
  # `-- xunit.MaxParallelThreads=1` inline arg is a no-op under the VSTest
  # adapter; only the JSON is honored.)

  # GC tuning for tests: switch to Server GC (multi-threaded, larger heap
  # segments, batched Gen-2 collections) â€” Workstation GC's per-thread heap
  # mode keeps Gen-2 retention pinned to the test thread for longer than we
  # can afford under parallel test collections. ServerGC ALSO triggers
  # background concurrent collection more aggressively, reducing the chance
  # that one test's working set blocks another test from getting a fresh
  # allocation context.
  DOTNET_gcServer: 1
  DOTNET_GCConserveMemory: 9

jobs:
  # A normal master push immediately follows a PR validation of the same source tree. Locate that
  # run and prove the tree identity before reusing any result. If the push was direct, the prior run
  # was cancelled/stale, its artifacts expired, or the trees differ, run_id remains empty and every
  # expensive validation job below falls back to running normally.
  validation-source:
    name: Resolve certified PR validation
    runs-on: ubuntu-latest
    # Artifact inspection may take time; pending evidence itself now defers without polling.
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id || steps.defaults.outputs.run_id }}
      pr_number: ${{ steps.resolve.outputs.pr_number || steps.defaults.outputs.pr_number }}
      tested_sha: ${{ steps.resolve.outputs.tested_sha || steps.defaults.outputs.tested_sha }}
      reuse_scope: ${{ steps.resolve.outputs.reuse_scope || steps.defaults.outputs.reuse_scope }}
      reuse: ${{ steps.resolve.outputs.reuse || steps.defaults.outputs.reuse }}
      reuse_quality: ${{ steps.resolve.outputs.reuse_quality || steps.defaults.outputs.reuse_quality }}
      # Whether the reusable PR run produced runtime/test artifacts. Schema-v1 certificates are
      # conservatively treated as true; schema-v2 non-runtime certificates explicitly emit false.
      reused_requires_validation: ${{ steps.resolve.outputs.reused_requires_validation || steps.defaults.outputs.reused_requires_validation }}
      # Independent JSON booleans. A validation-only certificate suppresses the large build/test
      # graph while still rerunning CodeQL and Sonar; only a complete certificate suppresses both.
      execute_validation: ${{ steps.resolve.outputs.execute_validation || steps.defaults.outputs.execute_validation }}
      execute_quality: ${{ steps.resolve.outputs.execute_quality || steps.defaults.outputs.execute_quality }}
      # Delta reuse. Reuse: nothing re-runs (reuse=true above). Partial: re-run partial_shards only
      # and import import_shards' artifacts from run import_run_id (tested commit import_sha).
      delta_mode: ${{ steps.resolve.outputs.delta_mode || steps.defaults.outputs.delta_mode }}
      partial_shards: ${{ steps.resolve.outputs.partial_shards || steps.defaults.outputs.partial_shards }}
      import_run_id: ${{ steps.resolve.outputs.import_run_id || steps.defaults.outputs.import_run_id }}
      import_sha: ${{ steps.resolve.outputs.import_sha || steps.defaults.outputs.import_sha }}
      import_shards: ${{ steps.resolve.outputs.import_shards || steps.defaults.outputs.import_shards }}

    steps:
      - name: Report validation trigger
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Report only scheduling inputs, never the full event or GitHub context.
          printf 'event=%s action=%s draft=%s head=%s\n' "$EVENT_NAME" "$EVENT_ACTION" "$PR_DRAFT" "$HEAD_REF"
          printf 'Validation trigger: event=%s, action=%s, draft=%s, head=%s\n' "$EVENT_NAME" "$EVENT_ACTION" "$PR_DRAFT" "$HEAD_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Initialize fail-closed validation decision
        id: defaults
        shell: bash
        run: |
          {
            echo 'run_id='
            echo 'pr_number='
            echo 'tested_sha='
            echo 'reuse_scope=None'
            echo 'reuse=false'
            echo 'reuse_quality=false'
            echo 'reused_requires_validation=true'
            echo 'execute_validation=true'
            echo 'execute_quality=true'
            echo 'delta_mode='
            echo 'partial_shards=[]'
            echo 'import_run_id='
            echo 'import_sha='
            echo 'import_shards=[]'
          } >> "$GITHUB_OUTPUT"

      - name: Checkout validation reuse policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          # Delta reuse rebuilds the pull request's validated tree from its merge parents and diffs
          # the landed commit against it in the certified map's line coordinates, which needs the
          # map commit and both parents in history.
          # Quoted: in an expression '&& 0 ||' treats 0 as false and would always yield 1.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      - name: Resolve certified shard map for delta reuse
        id: delta-map
        if: github.event_name == 'push'
        continue-on-error: true
        # continue-on-error bounds the OUTCOME, not the duration: a stalled gh call here would eat
        # the job's margin before the resolver's own 40-minute wait even starts.
        # Leave 40 minutes for evidence and 5 minutes for checkout/setup and fallback reporting.
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delta reuse selects over the base branch's later commits with the same audited map that
          # pull-request selection uses. Any failure here leaves both inputs unset, and reuse stays
          # exact-tree only - the pre-existing, fail-closed behaviour.
          & ./tools/TestImpact/Resolve-CertifiedShardMap.ps1 -Repository '${{ github.repository }}' `
              -OutDirectory delta-map -ResultFile delta-map-resolution.json -MapBranch master
          if ($LASTEXITCODE -ne 0) { throw "certified map resolver exited $LASTEXITCODE" }
          $resolution = Get-Content delta-map-resolution.json -Raw | ConvertFrom-Json
          if (-not $resolution.found) { throw 'no certified map is available' }
          & ./tools/TestImpact/Test-CertifiedShardMap.ps1 -MapFile delta-map/shard-map.json `
              -CertificateFile delta-map/certification.json -CertificationRunId ([long] $resolution.runId)
          if ($LASTEXITCODE -ne 0) { throw "certified map provenance is invalid (exit $LASTEXITCODE)" }
          $all = @(yq -o=json -I=0 '.shard' .github/test-shards.yml | ConvertFrom-Json)
          ConvertTo-Json -InputObject @($all) -Depth 5 |
            Set-Content -LiteralPath delta-shard-manifest.json -Encoding utf8
          'map_file=delta-map/shard-map.json' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          'manifest_file=delta-shard-manifest.json' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Resolve exact-tree PR run
        id: resolve
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/TestImpact/Resolve-CiValidationReuse.ps1 `
            -Repository '${{ github.repository }}' `
            -CommitSha '${{ github.sha }}' `
            -EventName '${{ github.event_name }}' `
            -ExpectedBaseBranch '${{ github.ref_name }}' `
            -GitHubOutput $env:GITHUB_OUTPUT `
            -MapFile '${{ steps.delta-map.outputs.map_file }}' `
            -ShardManifestFile '${{ steps.delta-map.outputs.manifest_file }}' `
            -WaitMinutes 0

      # A failed, recognizable step keeps the gate red and lets the completion reconciler
      # rerun this job and its dependents on the ORIGINAL push SHA (not a new dispatch SHA).
      - name: Defer until PR validation completes
        if: steps.resolve.outputs.deferred == 'true'
        run: |
          echo '::error::Validation deferred, not passed: waiting for the merged PR run. No duplicate matrix was scheduled.'
          exit 1

      - name: Block superseded or unverifiable push
        if: steps.resolve.outputs.blocked == 'true'
        run: |
          echo '::error::Push is superseded or its branch tip could not be verified. Dependent work is disabled; this is not passing validation.'
          exit 1

      - name: Report resolver fallback
        if: steps.resolve.outcome == 'failure'
        run: |
          echo '::warning::exact-tree resolver failed unexpectedly; fail-closed defaults authorize full validation'
          echo 'Resolver failure: full validation remains enabled.' >> "$GITHUB_STEP_SUMMARY"

  # CodeQL runs on Ubuntu with net10.0 only - parallel with SonarCloud
  # Runs on PRs, merge groups, pushes to master/main, and the weekly security schedule.
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: [validation-source, select-shards]
    # The traced net10 build takes about 31 minutes on generated-source-heavy PRs. The #2032
    # analysis was still running when the 60-minute ceiling cancelled it, while master's #2026
    # baseline completed in 57:48. Give extraction, SARIF generation, and upload enough margin
    # for normal hosted-runner variance without hiding a genuinely hung job. Recent PR runs took
    # 66-71 minutes (about 26 traced build + 31 analysis), and the job now also traces Serving and
    # the playground functions (about 40 s of untraced local compile, under 1% more source), so the
    # ceiling moves from 75 to 85 minutes to keep the same margin.
    timeout-minutes: 85
    # CodeQL remains mandatory even for non-runtime changes because the active Main ruleset
    # requires a CodeQL result for the candidate commit. This is one job, not a model/test matrix.
    if: "${{ always() && !cancelled() && fromJSON(needs.validation-source.outputs.execute_quality) && (github.event.pull_request.draft != true) && !startsWith(github.head_ref, 'release-please--') && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(master): release')) }}"
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        # The full solution Release build compiles net10.0 + net471 outputs and can exhaust
        # ubuntu-latest's runner volume before downstream cleanup steps run. Keep the .NET
        # host frameworks intact and remove only preinstalled toolchains this job does not use.
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/hostedtoolcache/PyPy || true
          sudo rm -rf /opt/hostedtoolcache/Ruby || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/share/miniconda || true
          sudo rm -rf /usr/local/share/boost || true
          sudo apt-get clean || true
          df -h /

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: |
          dotnet restore src/AiDotNet.csproj
          dotnet restore src/AiDotNet.Serving/AiDotNet.Serving.csproj
          dotnet restore src/AiDotNet.Playground.Functions/AiDotNet.Playground.Functions.csproj

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: csharp
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality

      # CodeQL needs to trace the build - can't reuse artifacts.
      # CodeQL only analyzes what the traced build compiles, so every shipped entry point that
      # takes untrusted input has to be built here: the core library, the Serving API and the
      # playground's Azure Functions. This step used to build the library alone to avoid a file
      # lock on AiDotNet.Serving's static web assets; naming each project in its own sequential
      # command (the pattern the build job uses) builds Serving exactly once, never concurrently.
      # The core library's command is unchanged and runs first, so its extraction is identical;
      # the next two builds find it up to date and compile only their own sources.
      - name: Build for CodeQL (net10.0)
        run: |
          dotnet build src/AiDotNet.csproj -c Release --no-restore -f net10.0
          dotnet build src/AiDotNet.Serving/AiDotNet.Serving.csproj -c Release --no-restore
          dotnet build src/AiDotNet.Playground.Functions/AiDotNet.Playground.Functions.csproj -c Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: "/language:csharp"
          upload: always

  # Build once on ubuntu (net10.0 + net471), then run tests in parallel shards.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [validation-source, select-shards]
    outputs:
      artifact_id: ${{ steps.upload-build-artifact.outputs.artifact-id }}
      # upload-artifact emits bare hexadecimal; normalize once at the producer boundary.
      artifact_digest: ${{ format('sha256:{0}', steps.upload-build-artifact.outputs.artifact-digest) }}
    timeout-minutes: 45
    permissions:
      contents: read
    if: "${{ fromJSON(needs.validation-source.outputs.execute_validation) && fromJSON(needs.select-shards.outputs.requires_validation) && (github.event.pull_request.draft != true) && !startsWith(github.head_ref, 'release-please--') && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(master): release')) }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      # The full-solution Release build spans three target frameworks
      # (net471/net8.0/net10.0) across ~20 projects and overflows the hosted
      # runner's ~14 GB free space â€” the runner worker dies with
      # "No space left on device" mid-build (not a compile error). Reclaim
      # ~25 GB by deleting preinstalled toolchains this .NET build never uses.
      # We deliberately do NOT touch /usr/share/dotnet (the SDK the build needs).
      - name: Free up disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/swift /usr/local/share/boost || true
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium || true
          # The toolchain deletions above reclaim ~25 GB, leaving ~39 GB free â€” ample for this .NET
          # build â€” so we skip `docker image prune --all` here: on a fresh runner the preloaded images
          # aren't dangling (so a dangling-only prune reclaims ~nothing), and a full --all prune is a
          # slow, variable step that can contend with any concurrent Docker use on the runner.
          echo "Disk after cleanup:"; df -h /

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore

      - name: Inject license public key + revocation list (aidn2 offline verification)
        # So the CI-built AiDotNet.dll can verify offline aidn2 tokens (the CI license key path) and
        # honour the revocation deny-list, drop the PUBLIC signing key + signed CRL where the csproj
        # embeds them (src/BuildKey/LicensePublicKey.json -> AiDotNet.LicensePublicKey,
        # src/BuildKey/LicenseRevocation.json -> AiDotNet.LicenseRevocation). Both are PUBLIC/signed and
        # safe to expose. No-ops when the secrets/vars are unset (embed is Condition="Exists(...)"), so a
        # build without them simply ships no embedded key/CRL (offline aidn2 verification unavailable).
        shell: bash
        run: |
          mkdir -p src/BuildKey
          # Prefer the TEST-only key set (prod + ci-2026a) so this CI build embeds the CI public key and can
          # verify the offline aidn2 CI token in AIDOTNET_LICENSE_KEY on the real verification path. The CI key
          # is intentionally NOT in AIDOTNET_LICENSE_PUBLIC_KEY_JSON (used by release-please.yml), so published
          # NuGets trust ONLY the production key. Falls back to the prod var / committed file.
          if [ -n "${{ vars.AIDOTNET_LICENSE_PUBLIC_KEY_JSON_TEST || vars.AIDOTNET_LICENSE_PUBLIC_KEY_JSON || secrets.AIDOTNET_LICENSE_PUBLIC_KEY_JSON }}" ]; then
            printf '%s' "${{ vars.AIDOTNET_LICENSE_PUBLIC_KEY_JSON_TEST || vars.AIDOTNET_LICENSE_PUBLIC_KEY_JSON || secrets.AIDOTNET_LICENSE_PUBLIC_KEY_JSON }}" > src/BuildKey/LicensePublicKey.json
            echo "Injected LicensePublicKey.json ($(wc -c < src/BuildKey/LicensePublicKey.json) bytes)"
          else
            echo "AIDOTNET_LICENSE_PUBLIC_KEY_JSON not set â€” skipping (offline aidn2 verification unavailable in this build)."
          fi
          if [ -n "${{ vars.AIDOTNET_LICENSE_REVOCATION_JSON || secrets.AIDOTNET_LICENSE_REVOCATION_JSON }}" ]; then
            printf '%s' "${{ vars.AIDOTNET_LICENSE_REVOCATION_JSON || secrets.AIDOTNET_LICENSE_REVOCATION_JSON }}" > src/BuildKey/LicenseRevocation.json
            echo "Injected LicenseRevocation.json ($(wc -c < src/BuildKey/LicenseRevocation.json) bytes)"
          fi

      - name: Build source generator first
        run: dotnet build src/AiDotNet.Generators/AiDotNet.Generators.csproj -c Release --no-restore

      - name: Build (Release, net10.0)
        # SCOPED TO WHAT THE SHARDS ACTUALLY RUN. This job gates ~116 of them, and every
        # one executes net10.0, so compiling net471 and net8.0 here put two frameworks
        # nobody was waiting for onto the path everybody waits on. They now build in
        # build-compat, concurrently. Measured: removing net8.0 alone saved 13 SECONDS off
        # 13 minutes, which is what proved the job was bound by serialization rather than
        # by total work -- freeing a slot at -m:2 just let another project take it.
        #
        # -m:4 rather than -m:2 for the same reason the cap existed: the 16-GB ceiling was
        # reached by net8/net10/net471 csc processes running TOGETHER. One framework per
        # job removes the condition that forced the throttle, so the runner's four cores
        # can be used.
        #
        # Solution-wide `-f net10.0` is not possible: AiDotNet.Generators targets
        # netstandard2.0 and would fail. Naming the test projects builds src and the
        # satellites transitively at the right framework.
        run: |
          dotnet build tests/AiDotNet.Tests/AiDotNetTests.csproj -c Release --no-restore -f net10.0 -m:4
          dotnet build tests/AiDotNet.ParameterSweepWorker/AiDotNet.ParameterSweepWorker.csproj -c Release --no-restore -m:4
          dotnet build tests/AiDotNet.Serving.Tests/AiDotNet.Serving.Tests.csproj -c Release --no-restore -m:4

      - name: Upload build artifacts
        id: upload-build-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        # net471 is COMPILED in the step above and deliberately not shipped here. Compiling it
        # is the check -- it catches net471-only breakage a net10.0 build cannot see -- but no
        # job RUNS it: every consumer of this artifact (the test shards, the shape-conformance
        # job, the enumeration sweep) executes net10.0. Uploading it added ~1.7 GB that each of
        # the ~116 shards then downloaded and never opened, against a download step capped at
        # 12 minutes that has already stalled a shard once.
        with:
          name: build-output-${{ github.sha }}
          path: |
            src/bin/Release/
            tests/AiDotNet.Tests/bin/Release/
            tests/AiDotNet.ParameterSweepWorker/bin/Release/
            tests/AiDotNet.Serving.Tests/bin/Release/
            !**/bin/Release/net471/
          retention-days: 1

      # SHARD COVERAGE IS VERIFIED, NOT MAINTAINED BY HAND. The generated-layer
      # shards select classes by first-letter prefix, so a class emitted later
      # under an unlisted letter matches no shard, never runs, and nothing reports
      # it -- a silent loss of coverage on a green pipeline, which is worse than a
      # failing test. Runs here because this job has already built the assembly the
      # generator emits those classes into.
      - name: Verify every generated test class is covered by a shard
        shell: pwsh
        run: ./.github/scripts/check-shard-coverage.ps1

  # Everything the shards do NOT need, built concurrently with them instead of ahead of
  # them: the net471 compatibility compile, net8.0, and the pack that requires all three.
  # Compiling net471 is a real check -- it catches breakage a net10.0 build cannot see --
  # it simply is not a check anything downstream waits on. It still blocks the merge, via
  # ci-gate.
  build-compat:
    name: Build (compat frameworks + pack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    needs: [validation-source, select-shards]
    if: "${{ fromJSON(needs.validation-source.outputs.execute_validation) && fromJSON(needs.select-shards.outputs.requires_validation) && (github.event.pull_request.draft != true) && !startsWith(github.head_ref, 'release-please--') && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(master): release')) }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/swift /usr/local/share/boost || true
          sudo rm -rf /usr/share/miniconda || true
          sudo apt-get clean
          df -h /

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build source generator first
        run: dotnet build src/AiDotNet.Generators/AiDotNet.Generators.csproj -c Release --no-restore

      # SCOPED TO WHAT `build` DID NOT ALREADY COMPILE, because total CI minutes matter more
      # than this job's own latency. A full-solution build here would recompile the test
      # project for net10.0 -- the single most expensive compile in the repo, and the one
      # `build` just finished -- on a second runner, buying nothing.
      #
      # So: every src project across all ITS frameworks (pack needs them, and they are small
      # -- src/bin is ~200 MB per modern framework against ~1.6 GB for the test project),
      # then the test project for net471 ONLY, which is the compatibility check itself and
      # pulls the satellites to net471 with it.
      #
      # -m:2 is kept HERE and only here: this is the job that actually runs net8/net10/net471
      # csc processes together, the combination that reached the 16-GB ceiling and got a
      # compiler killed with exit 137.
      # ONE solution build, so tools/ and the satellites stay covered exactly as they were
      # and projects still compile in parallel. CompatBuildOnly narrows the test project to
      # net471 -- its net10.0 compile is the most expensive in the repo and the Build job
      # just did it, so repeating it on a second runner would burn CI minutes for nothing.
      #
      # -m:2 is kept HERE and only here: this is the job that actually runs net8/net10/net471
      # csc processes together, the combination that reached the 16-GB ceiling and got a
      # compiler killed with exit 137.
      - name: Build (Release, compat frameworks)
        run: dotnet build -c Release --no-restore -m:2 -p:CompatBuildOnly=true

      - name: Build NuGet package
        run: dotnet pack --no-build -c Release --output ./artifacts -p:CompatBuildOnly=true

      - name: Upload NuGet package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          retention-days: 1

  # The cancellation must happen in a DIFFERENT job from the build that failed. Cancelling a
  # workflow from inside the failing build changes that originating job's conclusion to
  # `cancelled`, hiding the compiler error that triggered fail-fast. These watchers cannot start
  # until GitHub has finalized the corresponding build as `failure`; they then stop the remaining
  # expensive matrix while preserving the useful red build check in the PR UI.
  cancel-after-build-failure:
    name: Cancel remaining work after Build failure
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: build
    if: ${{ always() && needs.build.result == 'failure' }}
    permissions:
      actions: write
    steps:
      - name: Cancel remaining jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  cancel-after-compat-build-failure:
    name: Cancel remaining work after compatibility-build failure
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: build-compat
    if: ${{ always() && needs.build-compat.result == 'failure' }}
    permissions:
      actions: write
    steps:
      - name: Cancel remaining jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}


  # ---------------------------------------------------------------------------------------------
  # Which shards does this change actually need?
  #
  # Answered from coverage: the nightly map records which source lines each shard executed, so a
  # shard is selected when it executed a line this PR touched. Everything uncertain - no map, an
  # unmapped file, a build or workflow edit - emits the FULL list instead. A wrong escalation costs
  # runner minutes; a wrong omission ships a regression, and those are not symmetric.
  # ---------------------------------------------------------------------------------------------
  select-shards:
    name: Select shards
    runs-on: ubuntu-latest
    needs: validation-source
    if: "${{ fromJSON(needs.validation-source.outputs.execute_validation) && (github.event.pull_request.draft != true) && !startsWith(github.head_ref, 'release-please--') && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(master): release')) }}"
    # The whole test matrix waits on this job through `needs`, and it makes uncapped network calls
    # (gh run list, gh run download). Without a cap it inherits the 360-minute default, so one
    # stalled artifact download parks all 116 shards for six hours.
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      ledger_matrix: ${{ steps.select.outputs.ledger_matrix }}
      parameter_matrix: ${{ steps.select.outputs.parameter_matrix }}
      shape_matrix: ${{ steps.select.outputs.shape_matrix }}
      requires_tests: ${{ steps.select.outputs.requires_tests }}
      requires_sweeps: ${{ steps.select.outputs.requires_sweeps }}
      requires_shapes: ${{ steps.select.outputs.requires_shapes }}
      escalated: ${{ steps.select.outputs.escalated }}
      # JSON boolean. Every expensive job consumes it through fromJSON; false is the deliberate
      # non-runtime path, while absent/malformed output prevents those jobs from being authorized.
      requires_validation: ${{ steps.select.outputs.requires_validation }}
      # Slugs of the shards deliberately not run, for the regression analyzer. It treats any
      # baseline shard with no current artifact as Incomplete and fails the policy on it - which
      # is right for a host that died and wrong for a shard we chose to skip.
      skipped: ${{ steps.select.outputs.skipped }}
      # Shards whose digests are carried forward from the previous map in a coverage-everywhere
      # run. The test job does not force instrumentation on them; the carried-digest artifact
      # below supplies their map entries instead.
      coverage_carried: ${{ steps.select.outputs.coverage_carried }}
      # Known heavy/timing shards that a complete prior map run already classified as always-run.
      # Their full correctness suites still execute, but repeating the instrumentation that already
      # exceeded the runner envelope cannot produce a digest and is therefore suppressed.
      coverage_run_without_instrumentation: ${{ steps.select.outputs.coverage_run_without_instrumentation }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Full history: the selector diffs from the MAP's commit, which is not reachable from a
          # shallow clone and is not an ancestor of any PR branched before the map was built.
          fetch-depth: 0

      - name: Download the shard map
        id: map
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_MAP_RUN_ID: ${{ inputs.test_impact_map_run_id }}
          FORCE_COVERAGE: ${{ inputs.collect_coverage_everywhere }}
          # Maps are only ever built on master. A ci-proof/** branch is master plus the CI change under
          # test, so a canary into it must select with master's map; looking for maps built on the
          # proof branch found none and sent every canary to the full matrix, proving nothing.
          MAP_BRANCH: ${{ startsWith(github.base_ref, 'ci-proof/') && 'master' || github.base_ref || 'master' }}
        run: |
          # Normal PRs may consume only an audited/certified map. The forced full-coverage run is
          # different: it consumes the exact candidate named by its dispatch input so that the next
          # map invocation can audit that candidate against the complete outcome set.
          rm -rf map map-resolution.json
          run_id=''
          kind=''
          if [ "$FORCE_COVERAGE" = 'true' ]; then
            case "${INPUT_MAP_RUN_ID:-}" in
              '')
                echo 'bootstrap coverage run has no candidate map in effect'
                ;;
              *[!0-9]*)
                echo '::warning::test_impact_map_run_id is not numeric - running without a candidate map'
                ;;
              *)
                if gh run download "$INPUT_MAP_RUN_ID" --repo "$GITHUB_REPOSITORY" \
                     --name candidate-shard-map --dir map; then
                  run_id="$INPUT_MAP_RUN_ID"
                  kind='candidate'
                else
                  echo "::warning::candidate map from run $INPUT_MAP_RUN_ID is unavailable"
                  rm -rf map
                fi
                ;;
            esac
          else
            # The executable resolver makes the newest completed map workflow a revocation barrier.
            # Its adversarial fixtures record every download attempt and prove that a newer failed
            # or certificate-withholding run can never fall back to an older certificate.
            if pwsh -NoProfile -File ./tools/TestImpact/Resolve-CertifiedShardMap.ps1 \
                 -Repository "$GITHUB_REPOSITORY" -OutDirectory map \
                 -ResultFile map-resolution.json -MapBranch "$MAP_BRANCH"; then
              candidate=$(jq -r 'if .found then (.runId | tostring) else empty end' map-resolution.json)
              if [ -n "$candidate" ]; then
                run_id="$candidate"
                kind='certified'
              fi
            else
              echo '::warning::certified map resolver failed; selection will fail closed'
              rm -rf map
            fi
          fi

          if [ -z "$run_id" ]; then
            echo 'no usable map found - selection will escalate to the full matrix'
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      # The impact tooling's own tests, run here rather than nowhere. Two defects on this PR were caught
      # only because these exist - reading the wrong side of a diff hunk, and a staleness check that
      # silently pinned the feature off - and both looked healthy in the logs.
      #
      # These are deterministic contract tests for checked-in CI code. Runtime uncertainty (missing
      # map, expired artifact, unmapped line) falls back to all shards, but a broken selector or
      # workflow contract must block the change rather than merge green with the feature disabled.
      - name: Setup .NET for worker coverage proof
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Verify the impact tooling
        id: selftest
        # A HUNG self-test would otherwise burn the job's 15-minute ceiling and kill the whole
        # job before any matrix output is written; a step timeout converts it into outcome=failure,
        # which the gate below turns into a full-matrix run.
        timeout-minutes: 5
        shell: pwsh
        run: |
          ./tools/TestImpact/Select-Shards.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Select-Shards self-test failed' }
          ./tools/TestImpact/New-ShardMap.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'New-ShardMap self-test failed' }
          # These two authorize the carry path and the nightly audit respectively; untested
          # tooling must not gate either.
          ./tools/TestImpact/Select-CoverageShards.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Select-CoverageShards self-test failed' }
          ./tools/TestImpact/Measure-SelectionMiss.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Measure-SelectionMiss self-test failed' }
          ./tools/TestImpact/Test-CertifiedShardMap.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Test-CertifiedShardMap self-test failed' }
          ./tools/TestImpact/Resolve-CertifiedShardMap.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Resolve-CertifiedShardMap self-test failed' }
          ./tools/TestImpact/Receive-RequiredArtifact.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Receive-RequiredArtifact self-test failed' }
          ./tools/TestImpact/Invoke-GitHubApiWithRetry.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub API retry self-test failed' }
          ./.github/scripts/Set-ShardEnvironment.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Set-ShardEnvironment self-test failed' }
          ./.github/scripts/New-CoverageRunSettings.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'New-CoverageRunSettings self-test failed' }
          ./tools/TestImpact/Test-CiImpactWorkflow.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CI impact workflow contract failed' }
          ./tools/TestImpact/Test-TestImpactEndToEnd.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Test-impact end-to-end proof failed' }
          ./tools/TestImpact/Test-CiGateModes.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CI Gate mode proof failed' }
          ./tools/TestImpact/Test-CiWorkloads.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Workload partition proof failed' }
          ./tools/TestImpact/Test-CiPolicyImpact.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CI execution-impact proof failed' }
          ./tools/TestImpact/Test-AuxiliaryEvidence.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Auxiliary evidence proof failed' }
          ./tools/TestImpact/Test-AuxiliaryInventory.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Auxiliary inventory proof failed' }
          ./tools/TestImpact/Test-WorkerCoverage.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Isolated worker coverage proof failed' }
          ./tools/TestImpact/Test-ValidationReuseModes.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Validation reuse mode proof failed' }

      - name: Select
        id: select
        shell: pwsh
        env:
          MAP_KIND: ${{ steps.map.outputs.kind }}
          MAP_RUN_ID: ${{ steps.map.outputs.run_id }}
          # NOT the event's base sha: that is the base branch as it stood when the pull request was
          # opened, so for a pull request behind master it attributes every commit master
          # has gained since to the pull request. The selector verifies the checked-out merge commit's
          # second parent is this head and diffs against its first parent - the base actually tested.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Post-merge delta reuse (validation-source): re-run only these, import these.
          DELTA_MODE: ${{ needs.validation-source.outputs.delta_mode }}
          PARTIAL_SHARDS: ${{ needs.validation-source.outputs.partial_shards }}
          IMPORT_SHARDS: ${{ needs.validation-source.outputs.import_shards }}
        run: |
          $all = @(yq -o=json -I=0 '.shard' .github/test-shards.yml | ConvertFrom-Json)
          if ($all.Count -eq 0) {
            Write-Host '::error::.github/test-shards.yml yielded no shards'
            exit 1
          }
          # Test sources are never instrumented, so the coverage map cannot route them; the selector
          # routes them through these same filters instead.
          ConvertTo-Json -InputObject @($all) -Depth 5 |
            Set-Content -LiteralPath shard-manifest.json -Encoding utf8

          function Read-RequiredJsonBoolean {
            param(
              [Parameter(Mandatory)] [object] $Object,
              [Parameter(Mandatory)] [string] $PropertyName
            )

            $property = $Object.PSObject.Properties[$PropertyName]
            if ($null -eq $property -or $property.Value -isnot [bool]) {
              throw "selector output property '$PropertyName' must be a JSON boolean"
            }
            return [bool] $property.Value
          }

          # `name` is the key selection and the map both index on, and the regression analyzer keys
          # on its slug. Duplicates already escalate through the count check further down, but with
          # a message about missing shards that points nowhere near the real cause.
          $dupes = @($all.name | Group-Object | Where-Object Count -gt 1 | ForEach-Object Name)
          if ($dupes.Count -gt 0) {
            Write-Host "::error::duplicate shard name(s) in .github/test-shards.yml: $($dupes -join ', ')"
            exit 1
          }
          $slugDupes = @(
            $all |
              Group-Object { $_.name -replace '[\\/:*?"<>|\s-]+', '_' } |
              Where-Object Count -gt 1 |
              ForEach-Object Name
          )
          if ($slugDupes.Count -gt 0) {
            Write-Host "::error::shard name(s) collide after artifact-key normalization: $($slugDupes -join ', ')"
            exit 1
          }
          Write-Host "shard list: $($all.Count) shard(s)"

          $escalate = $true
          $requiresValidation = $true
          $selected = @()

          # Two independent reasons to refuse to reduce, reported separately so the log says which
          # one applied. Folding them into one flag made a self-test failure on a PR print "not a
          # pull request", which is the kind of misleading-but-green log this feature keeps
          # producing when a condition is collapsed.
          #
          # Pull requests reduce by selecting over their own change. A push reduces only through
          # validation-source's delta decision: it has already rebuilt the tree the pull request
          # validated, selected over what the base branch added since, and named the overlap to
          # re-run. This step never selects a master delta itself, so there is one reuse mechanism.
          # Merge groups, schedules and dispatches always run the full matrix.
          $selectorTrusted = '${{ steps.selftest.outcome }}' -eq 'success'
          # A post-merge push of a GitHub "Merge pull request" commit has exactly the shape the selector
          # reads from refs/pull/N/merge: two parents, the first the previous tip and the second the
          # pull request head, so its change is that pull request's change. Without this every merge to
          # master ran all 164 shards ("event is 'push', not a pull request"), a full ~2-hour run
          # behind every merged pull request, competing for runners with every open one. A squash or
          # rebase landing has one parent, no head to scope to, and keeps the full matrix.
          $eventName = '${{ github.event_name }}'
          $changeHeadSha = [string] $env:PR_HEAD_SHA
          if ($eventName -eq 'push') {
            $changeHeadSha = ''
            $landing = @(((& git rev-list --parents -n 1 HEAD) -join ' ').Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries))
            if ($LASTEXITCODE -eq 0 -and $landing.Count -eq 3) { $changeHeadSha = $landing[2] }
          }
          $eventCanReduce  = $eventName -eq 'pull_request' -or
              ($eventName -eq 'push' -and -not [string]::IsNullOrEmpty($changeHeadSha))
          function ConvertFrom-ShardList([string] $Json) {
            if ([string]::IsNullOrWhiteSpace($Json)) { return @() }
            return @($Json | ConvertFrom-Json | ForEach-Object { [string] $_ } | Where-Object { $_ })
          }
          $partialShards = @(ConvertFrom-ShardList $env:PARTIAL_SHARDS)
          $importShards = @(ConvertFrom-ShardList $env:IMPORT_SHARDS)
          $deltaPartial = '${{ github.event_name }}' -eq 'push' -and $env:DELTA_MODE -ceq 'Partial' -and
            $partialShards.Count -gt 0
          $mapCertified = $false

          if ($env:MAP_KIND -eq 'certified' -and (Test-Path map/shard-map.json) -and
              (Test-Path map/certification.json)) {
            try {
              & ./tools/TestImpact/Test-CertifiedShardMap.ps1 `
                  -MapFile map/shard-map.json `
                  -CertificateFile map/certification.json `
                  -CertificationRunId ([long] $env:MAP_RUN_ID)
              if ($LASTEXITCODE -ne 0) { throw "certificate validator exited $LASTEXITCODE" }
              $mapCertified = $true
            }
            catch {
              Write-Host "::warning::certified map provenance is invalid ($($_.Exception.Message)) - running the full matrix"
            }
          }

          if (-not $selectorTrusted) {
            Write-Host '::error::the impact tooling failed its own self-test - running the full matrix.'
            $deltaPartial = $false
          }
          elseif ($deltaPartial) {
            $knownNames = [System.Collections.Generic.HashSet[string]]::new([string[]] @($all.name), [System.StringComparer]::Ordinal)
            $unknown = @(@($partialShards) + @($importShards) | Where-Object { -not $knownNames.Contains($_) })
            if ($unknown.Count -gt 0) {
              Write-Host "::warning::delta plan names shard(s) absent from test-shards.yml: $($unknown -join ', ') - running the full matrix"
              $deltaPartial = $false
            }
            else {
              $escalate = $false
              $requiresValidation = $true
              $selected = @($partialShards)
              Write-Host "post-merge delta: re-running $($partialShards.Count) shard(s) the base branch's later commits reach; importing $($importShards.Count) from the pull request run"
            }
          }
          elseif (-not $eventCanReduce) {
            Write-Host "event is '${{ github.event_name }}' with no pull request head to scope to - running the full matrix"
          }
          else {
            # Non-runtime classification depends only on the PR's exact base-to-head path set, so
            # documentation and independent workflow changes do not fall back to full CI merely
            # because a coverage artifact is missing or expired. Any classification uncertainty
            # remains true and continues into the certified-map path below.
            $pathRequiresValidation = $true
            try {
              & ./tools/TestImpact/Select-Shards.ps1 -ClassifyOnly `
                  -PullRequestHeadSha $changeHeadSha -OutFile path-classification.json
              if ($LASTEXITCODE -ne 0) { throw "path classifier exited $LASTEXITCODE" }
              $pathResult = Get-Content path-classification.json -Raw | ConvertFrom-Json
              $pathRequiresValidation = Read-RequiredJsonBoolean `
                  -Object $pathResult -PropertyName 'requiresValidation'
            }
            catch {
              Write-Host "::warning::path classification unavailable ($($_.Exception.Message)) - runtime validation remains required"
            }

            if (-not $pathRequiresValidation) {
              $escalate = $false
              $requiresValidation = $false
              $selected = @()
            }
            elseif ($mapCertified) {
              # Line ranges still come from the map's own commit, the only reference whose line
              # numbers the map's ranges are expressed in; the pull request head only decides WHICH
              # paths are this pull request's change.
              try {
                & ./tools/TestImpact/Select-Shards.ps1 `
                    -MapFile map/shard-map.json `
                    -PullRequestHeadSha $changeHeadSha `
                    -ShardManifestFile shard-manifest.json `
                    -ExpectedShards @($all.name) `
                    -OutFile selection.json
                if ($LASTEXITCODE -ne 0) { throw "shard selector exited $LASTEXITCODE" }
                $result = Get-Content selection.json -Raw | ConvertFrom-Json
                $selectionEscalated = Read-RequiredJsonBoolean `
                    -Object $result -PropertyName 'escalate'
                $selectionRequiresValidation = Read-RequiredJsonBoolean `
                    -Object $result -PropertyName 'requiresValidation'
                if (-not $selectionRequiresValidation) {
                  throw 'shard selector contradicted the exact-path runtime decision'
                }
                $shardsProperty = $result.PSObject.Properties['shards']
                if ($null -eq $shardsProperty -or $shardsProperty.Value -isnot [System.Array] -or
                    @($shardsProperty.Value | Where-Object { $_ -isnot [string] }).Count -gt 0) {
                  throw "selector output property 'shards' must be a JSON string array"
                }
                $escalate = $selectionEscalated
                $requiresValidation = $true
                $selected = @($shardsProperty.Value)
              }
              catch {
                Write-Host "::warning::shard selection output unavailable or invalid ($($_.Exception.Message)) - running the full matrix"
                $escalate = $true
                $requiresValidation = $true
                $selected = @()
              }
            }
            else {
              Write-Host '::warning::no certified shard map - running the full matrix'
            }
          }

          if ($escalate) {
            $matrixShards = $all
            Write-Host "escalated: running all $($all.Count) shard(s)"
          }
          elseif (-not $requiresValidation) {
            $matrixShards = @()
            Write-Host 'non-runtime-only change: model and test validation is not required'
          }
          else {
            $wanted = [System.Collections.Generic.HashSet[string]]::new(
                [string[]] $selected, [System.StringComparer]::Ordinal)
            $matrixShards = @($all | Where-Object { $wanted.Contains([string] $_.name) })

            # Every selected name MUST exist in the shard list. A rename that lands in
            # test-shards.yml but not in the map would otherwise silently shrink the matrix, and
            # a shard that quietly stops running is exactly the failure this whole feature must
            # not introduce.
            if ($matrixShards.Count -ne $wanted.Count) {
              $missing = $wanted | Where-Object { $n = $_; -not ($all | Where-Object { $_.name -eq $n }) }
              Write-Host "::warning::selected shard(s) absent from test-shards.yml: $($missing -join ', ') - running the full matrix"
              $matrixShards = $all
              $escalate = $true
            }
            else {
              Write-Host "selected $($matrixShards.Count) of $($all.Count) shard(s)"
              foreach ($s in $matrixShards) { Write-Host "  $($s.name)" }
            }
          }

          # Empty is authorized only by the selector's explicit typed decision. A mapped selection
          # that unexpectedly becomes empty still fails safe to the complete matrix.
          if ($requiresValidation -and $matrixShards.Count -eq 0) {
            Write-Host '::warning::shard selection produced an empty matrix - running the full matrix'
            $matrixShards = $all
            $escalate = $true
          }

          . './tools/TestImpact/CiWorkloadKinds.ps1'
          $ledgerImports = @(if ($deltaPartial -and -not $escalate) { $importShards })
          $runnable = Complete-CiWorkloadSelection -All $all -Selected @($matrixShards) `
            -RequiresValidation $requiresValidation -Escalated $escalate -ImportedNames $ledgerImports
          if ($runnable.Escalated -and -not $escalate) {
            Write-Host '::warning::no ordinary ledger-producing shard was selected; full validation is required for reuse evidence'
          }
          $matrixShards = @($runnable.Shards)
          $ledgerShards = @($runnable.LedgerShards)
          $escalate = $runnable.Escalated

          # Slug exactly as the test job does, because that string is the regression analyzer's
          # shard key - it reads it back from shard-metadata.json.
          $running = [System.Collections.Generic.HashSet[string]]::new(
              [string[]] @($matrixShards.name), [System.StringComparer]::Ordinal)
          # A delta-imported shard is not skipped: its pull-request results are imported as this
          # run's own, so the regression analysis must see them, not an approved removal.
          if ($deltaPartial -and -not $escalate) {
            foreach ($name in $importShards) { [void] $running.Add($name) }
          }
          $skipped = @(
            $all |
              Where-Object { -not $running.Contains([string] $_.name) } |
              ForEach-Object { $_.name -replace '[\\/:*?"<>|\s-]+', '_' }
          )

          . ./tools/TestImpact/CiWorkloadKinds.ps1
          # Validate the complete catalog, including entries omitted from this selection.
          $null = Split-CiWorkloads -Shards $all
          $workloads = Split-CiWorkloads -Shards @($matrixShards)
          $json = ConvertTo-Json -InputObject @($workloads.Tests) -Depth 5 -Compress
          "matrix=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ledger_matrix=$(ConvertTo-Json -InputObject @($ledgerShards) -Depth 5 -Compress)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "parameter_matrix=$(ConvertTo-Json -InputObject @($workloads.ParameterSweep) -Depth 5 -Compress)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "shape_matrix=$(ConvertTo-Json -InputObject @($workloads.ModelShape) -Depth 5 -Compress)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "requires_tests=$(($workloads.Tests.Count -gt 0).ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "requires_sweeps=$(($workloads.ParameterSweep.Count -gt 0).ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "requires_shapes=$(($workloads.ModelShape.Count -gt 0).ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "skipped=$(ConvertTo-Json -InputObject @($skipped) -Depth 3 -Compress)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "escalated=$($escalate.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "requires_validation=$($requiresValidation.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $summary = if ($escalate) { "Running the full matrix ($($all.Count) shards)." }
                     elseif (-not $requiresValidation) { 'Non-runtime-only change; no model or test jobs required.' }
                     else { "Selected **$($matrixShards.Count)** of $($all.Count) shards from coverage." }
          "### Shard selection`n`n$summary" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          $carried = @()
          $runWithoutInstrumentation = @()
          if ('${{ inputs.collect_coverage_everywhere }}' -eq 'true') {
            # INCREMENTAL INSTRUMENTATION. A shard whose covered files are byte-identical between
            # the previous map's commit and this one has line ranges that still mean what they
            # said, so its digest is carried forward instead of re-measured - instrumentation
            # costs 3.21x on heavy shards, and most nights most of them are untouched.
            #
            # Only shards that collect no coverage naturally (heavy + timing) are carriable or
            # eligible for RunWithoutCoverage:
            # every other shard produces a fresh digest in any successful run, and New-ShardMap
            # aborts the whole map on a duplicate digest, by design. A member in the previous
            # map's alwaysRun set has already completed a mapping attempt without producing a
            # digest. Retrying the same instrumentation on a memory-bound shard only repeats the
            # runner shutdown; its correctness run remains mandatory and it remains always-run.
            #
            # The eligibility list lives in the test job's run step in THIS file; it is parsed out
            # of the workflow source below so there is no second copy to drift. Both drift
            # directions are safe: a missed name degrades to Instrument, and a stale extra name
            # can only suppress instrumentation when the certified candidate also names the shard
            # as always-run. It can never make the correctness job skippable.
            # Matched on the TRIMMED line being exactly the definition, never Contains: these
            # marker strings also appear inside THIS parser's own source a few lines up, and a
            # Contains match latched onto itself, then collected every quoted string for the ~450
            # lines between here and the real arrays' closer - 220 names instead of 92. Caught
            # only because the proof asserted the expected count. A trimmed-equality match cannot
            # self-match, because this line trims to 'foreach (...)'.
            $nn = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
            $wfLines = Get-Content '.github/workflows/sonarcloud.yml'
            foreach ($marker in @('$heavyShards = @(', '$performanceShards = @(')) {
              $idx = -1
              for ($i = 0; $i -lt $wfLines.Count; $i++) {
                if ($wfLines[$i].Trim() -eq $marker) { $idx = $i; break }
              }
              if ($idx -lt 0) { continue }
              for ($i = $idx + 1; $i -lt $wfLines.Count; $i++) {
                if ($wfLines[$i].Trim().StartsWith(')')) { break }
                foreach ($m in [regex]::Matches($wfLines[$i], "'([^']+)'")) {
                  [void] $nn.Add($m.Groups[1].Value)
                }
              }
            }
            foreach ($declared in $all) {
              if ($declared.PSObject.Properties['heavy'] -and $declared.heavy -eq $true) { [void] $nn.Add([string] $declared.name) }
            }
            Write-Host "no-coverage shard list parsed from workflow and heavy entries: $($nn.Count)"
            if ($nn.Count -lt 2 -or $nn.Count -gt $all.Count) {
              Write-Host "::warning::no-coverage list parse looks wrong ($($nn.Count) names) - carrying nothing"
              $nn.Clear()
            }

            $prevMapOk = (Test-Path map/shard-map.json) -and ('${{ steps.selftest.outcome }}' -eq 'success')
            if ($prevMapOk -and $nn.Count -ge 2) {
              try {
                $prevMap = Get-Content map/shard-map.json -Raw | ConvertFrom-Json
                $prevSha = [string] $prevMap.sha
                & git cat-file -e "$prevSha^{commit}" 2>$null
                if ($LASTEXITCODE -ne 0) { throw "previous map commit $prevSha is not in this checkout" }
                # --no-renames: a rename otherwise lists only the NEW path while digests key
                # the OLD one, so the byte-identity check never sees it; as delete+add both sides
                # dirty correctly. quotepath=false matches the selection-side diffs - an
                # octal-escaped non-ASCII path can never equal a map key.
                $changedFiles = @(& git -c core.quotepath=false diff --no-renames --name-only $prevSha HEAD)
                if ($LASTEXITCODE -ne 0) { throw "git diff from $prevSha failed" }
                ./tools/TestImpact/Select-CoverageShards.ps1 `
                    -PreviousMap map/shard-map.json `
                    -ChangedFiles $changedFiles `
                    -AllShards @($all.name) `
                    -NoCoverageShards $nn `
                    -CarryForwardDirectory carried-digests `
                    -OutFile covsplit.json
                if ($LASTEXITCODE -ne 0) { throw "Select-CoverageShards exited $LASTEXITCODE" }
                $coverageSplit = Get-Content covsplit.json -Raw | ConvertFrom-Json
                if ([int] $coverageSplit.schemaVersion -ne 1) {
                  throw "unsupported coverage split schemaVersion '$($coverageSplit.schemaVersion)'"
                }
                $carried = @($coverageSplit.carried)
                $runWithoutInstrumentation = @($coverageSplit.runWithoutCoverage)
              }
              catch {
                # Instrumenting everything is always sound - it is exactly the pre-incremental
                # behaviour - so any doubt lands there rather than on a stale carry.
                Write-Host "::warning::incremental carry unavailable ($($_.Exception.Message)) - instrumenting every shard"
                $carried = @()
                $runWithoutInstrumentation = @()
                Remove-Item -Recurse -Force carried-digests -ErrorAction SilentlyContinue
              }
            }
            else {
              Write-Host 'no usable previous map or no-coverage list - instrumenting every shard'
            }
            "### Incremental instrumentation`n`ncarrying $($carried.Count) shard(s) forward; running $($runWithoutInstrumentation.Count) known always-run shard(s) without instrumentation; instrumenting the rest." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

            # Record only the map that was actually downloaded and validated by the preceding
            # step. Never copy the raw dispatch input into provenance when its artifact was absent.
            $mapRunId = [string] $env:MAP_RUN_ID
            [ordered]@{
              schemaVersion = 1
              forcedCoverage = $true
              runId = '${{ github.run_id }}'
              runAttempt = '${{ github.run_attempt }}'
              sha = '${{ github.sha }}'
              mapRunId = $mapRunId
              shardNames = @($all.name)
              carriedShardNames = @($carried)
              runWithoutInstrumentationShardNames = @($runWithoutInstrumentation)
            } | ConvertTo-Json -Depth 5 | Set-Content coverage-source.json -Encoding utf8
          }
          "coverage_carried=$(ConvertTo-Json -InputObject @($carried) -Depth 3 -Compress)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "coverage_run_without_instrumentation=$(ConvertTo-Json -InputObject @($runWithoutInstrumentation) -Depth 3 -Compress)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Named to match the harvest's `impact-digest-*` download pattern, so the map build picks
      # these up exactly like per-shard digests with no change on its side.
      - name: Upload carried digests
        if: ${{ inputs.collect_coverage_everywhere }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: impact-digest-carried
          path: carried-digests/*.digest.json
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      - name: Upload coverage-source marker
        if: ${{ inputs.collect_coverage_everywhere }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: test-impact-coverage-source
          path: coverage-source.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  test-net10-sharded:
    name: Tests (${{ matrix.shard.framework }}) - ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    needs: [build, validation-source, select-shards]
    # Forced coverage materially extends both test execution and post-test digest work. The live
    # all-shard experiment proved 50 minutes is too short: Generated Layers U passed every test at
    # 47.9 minutes, then GitHub canceled the job before its digest step. Ordinary validation gets a
    # 60-minute fallback so a bounded artifact retry cannot consume the test's execution budget;
    # the isolated nightly run gets enough room to finish cleanly.
    timeout-minutes: ${{ inputs.collect_coverage_everywhere && 90 || matrix.shard.timeout || 60 }}
    permissions:
      actions: read
      contents: read
    if: "${{ fromJSON(needs.validation-source.outputs.execute_validation) && fromJSON(needs.select-shards.outputs.requires_validation) && fromJSON(needs.select-shards.outputs.requires_tests) && (github.event.pull_request.draft != true) && !startsWith(github.head_ref, 'release-please--') && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(master): release')) }}"
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.collect_coverage_everywhere && 12 || 20 }}
      matrix:
        # The shard list lives in .github/test-shards.yml. It cannot also be a literal here: the
        # selection job filters it down to the shards a change can actually affect, and a matrix
        # is either a literal or an expression. select-shards emits the full list unchanged
        # whenever it is not confident, so the default behaviour is the full test matrix.
        shard: ${{ fromJSON(needs.select-shards.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Free runner disk space
        # ubuntu-latest images ship with Android SDK, .NET preinstalls, Haskell, CodeQL,
        # PowerShell, Boost, and ~14GB of unused tooling. Tests on the largest shards
        # (Diffusion A-C/D-I/J-M/N-R/S-prefix/T-Z, Unit-03 diffusion,
        # Generated Layers A-M/N-Z, ModelFamily-NN) generate
        # enough coverage + dump output to fill the runner volume mid-run, killing the
        # job with `IOException: No space left on device`. Drop the heaviest preinstalls
        # before tests start. ~25-30 GB freed.
        run: |
          # NOTE: do NOT delete /usr/share/dotnet/shared â€” actions/setup-dotnet
          # below installs the requested SDK alongside the runner-image
          # frameworks, and several reusable composite actions (and our own
          # later steps) expect the preinstalled host frameworks to remain
          # discoverable. We also do NOT delete /usr/local/share/powershell:
          # multiple later steps in this job run with `shell: pwsh`, so
          # removing PowerShell here would break them. Limit cleanup to
          # genuinely unused languages/tools to free disk for the largest
          # test shards without breaking the toolchain we depend on.
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/hostedtoolcache/PyPy || true
          sudo rm -rf /opt/hostedtoolcache/Ruby || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/share/miniconda || true
          sudo rm -rf /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Download required build artifact
        id: download-build-artifacts
        timeout-minutes: 25
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Resolve by the immutable upload output, not by listing every artifact in a 100+ shard run.
        # The receiver validates the archive digest and retries only transient transport responses
        # with GitHub-compliant exponential backoff. Exhaustion remains a hard, untested-shard failure.
        run: |
          ./tools/TestImpact/Receive-RequiredArtifact.ps1 `
            -Repository '${{ github.repository }}' `
            -ArtifactId '${{ needs.build.outputs.artifact_id }}' `
            -ExpectedDigest '${{ needs.build.outputs.artifact_digest }}' `
            -Destination '.' `
            -RunId '${{ github.run_id }}' `
            -JobIndex '${{ strategy.job-index }}'

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.shard.project }}

      - name: Run tests (sharded) with coverage
        id: shard-tests
        # pwsh (PowerShell Core) is pre-installed on ubuntu-latest runners and runs
        # the existing scripts cross-platform without a rewrite.
        shell: pwsh
        # Scoped to this test step only (not job-wide) so the credential is not exposed to other steps or
        # third-party actions. Licensed key keeps save/load-heavy suites under the free-trial op limit.
        env:
          # Via env rather than inline interpolation: the carried list is a JSON array of shard
          # names, and names contain characters PowerShell would parse inside a quoted literal.
          COVERAGE_CARRIED: ${{ needs.select-shards.outputs.coverage_carried }}
          COVERAGE_RUN_WITHOUT_INSTRUMENTATION: ${{ needs.select-shards.outputs.coverage_run_without_instrumentation }}
          # Dedicated enterprise CI license key (save-capable â€” lifts the persistence op cap under capability
          # gating â€” with effectively-unlimited activations for ephemeral runners). ModuleInitializer swaps
          # this online AIDN-* key for the deterministic synthetic OFFLINE license so the persistence-heavy
          # suite is licensed with no network round-trip; the key still validates online for any job/consumer
          # that doesn't run the ModuleInitializer hardening.
          AIDOTNET_LICENSE_KEY: ${{ secrets.AIDOTNET_LICENSE_KEY }}
          # Optional per-shard settings from .github/test-shards.yml, passed as environment so a
          # value can never be parsed as script. `heavy: true` puts a shard on the heavy path
          # without adding its name to the list below (the model-inventory sweeps and conformance
          # windows use it). `env` is applied to the test process by Set-ShardEnvironment.ps1.
          # `hangTimeout` replaces the 5-minute blame-hang limit for a shard whose single test
          # legitimately runs longer (a sweep walks the whole inventory under a 30-minute Timeout).
          SHARD_HEAVY: ${{ matrix.shard.heavy }}
          SHARD_ENV: ${{ toJSON(matrix.shard.env) }}
          SHARD_HANG_TIMEOUT: ${{ matrix.shard.hangTimeout }}
          # `coverageIncludeDirectory`: a directory whose assemblies coverlet should also instrument when this
          # shard collects coverage - the child worker's own AiDotNet copy, for shards that run models there.
          SHARD_COVERAGE_INCLUDE: ${{ matrix.shard.coverageIncludeDirectory }}
          # Passed as env, not interpolated into the script: a step's templated run block has a
          # 21000-character expression limit, and inlining these two tipped it over (HTTP 422
          # "Exceeded max expression length" on dispatch). yq does not catch that - it validates
          # YAML, not GitHub's expression limits.
          SHARD_PROJECT: ${{ matrix.shard.project }}
          SHARD_FRAMEWORK: ${{ matrix.shard.framework }}
          SHARD_NAME: ${{ matrix.shard.name }}
          SHARD_FILTER: ${{ matrix.shard.filter }}
          SHARD_FORCE_COVERAGE: ${{ github.event.inputs.collect_coverage_everywhere }}
        # Keep explanatory prose outside this scalar: GitHub evaluates expression-bearing run
        # blocks as one expression and rejects oversized values, so retain headroom for future logic.
        run: |
          & ./.github/scripts/Invoke-Shard.ps1

      # Surface the COMPLETE per-shard failure list on the run's Summary page.
      # Runs only when the shard is red, parses the TRX the run already wrote,
      # and groups failures by error so a single root cause behind many tests
      # reads as one line. Pure reporter (exits 0) — never changes the outcome.
      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: .github/scripts/report-failed-tests.ps1

      - name: Report slow tests
        if: always()
        shell: pwsh
        run: .github/scripts/report-slow-tests.ps1

      # Retry only failures absent from the exact master ledger. Known baseline failures are not
      # rerun, so this adds seconds for ordinary flakes instead of doubling every red shard. Both
      # TRX attempts are uploaded; the aggregate policy requires an explicit retry pass before it
      # discounts the first result.
      - name: Resolve exact baseline for targeted retry
        if: always() && steps.shard-tests.outcome == 'failure' && github.event_name == 'pull_request'
        id: retry-baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD_NAME: ${{ matrix.shard.name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $slug = $env:SHARD_NAME -replace '[\\/:*?"<>|\s-]+', '_'
          ./.github/scripts/find-test-baseline.ps1 `
            -BaseSha $env:BASE_SHA `
            -Repository $env:REPOSITORY `
            -ShardSlug $slug

      - name: Download compact retry baseline ledger
        if: always() && steps.retry-baseline.outputs.baseline_mode == 'ledger'
        id: retry-ledger-download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: ${{ steps.retry-baseline.outputs.baseline_artifact_name }}
          path: retry-baseline-ledger
          repository: ${{ github.repository }}
          run-id: ${{ steps.retry-baseline.outputs.baseline_run_id }}
          github-token: ${{ github.token }}

      - name: Download legacy retry baseline shard TRX
        if: always() && steps.retry-baseline.outputs.baseline_mode == 'trx'
        id: retry-trx-download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: ${{ steps.retry-baseline.outputs.baseline_artifact_name }}
          path: retry-baseline-results
          repository: ${{ github.repository }}
          run-id: ${{ steps.retry-baseline.outputs.baseline_run_id }}
          github-token: ${{ github.token }}

      - name: Select PR-new failures for targeted retry
        if: >-
          always() && steps.retry-baseline.outcome == 'success' &&
          ((steps.retry-baseline.outputs.baseline_mode == 'ledger' && steps.retry-ledger-download.outcome == 'success') ||
          (steps.retry-baseline.outputs.baseline_mode == 'trx' && steps.retry-trx-download.outcome == 'success'))
        id: retry-candidates
        shell: pwsh
        env:
          BASELINE_MODE: ${{ steps.retry-baseline.outputs.baseline_mode }}
        run: |
          $arguments = @{
            CurrentResultsPath = 'TestResults'
            OutputFile = 'TestResults/rerun-candidates.json'
          }
          if ($env:BASELINE_MODE -eq 'ledger') {
            $ledger = Get-ChildItem retry-baseline-ledger -Recurse -Filter ledger.json | Select-Object -First 1
            if (-not $ledger) { throw 'Downloaded retry baseline contains no ledger.json.' }
            $arguments.BaselineLedgerPath = $ledger.FullName
          } else {
            $arguments.BaselineResultsPath = 'retry-baseline-results'
          }
          ./.github/scripts/find-pr-new-failures.ps1 @arguments

      - name: Rerun PR-new failures once
        if: always() && steps.retry-candidates.outputs.rerun_count != '0' && steps.retry-candidates.outcome == 'success'
        id: retry-new-failures
        continue-on-error: true
        shell: pwsh
        env:
          SHARD_NAME: ${{ matrix.shard.name }}
          SHARD_PROJECT: ${{ matrix.shard.project }}
          SHARD_FRAMEWORK: ${{ matrix.shard.framework }}
          RETRY_FILTER: ${{ steps.retry-candidates.outputs.filter }}
          # The retry needs the shard's configuration as much as the first run did: without it a
          # conformance or parameter-count retry would walk the whole inventory in one host.
          SHARD_ENV: ${{ toJSON(matrix.shard.env) }}
        run: |
          & ./.github/scripts/Set-ShardEnvironment.ps1 -Json $env:SHARD_ENV
          if ($LASTEXITCODE -ne 0) { throw "shard environment for '$env:SHARD_NAME' was rejected" }
          $slug = $env:SHARD_NAME -replace '[\\/:*?"<>|\s-]+', '_'
          $results = "TestResults/$slug/retry"
          New-Item -Path $results -ItemType Directory -Force | Out-Null
          $retryArgs = @(
            'test', $env:SHARD_PROJECT,
            '--no-build', '--no-restore',
            '--configuration', 'Release',
            '--framework', $env:SHARD_FRAMEWORK,
            '--filter', $env:RETRY_FILTER,
            '--results-directory', $results,
            '--logger', 'trx;LogFileName=rerun-new-failures.trx',
            '--', 'xunit.parallelizeAssembly=false', 'xunit.parallelizeTestCollections=false'
          )
          & dotnet @retryArgs
          exit $LASTEXITCODE

      - name: Record shard outcome
        if: always()
        shell: pwsh
        run: |
          # A TRX cannot identify a shard whose host died before flushing results. Keep a tiny
          # always-produced envelope beside it so the aggregate report can distinguish an empty
          # green shard from a missing/incomplete one and retain the human-readable matrix name.
          $slug = "${{ matrix.shard.name }}" -replace '[\\/:*?"<>|\s-]+', '_'
          New-Item -Path TestResults -ItemType Directory -Force | Out-Null
          [PSCustomObject]@{
            shard = "${{ matrix.shard.name }}"
            slug = $slug
            sha = "${{ github.sha }}"
            runId = "${{ github.run_id }}"
            runAttempt = "${{ github.run_attempt }}"
            testStepOutcome = "${{ steps.shard-tests.outcome }}"
            rerunCandidateCount = "${{ steps.retry-candidates.outputs.rerun_count }}"
            rerunStepOutcome = "${{ steps.retry-new-failures.outcome }}"
          } | ConvertTo-Json | Set-Content TestResults/shard-metadata.json -Encoding utf8

      - name: Set artifact name
        if: always()
        shell: pwsh
        run: |
          # Create sanitized artifact name from shard name
          $slug = "${{ matrix.shard.name }}" -replace '[\\/:*?"<>|\s-]+', '_'
          echo "ARTIFACT_NAME=coverage-${{ github.sha }}-$slug" >> $env:GITHUB_ENV
          echo "TEST_RESULTS_ARTIFACT_NAME=test-results-${{ github.sha }}-$slug" >> $env:GITHUB_ENV

      # Test-impact digest: the executed source lines for this shard, ~200 KB against the coverage
      # XML's ~234 MB. Uploaded separately so the nightly map build downloads kilobytes per shard
      # rather than a quarter of a gigabyte. The digests are the DURABLE
      # input: on coverage-everywhere runs the raw XML artifact is kept only one day, so it is a
      # same-day diagnostic, not a rebuild fallback.
      #
      # Shards without a complete successful coverage-producing test step emit no digest and are
      # classified as always-run by the map producer.
      - name: Build test-impact digest
        # Only from a test run that COMPLETED. A shard killed part-way still writes a coverage
        # file, but one describing just the tests that ran - so the map would record it as not
        # executing lines it really does, and selection would skip it for a change it covers.
        # That is a silent miss, and it is likelier here than anywhere: forcing coverage onto
        # heavy shards is exactly what pushes them into an OOM. A shard that fails simply
        # produces no digest and stays always-run, which is the safe direction.
        if: steps.shard-tests.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $coverage = @(Get-ChildItem -Path TestResults -Filter 'coverage.opencover.xml' -Recurse -File -ErrorAction SilentlyContinue |
              Sort-Object Length -Descending)
          if ($coverage.Count -eq 0) {
            Write-Host "no coverage for '${{ matrix.shard.name }}' - this shard must be listed as always-run"
            exit 0
          }

          # Largest wins: the collector writes both a raw file and an attachment copy of the same
          # run, and a truncated copy would silently under-report executed lines.
          New-Item -ItemType Directory -Path impact-digest -Force | Out-Null
          $slug = "${{ matrix.shard.name }}" -replace '[\\/:*?"<>|\s-]+', '_'
          & ./tools/TestImpact/New-CoverageDigest.ps1 `
              -CoverageXml $coverage[0].FullName `
              -Shard "${{ matrix.shard.name }}" `
              -OutFile "impact-digest/$slug.digest.json"

      - name: Upload test-impact digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        if: always() && steps.download-build-artifacts.outcome == 'success'
        continue-on-error: true
        with:
          name: impact-digest-${{ env.ARTIFACT_NAME }}
          path: impact-digest/*.digest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage + test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        if: always() && steps.download-build-artifacts.outcome == 'success'
        continue-on-error: true  # Prevent transient GitHub artifact service issues from failing the job
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            TestResults/**/coverage.opencover.xml
            TestResults/**/*.trx
            TestResults/shard-metadata.json
            TestResults/rerun-candidates.json
          if-no-files-found: error
          # A forced all-shard run is several GiB. The compact digests above are the durable input;
          # raw coverage only needs to survive long enough for immediate diagnosis.
          retention-days: ${{ inputs.collect_coverage_everywhere && 1 || 14 }}

      # Keep crash evidence separate from coverage artifacts. Process dumps are deliberately not
      # uploaded: this is a public repository and a dump contains the environment block, including
      # the enterprise CI license key. Sequence.xml is the hang spelling; Sequence_<guid>.xml is
      # the crash spelling, so the glob must cover both.
      - name: Upload crash evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        if: always() && steps.download-build-artifacts.outcome == 'success'
        continue-on-error: true
        with:
          name: crash-evidence-${{ github.sha }}-${{ strategy.job-index }}
          path: |
            TestResults/**/Sequence*.xml
            TestResults/**/gpu-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 14

      # Keep the aggregate diagnostic input small. Downloading every coverage XML merely to inspect
      # TRX results makes the final reporter needlessly slow and expensive, while this artifact also
      # retains hang-sequence evidence that the coverage artifact intentionally omits.
      - name: Upload compact test diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        if: always() && steps.download-build-artifacts.outcome == 'success'
        continue-on-error: true
        with:
          name: ${{ env.TEST_RESULTS_ARTIFACT_NAME }}
          path: |
            TestResults/**/*.trx
            TestResults/**/Sequence*.xml
          if-no-files-found: ignore
          retention-days: 30

  # Aggregate every shard's TRX into one durable outcome ledger and one static status check.
  # Pull requests compare against the exact base SHA's master ledger. During rollout, when that
  # master run predates compact ledgers, the resolver downloads its legacy TRX artifacts once.
  test-regression-analysis:
    name: Test regression analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: "${{ always() && !cancelled() && fromJSON(needs.validation-source.outputs.execute_validation) && fromJSON(needs.select-shards.outputs.requires_validation) && (github.event.pull_request.draft != true) && !startsWith(github.head_ref, 'release-please--') && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(master): release')) }}"
    needs:
      - build
      - test-net10-sharded
      - validation-source
      - select-shards
    permissions:
      actions: read
      contents: read
    outputs:
      verdict_enforced: ${{ steps.analyze.outputs.verdict_enforced }}

    steps:
      - name: Checkout code and baseline commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Verify TRX analyzer
        shell: pwsh
        run: ./.github/scripts/test-regression-analysis.tests.ps1

      - name: Download current shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        continue-on-error: true
        with:
          pattern: coverage-${{ github.sha }}-*
          path: current-test-results
          merge-multiple: false

      # Post-merge delta reuse: the shards this run did not re-run are the pull request's results,
      # so the landed commit's ledger covers every shard the pull request validated.
      - name: Download pull-request shard results for delta import
        if: needs.validation-source.outputs.import_run_id != '' && needs.select-shards.outputs.escalated == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          pattern: coverage-${{ needs.validation-source.outputs.import_sha }}-*
          path: delta-import-staging
          merge-multiple: false
          repository: ${{ github.repository }}
          run-id: ${{ needs.validation-source.outputs.import_run_id }}
          github-token: ${{ github.token }}

      - name: Import pull-request shard results
        if: needs.validation-source.outputs.import_run_id != '' && needs.select-shards.outputs.escalated == 'false'
        shell: pwsh
        env:
          IMPORT_SHA: ${{ needs.validation-source.outputs.import_sha }}
          IMPORT_SHARDS: ${{ needs.validation-source.outputs.import_shards }}
        run: |
          ./tools/TestImpact/Import-PullRequestShardArtifacts.ps1 -StagingDirectory delta-import-staging `
            -DestinationDirectory current-test-results -ArtifactPrefix coverage `
            -ImportSha $env:IMPORT_SHA -ImportShardsJson $env:IMPORT_SHARDS

      - name: Determine comparison base
        id: comparison
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISPATCH_PR: ${{ inputs.pr_number }}
        run: |
          $baseSha = $env:EVENT_BASE_SHA
          if (-not $baseSha -and $env:EVENT_NAME -eq 'workflow_dispatch' -and $env:DISPATCH_PR) {
            $baseSha = gh api "repos/${{ github.repository }}/pulls/$($env:DISPATCH_PR)" --jq '.base.sha'
            if ($LASTEXITCODE -ne 0) { throw 'Could not resolve workflow_dispatch PR base SHA.' }
          }
          $compare = [bool]$baseSha
          echo "compare=$($compare.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          echo "base_sha=$baseSha" >> $env:GITHUB_OUTPUT

      - name: Find exact master baseline run
        if: steps.comparison.outputs.compare == 'true'
        id: baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.comparison.outputs.base_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          "baseline_available=true" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          try {
            & ./.github/scripts/find-test-baseline.ps1 `
              -BaseSha $env:BASE_SHA `
              -Repository $env:REPOSITORY
          }
          catch {
            $message = $_.Exception.Message
            "baseline_available=false" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
            Write-Warning "Exact baseline is temporarily unavailable: $message"
            @"
          ## Regression baseline unavailable

          The exact baseline for ``$($env:BASE_SHA)`` could not be resolved. This run still emits
          a current test inventory, but the comparison policy is not enforced: $message
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Download compact baseline ledger
        if: steps.baseline.outputs.baseline_available == 'true' && steps.baseline.outputs.baseline_mode == 'ledger'
        id: baseline-ledger-download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: test-outcome-ledger-${{ steps.baseline.outputs.baseline_sha }}
          path: baseline-ledger
          repository: ${{ github.repository }}
          run-id: ${{ steps.baseline.outputs.baseline_run_id }}
          github-token: ${{ github.token }}

      - name: Download promoted baseline provenance
        if: steps.baseline.outputs.baseline_available == 'true' && steps.baseline.outputs.baseline_mode == 'promoted'
        id: promoted-analysis-download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: ci-test-analysis-${{ steps.baseline.outputs.baseline_sha }}
          path: promoted-baseline-analysis
          repository: ${{ github.repository }}
          run-id: ${{ steps.baseline.outputs.baseline_run_id }}
          github-token: ${{ github.token }}

      - name: Resolve promoted baseline source
        if: steps.baseline.outputs.baseline_available == 'true' && steps.baseline.outputs.baseline_mode == 'promoted' && steps.promoted-analysis-download.outcome == 'success'
        id: promoted-baseline
        shell: pwsh
        run: |
          $promotion = Get-ChildItem promoted-baseline-analysis -Recurse -Filter promotion.json |
            Select-Object -First 1
          if (-not $promotion) {
            throw 'Promoted baseline artifact contains no promotion.json provenance.'
          }
          $provenance = Get-Content -LiteralPath $promotion.FullName -Raw | ConvertFrom-Json
          if (-not $provenance.sourceRunId -or -not $provenance.testedSha) {
            throw 'promotion.json must contain sourceRunId and testedSha.'
          }
          "source_run_id=$($provenance.sourceRunId)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "tested_sha=$($provenance.testedSha)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Download promoted source TRX artifacts
        if: steps.baseline.outputs.baseline_available == 'true' && steps.baseline.outputs.baseline_mode == 'promoted' && steps.promoted-baseline.outcome == 'success'
        id: promoted-trx-download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          pattern: coverage-${{ steps.promoted-baseline.outputs.tested_sha }}-*
          path: promoted-baseline-test-results
          merge-multiple: false
          repository: ${{ github.repository }}
          run-id: ${{ steps.promoted-baseline.outputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Download legacy baseline TRX artifacts
        if: steps.baseline.outputs.baseline_available == 'true' && steps.baseline.outputs.baseline_mode == 'trx'
        id: baseline-trx-download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          pattern: coverage-${{ steps.baseline.outputs.baseline_sha }}-*
          path: baseline-test-results
          merge-multiple: false
          repository: ${{ github.repository }}
          run-id: ${{ steps.baseline.outputs.baseline_run_id }}
          github-token: ${{ github.token }}

      - name: Build final test report and enforce regression policy
        id: analyze
        shell: pwsh
        env:
          EXPECTED_SHARD_MATRIX: ${{ needs.select-shards.outputs.ledger_matrix }}
          CURRENT_SHA: ${{ github.sha }}
          COMPARE: ${{ steps.comparison.outputs.compare }}
          BASE_SHA: ${{ steps.comparison.outputs.base_sha }}
          BASELINE_AVAILABLE: ${{ steps.baseline.outputs.baseline_available }}
          BASELINE_MODE: ${{ steps.baseline.outputs.baseline_mode }}
          LEDGER_DOWNLOAD_OUTCOME: ${{ steps.baseline-ledger-download.outcome }}
          TRX_DOWNLOAD_OUTCOME: ${{ steps.baseline-trx-download.outcome }}
          PROMOTED_TRX_DOWNLOAD_OUTCOME: ${{ steps.promoted-trx-download.outcome }}
        run: |
          # A baseline shard with no current artifact is Incomplete, and enough of those fail the
          # policy. That rule is right for a host that died mid-run and wrong for a shard that
          # selection deliberately did not run, so the skipped ones are merged into the approved
          # shard-change manifest as explicit removals.
          #
          # This does not let a skipped shard launder a failure into a fix: $fixed requires an
          # explicit current PASS, and a test that never ran has neither a pass nor a fail, so its
          # baseline failure lands in baselineFailuresNotObserved, which earns no policy credit.
          $manifest = Get-Content '.github/test-shard-changes.json' -Raw | ConvertFrom-Json
          $changes = [System.Collections.Generic.List[object]]::new()
          foreach ($c in @($manifest.changes)) { [void] $changes.Add($c) }
          foreach ($slug in @('${{ needs.select-shards.outputs.skipped }}' | ConvertFrom-Json)) {
            if (-not $slug) { continue }
            [void] $changes.Add([PSCustomObject]@{
              baselineKey = [string] $slug
              currentKeys = @()
              reason      = 'not selected: no line this PR changed is executed by this shard'
            })
          }
          [PSCustomObject]@{
            schemaVersion = 1
            description   = 'Checked-in shard changes plus the shards test-impact selection skipped for this run.'
            changes       = @($changes)
          } | ConvertTo-Json -Depth 6 | Set-Content merged-shard-changes.json -Encoding utf8
          Write-Host "approved shard changes: $($changes.Count) ($(@($manifest.changes).Count) checked in, $($changes.Count - @($manifest.changes).Count) skipped by selection)"

          # Ordinary shards dispatched or imported by this run. Imports must remain expected
          # even when only auxiliary workloads rerun. Inventory mode (a master push, which has no
          # baseline to diff against) previously had no expected set, so a shard whose runner died
          # before uploading was simply absent: the counts were taken over whatever arrived and the
          # run reported "115 shards, 115 passed, 0 failed" while Integration D had died. Shards
          # that selection deliberately skipped are not in this matrix, so anything expected and
          # absent here died rather than being skipped. #2086.
          $matrixJson = $env:EXPECTED_SHARD_MATRIX
          $expectedShardNames = @(
            & ./.github/scripts/get-selected-shard-names.ps1 -MatrixJson $matrixJson
          )
          "inventory_valid=true" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          Write-Host "expected ordinary shards from reruns and imports: $($expectedShardNames.Count)"

          $arguments = @{
            CurrentResultsPath = 'current-test-results'
            OutputDirectory = 'test-regression-analysis'
            CurrentSha = $env:CURRENT_SHA
            RepositoryPath = '.'
            ApprovedShardChangesPath = 'merged-shard-changes.json'
            ExpectedShardNames = $expectedShardNames
          }
          $ledger = Get-ChildItem baseline-ledger -Recurse -Filter ledger.json -ErrorAction SilentlyContinue |
            Select-Object -First 1
          $measuredLedgerShards = 0
          if ($ledger) {
            $ledgerShardInventory = Join-Path $ledger.DirectoryName 'shards.csv'
            try {
              $measuredLedgerShards = @(
                Import-Csv -LiteralPath $ledgerShardInventory -ErrorAction Stop |
                  Where-Object { $_.missingTrx -ne 'True' }
              ).Count
            }
            catch {
              Write-Warning "Downloaded baseline ledger has no readable shard inventory: $($_.Exception.Message)"
            }
            if ($measuredLedgerShards -eq 0) {
              Write-Warning 'Downloaded baseline ledger contains zero measured shards and will not be used for regression enforcement.'
            }
          }
          $legacyTrx = @(Get-ChildItem baseline-test-results -Recurse -Filter '*.trx' -File -ErrorAction SilentlyContinue)
          $promotedTrx = @(Get-ChildItem promoted-baseline-test-results -Recurse -Filter '*.trx' -File -ErrorAction SilentlyContinue)
          $baselineReady = $env:COMPARE -eq 'true' -and $env:BASELINE_AVAILABLE -eq 'true' -and (
            ($env:BASELINE_MODE -eq 'ledger' -and $env:LEDGER_DOWNLOAD_OUTCOME -eq 'success' -and $null -ne $ledger -and $measuredLedgerShards -gt 0) -or
            ($env:BASELINE_MODE -eq 'trx' -and $env:TRX_DOWNLOAD_OUTCOME -eq 'success' -and $legacyTrx.Count -gt 0) -or
            ($env:BASELINE_MODE -eq 'promoted' -and $env:PROMOTED_TRX_DOWNLOAD_OUTCOME -eq 'success' -and $promotedTrx.Count -gt 0))
          if ($baselineReady) {
            $arguments.BaselineSha = $env:BASE_SHA
            $arguments.FailOnPolicy = $true
            if ($env:BASELINE_MODE -eq 'ledger') {
              $arguments.BaselineLedgerPath = $ledger.FullName
            } elseif ($env:BASELINE_MODE -eq 'promoted') {
              $arguments.BaselineResultsPath = 'promoted-baseline-test-results'
            } else {
              $arguments.BaselineResultsPath = 'baseline-test-results'
            }
          } elseif ($env:COMPARE -eq 'true') {
            $message = "Exact baseline comparison is unavailable (mode '$($env:BASELINE_MODE)', ledger download '$($env:LEDGER_DOWNLOAD_OUTCOME)', TRX download '$($env:TRX_DOWNLOAD_OUTCOME)', promoted TRX download '$($env:PROMOTED_TRX_DOWNLOAD_OUTCOME)')."
            Write-Warning $message
            "`n> [!WARNING]`n> $message The current inventory is still published, but no regression verdict is claimed.`n" |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          "verdict_enforced=$($baselineReady.ToString().ToLowerInvariant())" |
            Add-Content -LiteralPath $env:GITHUB_OUTPUT
          ./.github/scripts/test-regression-analysis.ps1 @arguments

      - name: Upload final TRX ledger and comparison report
        # Missing/invalid selection output cannot prove which shards were dispatched. Do not
        # publish a partial ledger that a later run could mistake for a complete baseline.
        if: always() && steps.analyze.outputs.inventory_valid == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: test-outcome-ledger-${{ github.sha }}
          path: test-regression-analysis/
          if-no-files-found: error
          retention-days: 90

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    # Sonar compiler instrumentation makes this repository-wide build materially slower than the
    # ordinary artifact build. Runs 34168592804 and 34183645757 both reached the old 45-minute
    # ceiling while Build (Release) was still active, then spent GitHub's shutdown grace period
    # before being reported as cancelled at 55 minutes. Keep the memory-safe -m:2 build below and
    # give successful analysis enough headroom; this is a maximum, not a fixed runner duration.
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    # always() is load-bearing, not cosmetic. Without it a single red shard fails the
    # test-net10-sharded matrix, Actions SKIPS this job for having a failed `needs`, and because
    # "SonarCloud Analysis" remains a required status check in the `Main` ruleset, a skipped check
    # leaves the gate unsatisfied and every PR reads BLOCKED. That made "all 158 shards
    # green" the de facto merge bar via a `needs:` edge rather than a stated policy.
    #
    # SonarCloud is code-quality analysis, not a test gate. It consumes coverage from this
    # validation, and those artifacts are uploaded whether a shard passed or failed. An exact-tree
    # master push does not repeat the PR analysis; the scheduled full run refreshes default-branch
    # analysis independently. Test outcomes are gated explicitly by `ci-gate` below.
    #
    # The required check remains a lightweight successful job for non-runtime changes. Runtime
    # analysis still requires the build; every expensive step below consumes the same typed flag.
    if: "${{ always() && !cancelled() && fromJSON(needs.validation-source.outputs.execute_quality) && (!fromJSON((needs.validation-source.outputs.reuse == 'true' && needs.validation-source.outputs.reused_requires_validation) || needs.select-shards.outputs.requires_validation || 'true') || needs.validation-source.outputs.reuse == 'true' || needs.build.result == 'success') && (github.event.pull_request.draft != true) && !startsWith(github.head_ref, 'release-please--') && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(master): release')) }}"
    needs:
      - build
      - test-net10-sharded
      - validation-source
      - select-shards
    env:
      EFFECTIVE_REQUIRES_VALIDATION: ${{ (needs.validation-source.outputs.reuse == 'true' && needs.validation-source.outputs.reused_requires_validation) || needs.select-shards.outputs.requires_validation || 'true' }}
      # The instrumented analysis runs only on the scheduled and dispatched full runs. On pull
      # requests, merge groups and pushes it never finished (timeouts and lost runners, 2026-09)
      # while blocking every merge, so those events report success without analysing, and CI Gate
      # treats this job as advisory. Default-branch quality comes from the nightly run.
      SONAR_ANALYZE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && ((needs.validation-source.outputs.reuse == 'true' && needs.validation-source.outputs.reused_requires_validation) || needs.select-shards.outputs.requires_validation || 'true') || 'false' }}

    steps:
      - name: Report skipped analysis
        if: ${{ !fromJSON(env.SONAR_ANALYZE) }}
        run: |
          if [ "$EFFECTIVE_REQUIRES_VALIDATION" = 'true' ]; then
            echo "SonarCloud analysis runs on the nightly full run, not on '${{ github.event_name }}' events."
          else
            echo 'Non-runtime-only change; the SonarCloud check succeeds without analysis.'
          fi

      - name: Set up JDK 17
        if: ${{ fromJSON(env.SONAR_ANALYZE) }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Checkout code
        if: ${{ fromJSON(env.SONAR_ANALYZE) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0
        if: ${{ fromJSON(env.SONAR_ANALYZE) }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        if: ${{ fromJSON(env.SONAR_ANALYZE) }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache SonarCloud packages
        if: ${{ fromJSON(env.SONAR_ANALYZE) }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        if: ${{ fromJSON(env.SONAR_ANALYZE) }}
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: ${{ fromJSON(env.SONAR_ANALYZE) && steps.cache-sonar-scanner.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          New-Item -Path ${{ runner.temp }}/scanner -ItemType Directory -Force
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}/scanner

      - name: Download current-run coverage artifacts
        if: ${{ fromJSON(env.SONAR_ANALYZE) && needs.validation-source.outputs.reuse != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          pattern: coverage-${{ github.sha }}-*
          path: TestResults
          merge-multiple: true

      - name: Download certified coverage artifacts
        if: ${{ fromJSON(env.SONAR_ANALYZE) && needs.validation-source.outputs.reuse == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validation-source.outputs.run_id }}
          pattern: coverage-*
          path: TestResults
          merge-multiple: true

      - name: Download pull-request coverage for delta import
        if: ${{ fromJSON(env.SONAR_ANALYZE) && needs.validation-source.outputs.import_run_id != '' && needs.select-shards.outputs.escalated == 'false' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validation-source.outputs.import_run_id }}
          pattern: coverage-${{ needs.validation-source.outputs.import_sha }}-*
          path: delta-import-staging
          merge-multiple: false

      - name: Import pull-request coverage
        if: ${{ fromJSON(env.SONAR_ANALYZE) && needs.validation-source.outputs.import_run_id != '' && needs.select-shards.outputs.escalated == 'false' }}
        shell: pwsh
        env:
          IMPORT_SHA: ${{ needs.validation-source.outputs.import_sha }}
          IMPORT_SHARDS: ${{ needs.validation-source.outputs.import_shards }}
        run: |
          ./tools/TestImpact/Import-PullRequestShardArtifacts.ps1 -StagingDirectory delta-import-staging `
            -DestinationDirectory TestResults/delta-imported -ArtifactPrefix coverage `
            -ImportSha $env:IMPORT_SHA -ImportShardsJson $env:IMPORT_SHARDS

      - name: Restore dependencies
        if: ${{ fromJSON(env.SONAR_ANALYZE) }}
        run: dotnet restore

      - name: Begin SonarCloud analysis
        # For very large PRs (e.g., repo-wide formatting), Sonar's "new code" metrics are
        # dominated by line churn and can fail the quality gate (e.g., new coverage) despite
        # no semantic changes. Skip PR-mode analysis in that case.
        if: ${{ fromJSON(env.SONAR_ANALYZE) && (github.event_name != 'pull_request' || github.event.pull_request.changed_files <= 250) }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass user-controlled values as env vars to prevent script injection
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_BASE: ${{ github.base_ref || inputs.pr_base || 'master' }}
          PR_REPO: ${{ github.repository || inputs.pr_repo || 'ooples/AiDotNet' }}
          EVENT_NAME: ${{ github.event_name }}
        shell: pwsh
        run: |
          $params = @(
            "/k:ooples_AiDotNet",
            "/o:ooples",
            "/d:sonar.token=$env:SONAR_TOKEN",
            "/d:sonar.host.url=https://sonarcloud.io",
            "/d:sonar.cs.opencover.reportsPaths=TestResults/**/coverage.opencover.xml",
            "/d:sonar.exclusions=**/ProgramSynthesis/Models/**,**/ProgramSynthesis/Execution/**,**/ProgramSynthesis/Requests/**,**/ProgramSynthesis/Results/**,**/AiDotNet.Serving/Configuration/**,**/AiDotNet.Serving/Models/**,**/AiDotNet.Serving/Persistence/Migrations/**",
            "/d:sonar.coverage.exclusions=**/tests/**,**/testconsole/**,**/AiDotNetBenchmarkTests/**,**/examples/**,**/Interfaces/**,**/ProgramSynthesis/Interfaces/**,**/ProgramSynthesis/Enums/**,**/ProgramSynthesis/Models/**,**/ProgramSynthesis/Execution/**,**/ProgramSynthesis/Requests/**,**/ProgramSynthesis/Results/**,**/AiDotNet.Serving/**/I*.cs,**/AiDotNet.Serving/Configuration/**,**/AiDotNet.Serving/Models/**,**/AiDotNet.Serving/Persistence/Entities/**,**/AiDotNet.Serving/Persistence/Migrations/**",
            "/d:sonar.cpd.exclusions=**/Interfaces/**,**/ProgramSynthesis/Interfaces/**,**/ProgramSynthesis/Enums/**,**/ProgramSynthesis/Models/**,**/ProgramSynthesis/Execution/**,**/ProgramSynthesis/Requests/**,**/ProgramSynthesis/Results/**,**/AiDotNet.Serving/**/I*.cs,**/AiDotNet.Serving/Configuration/**,**/AiDotNet.Serving/Models/**,**/AiDotNet.Serving/Persistence/Entities/**,**/AiDotNet.Serving/Persistence/Migrations/**",
            "/d:sonar.scm.provider=git"
          )

          # For PR analysis, add incremental analysis parameters (using env vars for safety)
          if (-not [string]::IsNullOrWhiteSpace($env:PR_NUMBER)) {
            $params += "/d:sonar.pullrequest.key=$env:PR_NUMBER"
            $params += "/d:sonar.pullrequest.branch=$env:PR_BRANCH"
            $params += "/d:sonar.pullrequest.base=$env:PR_BASE"
            $params += "/d:sonar.pullrequest.provider=GitHub"
            $params += "/d:sonar.pullrequest.github.repository=$env:PR_REPO"
          }

          & "${{ runner.temp }}/scanner/dotnet-sonarscanner" begin @params

      - name: Build source generator first
        if: ${{ fromJSON(env.SONAR_ANALYZE) }}
        run: dotnet build src/AiDotNet.Generators/AiDotNet.Generators.csproj -c Release --no-restore

      - name: Build (Release)
        # ONE FRAMEWORK, EVERY PROJECT. `dotnet build` of the whole solution compiled every
        # project for every target framework under Sonar's analyzers - the main library and the
        # test project three times each (net10.0, net8.0, net471). It never finished: no master
        # commit since 09-01 completed an analysis; every attempt died or timed out inside this
        # step (55 minutes under the old limit, 95 under this one; 88364e91's runner died at 66).
        # The artifact build compiles the same core for net10.0 in about 7 minutes.
        #
        # Every shipped and test project targets net10.0, so each is built once for it and every
        # project is still analysed. The net8.0/net471 builds remain the build-compat job's
        # responsibility; Sonar no longer reports issues that exist only in their conditional code.
        # The generator targets netstandard2.0 by necessity (it loads into the compiler) and was
        # already built above. A project that stops targeting net10.0 fails this step on purpose,
        # so it cannot silently drop out of analysis.
        #
        # -m:2 matches the memory-safe project concurrency of the artifact build: Sonar's compiler
        # instrumentation only increases the need to avoid large csc processes competing inside
        # the 16-GB runner.
        if: ${{ fromJSON(env.SONAR_ANALYZE) }}
        shell: pwsh
        run: |
          $projects = @(dotnet sln AiDotNet.sln list | Select-Object -Skip 2 |
            ForEach-Object { $_.Trim().Replace('\', '/') } | Where-Object { $_ })
          if ($projects.Count -eq 0) { throw 'AiDotNet.sln lists no projects' }
          foreach ($project in $projects) {
            $evaluated = dotnet msbuild $project -getProperty:TargetFrameworks -getProperty:TargetFramework | Out-String
            if ($LASTEXITCODE -ne 0) { throw "could not evaluate the target frameworks of $project" }
            $properties = ($evaluated | ConvertFrom-Json).Properties
            $frameworks = @(("$($properties.TargetFrameworks);$($properties.TargetFramework)").Split(';') |
              Where-Object { $_ })
            if ($frameworks -contains 'net10.0') {
              Write-Host "::group::$project (net10.0 of $($frameworks -join ', '))"
              dotnet build $project -c Release --no-restore -m:2 -f net10.0
            }
            elseif ($project -eq 'src/AiDotNet.Generators/AiDotNet.Generators.csproj') {
              Write-Host "::group::$project (analyzer, $($frameworks -join ', '))"
              dotnet build $project -c Release --no-restore -m:2
            }
            else {
              throw "$project targets $($frameworks -join ', ') and not net10.0; decide how Sonar should analyse it"
            }
            $exit = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($exit -ne 0) { throw "Sonar-instrumented build of $project failed with exit code $exit" }
          }

      - name: End SonarCloud analysis
        if: ${{ fromJSON(env.SONAR_ANALYZE) && (github.event_name != 'pull_request' || github.event.pull_request.changed_files <= 250) }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          & "${{ runner.temp }}/scanner/dotnet-sonarscanner" end /d:sonar.token="$env:SONAR_TOKEN"

  # Note: net471 tests removed to save CI resources.
  # Build verification for net471 is done in the build job (cross-compiled on Linux
  # via the Microsoft.NETFramework.ReferenceAssemblies NuGet package, which provides
  # the .NET Framework targeting pack on non-Windows runners).
  # Only net10.0 tests are run as they produce coverage for SonarCloud.

  # Artifact size analysis
  size-check:
    if: "${{ fromJSON(needs.validation-source.outputs.execute_validation) && fromJSON(needs.select-shards.outputs.requires_validation) && !startsWith(github.head_ref, 'release-please--') && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(master): release')) }}"
    name: Artifact Size Check
    runs-on: ubuntu-latest
    needs: [build, validation-source, select-shards]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore and publish for size analysis
        run: |
          dotnet restore
          dotnet publish src/AiDotNet.csproj -c Release -f net10.0 -o publish

      - name: Analyze artifact size
        id: size
        run: |
          CURRENT_SIZE=$(du -sb publish | cut -f1)
          CURRENT_MB=$(echo "scale=2; $CURRENT_SIZE/1024/1024" | bc)
          echo "current_size=$CURRENT_SIZE" >> $GITHUB_OUTPUT
          echo "current_mb=$CURRENT_MB" >> $GITHUB_OUTPUT
          echo "Publish size: ${CURRENT_MB} MB"

          BASELINE_FILE=".github/artifact-size-baseline.txt"
          if [ -f "$BASELINE_FILE" ]; then
            BASELINE=$(cat "$BASELINE_FILE")
            BASELINE_MB=$(echo "scale=2; $BASELINE/1024/1024" | bc)
            CHANGE=$(echo "scale=2; (($CURRENT_SIZE - $BASELINE) * 100) / $BASELINE" | bc)
            echo "Size change: ${CHANGE}% (baseline ${BASELINE_MB} MB)"
            if (( $(echo "$CHANGE > 10" | bc -l) )); then
              echo "::warning::Artifact size increased by ${CHANGE}% (threshold: 10%)"
            fi
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Publish size: ${{ steps.size.outputs.current_mb }} MB" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------------------------
  # One run-level diagnostic for the entire matrix. Per-shard reports remain useful for the stack
  # trace, while this job answers the regression question directly: total and unique failures,
  # affected shard/test categories, missing result artifacts, and new/resolved failures against the
  # latest merged-PR analysis artifact. The checked-in seed is used only until a merged run has
  # produced the new compact artifact format.
  ci-test-analysis:
    name: Test analysis (aggregate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "${{ always() && !cancelled() && fromJSON(needs.validation-source.outputs.execute_validation) && fromJSON(needs.select-shards.outputs.requires_validation) && (github.event.pull_request.draft != true) && !startsWith(github.head_ref, 'release-please--') && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(master): release')) }}"
    needs:
      - test-net10-sharded
      - validation-source
      - select-shards
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
      - name: Checkout diagnostic scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Verify aggregate analyzer
        shell: pwsh
        run: ./.github/scripts/test-analyze-test-results.ps1

      - name: Initialize diagnostics directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path TestDiagnostics -Force | Out-Null

      - name: Download compact test diagnostics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        continue-on-error: true
        with:
          pattern: test-results-${{ github.sha }}-*
          path: TestDiagnostics

      - name: Download pull-request diagnostics for delta import
        if: needs.validation-source.outputs.import_run_id != '' && needs.select-shards.outputs.escalated == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          pattern: test-results-${{ needs.validation-source.outputs.import_sha }}-*
          path: delta-import-staging
          merge-multiple: false
          repository: ${{ github.repository }}
          run-id: ${{ needs.validation-source.outputs.import_run_id }}
          github-token: ${{ github.token }}

      - name: Import pull-request diagnostics
        if: needs.validation-source.outputs.import_run_id != '' && needs.select-shards.outputs.escalated == 'false'
        shell: pwsh
        env:
          IMPORT_SHA: ${{ needs.validation-source.outputs.import_sha }}
          IMPORT_SHARDS: ${{ needs.validation-source.outputs.import_shards }}
        run: |
          ./tools/TestImpact/Import-PullRequestShardArtifacts.ps1 -StagingDirectory delta-import-staging `
            -DestinationDirectory TestDiagnostics -ArtifactPrefix test-results `
            -ImportSha $env:IMPORT_SHA -ImportShardsJson $env:IMPORT_SHARDS

      - name: Collect shard states and latest merged baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'master' }}
          CURRENT_PR: ${{ github.event.pull_request.number || '0' }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tools/TestImpact/Invoke-GitHubApiWithRetry.ps1
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          # The matrix result only says failure/cancelled. Preserve every concrete shard conclusion
          # so a cancelled or OOM-killed shard with no TRX cannot disappear from the totals.
          $jobs = @()
          $page = 1
          do {
            $response = Invoke-GitHubApiWithRetry -Headers $headers -Uri `
              "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs?per_page=100&page=$page"
            $jobs += @($response.jobs)
            $page++
          } while ($response.jobs.Count -eq 100)
          @($jobs) | ConvertTo-Json -Depth 8 | Set-Content current-jobs.json

          $baselinePath = '.github/ci-test-baseline.json'
          $baselineSource = 'checked-in seed'
          $pulls = Invoke-GitHubApiWithRetry -Headers $headers -Uri `
            "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/pulls?state=closed&base=$env:BASE_REF&sort=updated&direction=desc&per_page=100"
          $merged = @($pulls | Where-Object {
            $_.merged_at -and [string]$_.number -ne $env:CURRENT_PR
          } | Sort-Object { [DateTime]$_.merged_at } -Descending)

          foreach ($pull in $merged) {
            # A merged push is keyed by the resulting merge/squash commit, while an earlier PR run
            # may be keyed by the head commit. Prefer the merged commit so the baseline describes
            # master exactly, then retain the head SHA as a compatibility fallback.
            $candidateShas = @([string]$pull.merge_commit_sha, [string]$pull.head.sha) |
              Where-Object { $_ } | Select-Object -Unique
            foreach ($candidateSha in $candidateShas) {
              $artifactName = "ci-test-analysis-$candidateSha"
              $encodedName = [Uri]::EscapeDataString($artifactName)
              $artifactResponse = Invoke-GitHubApiWithRetry -Headers $headers -Uri `
                "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=$encodedName&per_page=100"
              $artifact = @($artifactResponse.artifacts | Where-Object { -not $_.expired } |
                Sort-Object { [DateTime]$_.created_at } -Descending | Select-Object -First 1)
              if ($artifact.Count -eq 0) { continue }

              $downloadDirectory = "baseline-download-$candidateSha"
              $archivePath = "baseline-$candidateSha.zip"
              New-Item -ItemType Directory -Path $downloadDirectory -Force | Out-Null
              Invoke-GitHubApiWithRetry -Headers $headers `
                -Uri $artifact[0].archive_download_url -OutFile $archivePath | Out-Null
              Expand-Archive -LiteralPath $archivePath -DestinationPath $downloadDirectory -Force
              $downloaded = Get-ChildItem $downloadDirectory -Recurse -Filter ci-test-analysis.json |
                Select-Object -First 1
              if ($downloaded) {
                Copy-Item -LiteralPath $downloaded.FullName -Destination baseline.json
                $baselinePath = 'baseline.json'
                $baselineSource = "merged PR #$($pull.number) ($candidateSha)"
                break
              }
            }
            if ($baselinePath -eq 'baseline.json') { break }
          }

          "BASELINE_PATH=$baselinePath" >> $env:GITHUB_ENV
          "BASELINE_SOURCE=$baselineSource" >> $env:GITHUB_ENV
          "Baseline: $baselineSource" >> $env:GITHUB_STEP_SUMMARY

      - name: Build aggregate failure analysis
        shell: pwsh
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./.github/scripts/analyze-test-results.ps1 `
            -ResultsPath TestDiagnostics `
            -OutputDirectory TestAnalysis `
            -JobsPath current-jobs.json `
            -BaselinePath $env:BASELINE_PATH `
            -Repository '${{ github.repository }}' `
            -CommitSha '${{ github.sha }}' `
            -RunUrl $env:RUN_URL

      - name: Upload aggregate test analysis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          # The PR head remains queryable after merge, whereas refs/pull/*/merge is temporary.
          # A master-push promotion below also publishes the same report under the landed SHA.
          name: ci-test-analysis-${{ github.event.pull_request.head.sha || github.sha }}
          path: TestAnalysis/
          if-no-files-found: error
          retention-days: 90

  # Certify the expensive validation stage independently from CodeQL and Sonar. A hosted runner
  # disappearing during either quality job must not force the landed tree to repeat 100+ shards.
  validation-gate:
    name: Validation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "${{ always() && !cancelled() && fromJSON(needs.validation-source.outputs.execute_validation) && (github.event.pull_request.draft != true) && !startsWith(github.head_ref, 'release-please--') && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(master): release')) }}"
    needs:
      - validation-source
      - build
      - build-compat
      - select-shards
      - test-net10-sharded
      - test-regression-analysis
      - ci-test-analysis
      - size-check
    steps:
      - name: Checkout gate policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Evaluate validation jobs
        shell: pwsh
        run: |
          ./tools/TestImpact/Assert-CiGate.ps1 `
            -Stage Validation `
            -ReuseScope None `
            -SourceResult '${{ needs.validation-source.result }}' `
            -RequiresValidation '${{ needs.select-shards.outputs.requires_validation || 'true' }}' `
            -RequiresTests '${{ needs.select-shards.outputs.requires_tests || 'true' }}' `
            -SelectResult '${{ needs.select-shards.result }}' `
            -BuildResult '${{ needs.build.result }}' `
            -BuildCompatResult '${{ needs.build-compat.result }}' `
            -TestsResult '${{ needs.test-net10-sharded.result }}' `
            -RegressionAnalysisResult '${{ needs.test-regression-analysis.result }}' `
            -VerdictEnforced '${{ needs.test-regression-analysis.outputs.verdict_enforced || 'false' }}' `
            -AggregateAnalysisResult '${{ needs.ci-test-analysis.result }}' `
            -SizeCheckResult '${{ needs.size-check.result }}' `
            -SummaryFile $env:GITHUB_STEP_SUMMARY

  certify-expensive-validation:
    name: Publish expensive validation proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "${{ always() && !cancelled() && needs.validation-gate.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}"
    needs: [validation-gate, validation-source, select-shards]
    permissions:
      contents: read
    steps:
      - name: Checkout tested tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Write validation certificate
        shell: pwsh
        run: |
          $testedTree = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'could not resolve the tested tree' }
          $requiresValidation = [bool]::Parse('${{ needs.select-shards.outputs.requires_validation }}')
          ./tools/TestImpact/New-CiValidationCertificate.ps1 `
            -Scope Validation `
            -RunId ([long] '${{ github.run_id }}') `
            -TestedSha '${{ github.sha }}' `
            -TestedTree $testedTree `
            -EventName '${{ github.event_name }}' `
            -RequiresValidation $requiresValidation `
            -OutFile validation-certificate.json

      - name: Upload validation certificate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ci-expensive-validation-certificate-${{ github.event.pull_request.head.sha || github.sha }}
          path: validation-certificate.json
          if-no-files-found: error
          retention-days: 90

  # Preserve the certified PR ledger as the master baseline without rerunning 100+ test shards.
  # This job is reachable only after validation-source proves that the PR-tested and landed Git
  # trees are identical; direct or otherwise unverifiable pushes execute ci-test-analysis instead.
  promote-ci-test-analysis:
    name: Publish certified test baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "${{ always() && !cancelled() && github.event_name == 'push' && needs.validation-source.outputs.reuse == 'true' && fromJSON(needs.validation-source.outputs.reused_requires_validation) }}"
    needs:
      - validation-source
    permissions:
      actions: read
      contents: read

    steps:
      - name: Download certified PR analysis
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validation-source.outputs.run_id }}
          pattern: ci-test-analysis-*
          path: TestAnalysis
          merge-multiple: true

      - name: Download certified PR outcome ledger
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validation-source.outputs.run_id }}
          pattern: test-outcome-ledger-*
          path: TestOutcomeLedger
          merge-multiple: true

      - name: Record promotion provenance
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ needs.validation-source.outputs.run_id }}
          SOURCE_PR: ${{ needs.validation-source.outputs.pr_number }}
          TESTED_SHA: ${{ needs.validation-source.outputs.tested_sha }}
        run: |
          jq -n \
            --arg masterSha "$GITHUB_SHA" \
            --arg testedSha "$TESTED_SHA" \
            --arg sourceRunId "$SOURCE_RUN_ID" \
            --arg sourcePr "$SOURCE_PR" \
            '{masterSha: $masterSha, testedSha: $testedSha, sourceRunId: $sourceRunId, sourcePr: $sourcePr}' \
            > TestAnalysis/promotion.json

      - name: Upload master-keyed analysis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ci-test-analysis-${{ github.sha }}
          path: TestAnalysis/
          if-no-files-found: error
          retention-days: 90

      - name: Upload master-keyed outcome ledger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: test-outcome-ledger-${{ github.sha }}
          path: TestOutcomeLedger/
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------------------------
  # Single aggregation gate for the dynamic build/test matrix. Keep this stable check in the
  # `Main` ruleset alongside the separately required SonarCloud and CodeQL policies; do not list
  # the individual shards themselves.
  #
  # Required-check names must be STATIC, which is why a 158-job matrix cannot be listed directly:
  # every time a shard is re-split (G-I -> G + H-I, and so on) the job names change and any
  # per-shard requirement silently stops applying. One fixed name in front of the matrix keeps the
  # bar stable across re-sharding. This is the standard pattern for large matrix builds.
  #
  # always() means this runs even when a dependency failed -- that is the point, since a skipped
  # required check reads as unsatisfied and blocks the PR without ever saying why. Here the result
  # is decided explicitly below and printed, so a red gate names the job that caused it.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "${{ always() && !cancelled() && (github.event.pull_request.draft != true) && !startsWith(github.head_ref, 'release-please--') && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(master): release')) }}"
    needs:
      - validation-source
      - validation-gate
      - codeql
      - build
      - build-compat
      - select-shards
      - test-net10-sharded
      - test-regression-analysis
      - ci-test-analysis
      - size-check
      - promote-ci-test-analysis
      - sonarcloud

    steps:
      - name: Checkout gate policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Evaluate required jobs
        shell: pwsh
        run: |
          ./tools/TestImpact/Assert-CiGate.ps1 `
            -Stage Complete `
            -ReuseScope '${{ needs.validation-source.outputs.reuse_scope }}' `
            -SourceResult '${{ needs.validation-source.result }}' `
            -RequiresValidation '${{ (needs.validation-source.outputs.reuse == 'true' && needs.validation-source.outputs.reused_requires_validation) || needs.select-shards.outputs.requires_validation || 'true' }}' `
            -ValidationGateResult '${{ needs.validation-gate.result }}' `
            -PromotionResult '${{ needs.promote-ci-test-analysis.result }}' `
            -CodeQLResult '${{ needs.codeql.result }}' `
            -SonarResult '${{ needs.sonarcloud.result }}' `
            -SummaryFile $env:GITHUB_STEP_SUMMARY
  # The aggregate analysis artifact proves that tests emitted data; it does not prove validation
  # passed. Publish a separate, run-bound certificate only after the required CI Gate succeeds.
  # Master exact-tree reuse requires this artifact and fails closed when it is absent or malformed.
  certify-validation:
    name: Publish complete validation proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci-gate, select-shards]
    if: "${{ always() && !cancelled() && needs.ci-gate.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}"
    permissions:
      contents: read

    steps:
      - name: Checkout tested tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Write validation certificate
        shell: pwsh
        run: |
          $testedTree = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'could not resolve the tested tree' }
          $requiresValidation = [bool]::Parse('${{ needs.select-shards.outputs.requires_validation }}')
          ./tools/TestImpact/New-CiValidationCertificate.ps1 `
            -Scope Complete `
            -RunId ([long] '${{ github.run_id }}') `
            -TestedSha '${{ github.sha }}' `
            -TestedTree $testedTree `
            -EventName '${{ github.event_name }}' `
            -RequiresValidation $requiresValidation `
            -OutFile validation-certificate.json

      - name: Upload validation certificate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ci-validation-certificate-${{ github.event.pull_request.head.sha || github.sha }}
          path: validation-certificate.json
          if-no-files-found: error
          retention-days: 90

  # NOTE: Website deployment has moved to deploy-website.yml (deploys to Vercel at aidotnet.dev)
