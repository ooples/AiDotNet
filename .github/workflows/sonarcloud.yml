name: Required GPU isolated qualification
run-name: Required GPU qualification ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: required-gpu-qualification-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  compile-reviewed-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ format('sha256:{0}', steps.upload.outputs.artifact-digest) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - name: Verify immutable producer and reviewed source provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh api repos/ooples/AiDotNet/actions/runs/44232296552 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify producer run.' }
          $artifact = gh api repos/ooples/AiDotNet/actions/artifacts/14397017210 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify producer artifact.' }
          $build = gh api repos/ooples/AiDotNet/actions/jobs/134564102378 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $build.run_id -ne 44232296552 -or $build.run_attempt -ne 1 -or
              $build.name -cne 'Build' -or $build.conclusion -cne 'success') { throw 'The exact producer build did not succeed.' }
          if ($run.repository.full_name -cne 'ooples/AiDotNet' -or $run.id -ne 44232296552 -or $run.run_attempt -ne 1 -or
              $run.head_sha -cne 'a826446bc36bdf0d28919bef291c99ace6f4e958' -or $run.event -cne 'pull_request' -or
              $run.path -cne '.github/workflows/sonarcloud.yml') { throw 'Producer run provenance mismatch.' }
          if ($artifact.id -ne 14397017210 -or $artifact.name -cne 'build-output-5b0c9f47bf892f4fad716903cddae14b412244c7' -or
              $artifact.digest -cne 'sha256:7b6136331516c64efd6e266fd63e729fb167112135348e2b56086d0254928239' -or $artifact.expired -or
              $artifact.workflow_run.id -ne 44232296552 -or $artifact.workflow_run.repository_id -ne $run.repository.id -or
              $artifact.workflow_run.head_sha -cne $run.head_sha) { throw 'Producer artifact provenance mismatch.' }
          $sources = @(
            'tests/AiDotNet.Tests/Recovery/GpuRecoveryTests.cs',
            'tests/AiDotNet.Tests/Concurrency/ThreadSafetyTests.cs',
            'tests/AiDotNet.Tests/Helpers/RequiredGpuTestContract.cs',
            'tests/AiDotNet.Tests/GlobalUsings.cs',
            'tests/AiDotNet.Tests/ModuleInitializer.cs',
            'tests/AiDotNet.Tests/Helpers/LicenseTestSupport.cs',
            'tests/AiDotNet.Tests/Fixtures/EngineCurrentGlobalStateCollection.cs')
          git diff --exit-code e9904771e13f33398610b507bbb23e2e1b3dce7e HEAD -- @sources tools/TestImpact/Assert-RequiredGpuResults.ps1 tools/TestImpact/Test-RequiredGpuResults.ps1 tools/TestImpact/Assert-CiGate.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Qualification source differs from the reviewed batch.' }
          git diff --exit-code a826446bc36bdf0d28919bef291c99ace6f4e958 HEAD -- @($sources | Select-Object -Skip 3)
          if ($LASTEXITCODE -ne 0) { throw 'Original test bootstrap was modified.' }
          $records = @($sources | ForEach-Object { @{ path=$_; sha256=(Get-FileHash -LiteralPath $_).Hash.ToLowerInvariant() } })
          [ordered]@{ qualificationCommit='${{ github.sha }}'; reviewedSourceCommit='e9904771e13f33398610b507bbb23e2e1b3dce7e'
            producerRepository=$run.repository.full_name; producerHead=$run.head_sha; producerRunId=[string]$run.id; producerRunAttempt=[string]$run.run_attempt
            producerArtifactId=[string]$artifact.id; producerArtifactName=$artifact.name; producerArtifactDigest=$artifact.digest; sources=$records } |
            ConvertTo-Json -Depth 6 | Set-Content qualification-provenance.json
      - name: Receive the exact a826 production build
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./tools/TestImpact/Receive-RequiredArtifact.ps1 -Repository ooples/AiDotNet -ArtifactId 14397017210 `
            -ExpectedDigest sha256:7b6136331516c64efd6e266fd63e729fb167112135348e2b56086d0254928239 `
            -Destination '.' -RunId 44232296552 -JobIndex 0
      - name: Qualify verifier fixtures and compile only reviewed test sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The fixture inspects the shipping workflow's obligation expressions, not this temporary workflow.
          New-Item -ItemType Directory -Path reviewed-policy -Force | Out-Null
          git archive --format=tar -o reviewed-policy.tar e9904771e13f33398610b507bbb23e2e1b3dce7e `
            tools/TestImpact/Assert-CiGate.ps1 tools/TestImpact/Assert-RequiredGpuResults.ps1 tools/TestImpact/Test-RequiredGpuResults.ps1 `
            tests/AiDotNet.Tests/Recovery/GpuRecoveryTests.cs tests/AiDotNet.Tests/Concurrency/ThreadSafetyTests.cs .github/workflows/sonarcloud.yml
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract reviewed shipping policy for fixtures.' }
          tar -xf reviewed-policy.tar -C reviewed-policy
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract reviewed policy archive.' }
          ./reviewed-policy/tools/TestImpact/Test-RequiredGpuResults.ps1 *> verifier-fixtures.log
          if ($LASTEXITCODE -ne 0) { throw 'Required GPU verifier fixtures failed.' }
          $runtime = (Resolve-Path tests/AiDotNet.Tests/bin/Release/net10.0).Path
          $provenance = Get-Content qualification-provenance.json -Raw | ConvertFrom-Json
          $originalTestIdentity = [Reflection.AssemblyName]::GetAssemblyName((Join-Path $runtime 'AiDotNetTests.dll'))
          $provenance | Add-Member -NotePropertyName originalTestHash -NotePropertyValue (Get-FileHash (Join-Path $runtime 'AiDotNetTests.dll')).Hash.ToLowerInvariant()
          $production = @('AiDotNet.dll','AiDotNet.Tensors.dll') | ForEach-Object {
            $path = Join-Path $runtime $_
            @{ name=$_; sha256=(Get-FileHash -LiteralPath $path).Hash.ToLowerInvariant(); identity=[Reflection.AssemblyName]::GetAssemblyName($path).FullName }
          }
          $provenance | Add-Member -NotePropertyName productionAssemblies -NotePropertyValue @($production)
          $dotnet = Split-Path (Get-Command dotnet).Source
          # setup-dotnet's executable may be a symlink; --list-sdks gives the actual installation.
          $sdkLine = @(dotnet --list-sdks | Where-Object { $_ -match '^10\.' })[-1]
          if ($sdkLine -notmatch '^(\S+) \[(.+)\]$') { throw 'No installed .NET 10 SDK.' }
          $sdkVersion=$Matches[1]; $sdkBase=$Matches[2]; $dotnet=Split-Path $sdkBase
          $referenceVersion = Get-ChildItem (Join-Path $dotnet 'packs/Microsoft.NETCore.App.Ref') -Directory |
            Where-Object Name -Match '^10\.' | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $referenceFiles = @(Get-ChildItem (Join-Path $referenceVersion.FullName 'ref/net10.0') -Filter '*.dll')
          $referenceNames = @($referenceFiles.Name)
          $references = @($referenceFiles.FullName)
          foreach ($file in Get-ChildItem $runtime -Filter '*.dll') {
            if ($file.Name -ceq 'AiDotNetTests.dll' -or $referenceNames -contains $file.Name) { continue }
            try { [void][Reflection.AssemblyName]::GetAssemblyName($file.FullName); $references += $file.FullName } catch [BadImageFormatException] { }
          }
          New-Item -ItemType Directory -Path focused-compile -Force | Out-Null
          $version = $originalTestIdentity.Version.ToString()
          @('global using System;', 'global using System.Collections.Generic;', 'global using System.IO;', 'global using System.Linq;', 'global using System.Threading;', 'global using System.Threading.Tasks;', "[assembly: System.Reflection.AssemblyVersion(`"$version`")]") | Set-Content focused-compile/Configuration.cs
          $arguments = @('/nostdlib+','/target:library','/langversion:latest','/nullable:enable','/deterministic+','/debug:portable',
            '/define:NET;NETCOREAPP;NET10_0;NET5_0_OR_GREATER;NET6_0_OR_GREATER;NET7_0_OR_GREATER;NET8_0_OR_GREATER;NET9_0_OR_GREATER;NET10_0_OR_GREATER',
            '/out:focused-compile/AiDotNetTests.dll','/pdb:focused-compile/AiDotNetTests.pdb')
          $arguments += @($references | ForEach-Object { '/reference:"' + $_ + '"' })
          $arguments += @($provenance.sources.path | ForEach-Object { '"' + $_ + '"' })
          $arguments += 'focused-compile/Configuration.cs'
          $arguments | Set-Content focused-compile/compile.rsp
          dotnet (Join-Path $sdkBase "$sdkVersion/Roslyn/bincore/csc.dll") /noconfig '@focused-compile/compile.rsp' *> focused-compile/compiler.log
          if ($LASTEXITCODE -ne 0) { Get-Content focused-compile/compiler.log; throw 'Focused GPU test compilation failed.' }
          Copy-Item focused-compile/AiDotNetTests.dll,focused-compile/AiDotNetTests.pdb -Destination $runtime -Force
          foreach ($record in $production) {
            if ((Get-FileHash (Join-Path $runtime $record.name)).Hash.ToLowerInvariant() -cne $record.sha256) { throw 'Production dependency changed during test compilation.' }
          }
          $provenance | Add-Member -NotePropertyName compiledTestHash -NotePropertyValue (Get-FileHash (Join-Path $runtime 'AiDotNetTests.dll')).Hash.ToLowerInvariant()
          $provenance | ConvertTo-Json -Depth 6 | Set-Content qualification-provenance.json
      - name: Upload identical runtime for GPU execution
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: required-gpu-qualified-runtime-${{ github.sha }}
          path: |
            tests/AiDotNet.Tests/bin/Release/net10.0/
            qualification-provenance.json
          if-no-files-found: error
          retention-days: 3
      - name: Preserve compile and fixture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: required-gpu-compile-evidence-${{ github.sha }}
          path: |
            qualification-provenance.json
            verifier-fixtures.log
            focused-compile/compiler.log
            focused-compile/compile.rsp
          if-no-files-found: error
          retention-days: 3
  required-gpu-contracts:
    name: Isolated required GPU recovery and concurrency
    needs: compile-reviewed-tests
    runs-on: [self-hosted, Windows, X64, gpu, cuda, sm86]
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'ooples/AiDotNet' && startsWith(github.ref, 'refs/heads/codex/2524-required-gpu-qualification') }}
    env:
      AIDOTNET_DIRECTGPU_BACKENDS: cuda
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - name: Receive identical compiled runtime
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./tools/TestImpact/Receive-RequiredArtifact.ps1 -Repository ooples/AiDotNet `
            -ArtifactId '${{ needs.compile-reviewed-tests.outputs.artifact_id }}' `
            -ExpectedDigest '${{ needs.compile-reviewed-tests.outputs.artifact_digest }}' `
            -Destination '.' -RunId '${{ github.run_id }}' -JobIndex 0
      - name: Verify production and test hashes and record capability
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p=Get-Content qualification-provenance.json -Raw | ConvertFrom-Json
          if ($p.qualificationCommit -cne '${{ github.sha }}' -or $p.reviewedSourceCommit -cne 'e9904771e13f33398610b507bbb23e2e1b3dce7e' -or
              $p.producerRepository -cne 'ooples/AiDotNet' -or $p.producerHead -cne 'a826446bc36bdf0d28919bef291c99ace6f4e958' -or
              $p.producerRunId -cne '44232296552' -or $p.producerRunAttempt -cne '1' -or $p.producerArtifactId -cne '14397017210' -or
              $p.producerArtifactName -cne 'build-output-5b0c9f47bf892f4fad716903cddae14b412244c7' -or
              $p.producerArtifactDigest -cne 'sha256:7b6136331516c64efd6e266fd63e729fb167112135348e2b56086d0254928239') { throw 'Qualification provenance mismatch.' }
          $runtime='tests/AiDotNet.Tests/bin/Release/net10.0'
          foreach ($record in $p.productionAssemblies) {
            if ((Get-FileHash (Join-Path $runtime $record.name)).Hash.ToLowerInvariant() -cne $record.sha256) { throw 'GPU production hash mismatch.' }
          }
          if ((Get-FileHash (Join-Path $runtime 'AiDotNetTests.dll')).Hash.ToLowerInvariant() -cne $p.compiledTestHash) { throw 'GPU test hash mismatch.' }
          & nvidia-smi --query-gpu=name,uuid,driver_version,compute_cap --format=csv
          if ($LASTEXITCODE -ne 0) { throw 'Required NVIDIA runtime inventory failed.' }
          New-Item -ItemType Directory -Path required-gpu-results -Force | Out-Null
          Copy-Item qualification-provenance.json required-gpu-results/
          $assemblies=@('AiDotNet.dll','AiDotNet.Tensors.dll','AiDotNetTests.dll') | ForEach-Object {
            @{name=$_;sha256=(Get-FileHash (Join-Path $runtime $_)).Hash.ToLowerInvariant()}
          }
          @{sha='${{ github.sha }}';runId='${{ github.run_id }}';runAttempt='${{ github.run_attempt }}'
            artifactId='${{ needs.compile-reviewed-tests.outputs.artifact_id }}';artifactDigest='${{ needs.compile-reviewed-tests.outputs.artifact_digest }}'
            assemblies=@($assemblies)} | ConvertTo-Json -Depth 5 | Set-Content required-gpu-results/binding.json
      - name: Run reviewed GPU facts without build or restore
        shell: pwsh
        env:
          AIDOTNET_LICENSE_KEY: ${{ secrets.AIDOTNET_LICENSE_KEY }}
        run: |
          dotnet vstest tests/AiDotNet.Tests/bin/Release/net10.0/AiDotNetTests.dll '--TestCaseFilter:GpuContract=Required' `
            '--logger:trx;LogFileName=required-gpu.trx' '--ResultsDirectory:required-gpu-results'
          if ($LASTEXITCODE -ne 0) { throw 'Required GPU tests failed.' }
      - name: Require exact executed CUDA identities and loaded assembly hashes
        if: always()
        shell: pwsh
        run: |
          ./tools/TestImpact/Assert-RequiredGpuResults.ps1 -Trx required-gpu-results/required-gpu.trx -BindingFile required-gpu-results/binding.json `
            -ExpectedSha '${{ github.sha }}' -ExpectedRunId '${{ github.run_id }}' -ExpectedRunAttempt '${{ github.run_attempt }}' `
            -ExpectedArtifactId '${{ needs.compile-reviewed-tests.outputs.artifact_id }}' `
            -ExpectedArtifactDigest '${{ needs.compile-reviewed-tests.outputs.artifact_digest }}' `
            -AssemblyDirectory tests/AiDotNet.Tests/bin/Release/net10.0
      - name: Preserve actual GPU evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: required-gpu-isolated-results-${{ github.sha }}
          path: required-gpu-results/
          if-no-files-found: error
          retention-days: 30
