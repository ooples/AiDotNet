name: Sonar build probe

# One-off measurement, not validation. The SonarCloud job's instrumented build has not finished on
# any run checked in 2026-09: it hit the 90-minute limit or the runner was lost, and a lost runner
# takes the step's log with it, so nothing says which project, how much memory or how much disk.
# This replays the exact begin + per-project build, samples memory and disk every 5 s, stops the
# build before either is exhausted so the runner survives, and uploads the samples. `end` is never
# called, so nothing is published to SonarCloud.
on:
  pull_request:
    paths:
      - '.github/workflows/sonar-build-probe.yml'

permissions: read-all

concurrency:
  group: sonar-build-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 175
    strategy:
      fail-fast: false
      matrix:
        # current: the SonarCloud job's steps as they are.
        # freed-disk: the same after the disk cleanup the CodeQL job already performs.
        # src-only: shipped projects only, to see whether test/benchmark projects are the cost.
        # Run 35242849920: both jobs were shut down by the host (exit 143) while the FIRST project,
        # AiDotNetBenchmarkTests, was still building after 47 and 65 minutes; the watchdog never fired
        # and the artifact upload was skipped, so samples are now also printed into the log.
        # Run 35252231309 measured the cause: src/AiDotNet.csproj alone builds under the scanner in
        # 19.6 min and exits 0, but peaks at 15.4 GB of the runner's 16 GB with swap full, and the
        # watchdog then stopped the run. Disk was never short (89 GB free). These two variants test
        # the remedies: no persistent compiler server between projects, and more swap to absorb the
        # peak. Both build the complete project list, as the nightly job does.
        variant: [no-compiler-server, swap-and-no-compiler-server]
    steps:
      - name: Add swap for the instrumented build
        if: matrix.variant == 'swap-and-no-compiler-server'
        run: |
          sudo fallocate -l 16G /mnt/probe-swap
          sudo chmod 600 /mnt/probe-swap
          sudo mkswap /mnt/probe-swap
          sudo swapon /mnt/probe-swap
          free -m

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/go /usr/share/swift /usr/share/miniconda \
            /usr/local/share/boost || true
          sudo apt-get clean || true

      - name: Record the runner envelope
        run: |
          nproc; free -m; df -h / "$RUNNER_TEMP"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install SonarCloud scanner
        shell: pwsh
        run: |
          New-Item -Path ${{ runner.temp }}/scanner -ItemType Directory -Force | Out-Null
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}/scanner

      - name: Restore dependencies
        run: dotnet restore

      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) { throw 'SONAR_TOKEN is not available to this run' }
          $params = @(
            "/k:ooples_AiDotNet",
            "/o:ooples",
            "/d:sonar.token=$env:SONAR_TOKEN",
            "/d:sonar.host.url=https://sonarcloud.io",
            "/d:sonar.exclusions=**/ProgramSynthesis/Models/**,**/ProgramSynthesis/Execution/**,**/ProgramSynthesis/Requests/**,**/ProgramSynthesis/Results/**,**/AiDotNet.Serving/Configuration/**,**/AiDotNet.Serving/Models/**,**/AiDotNet.Serving/Persistence/Migrations/**",
            "/d:sonar.scm.provider=git"
          )
          & "${{ runner.temp }}/scanner/dotnet-sonarscanner" begin @params
          if ($LASTEXITCODE -ne 0) { throw "begin exited $LASTEXITCODE" }

      - name: Build source generator first
        run: dotnet build src/AiDotNet.Generators/AiDotNet.Generators.csproj -c Release --no-restore

      - name: Build every project under the scanner, with a resource watchdog
        id: build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p probe
          samples=probe/samples.csv
          echo 'utc,mem_used_mb,mem_available_mb,swap_used_mb,root_avail_mb,temp_avail_mb,sonar_dir_mb' > "$samples"
          (
            while true; do
              read -r _ _ used _ _ _ avail < <(free -m | awk '/^Mem:/')
              read -r _ _ swap _ < <(free -m | awk '/^Swap:/')
              root=$(df -m --output=avail / | tail -1 | tr -d ' ')
              temp=$(df -m --output=avail "$RUNNER_TEMP" | tail -1 | tr -d ' ')
              sonar=$( (du -sm .sonarqube 2>/dev/null || true) | cut -f1)
              line="$(date -u +%FT%TZ),$used,$avail,$swap,$root,$temp,${sonar:-0}"
              echo "$line" >> "$samples"
              tick=$(( ${tick:-0} + 1 ))
              if [ $(( tick % 6 )) -eq 1 ]; then echo "sample $line"; fi
              # Stop the build, not the runner: a lost runner loses every log and artifact.
              swap_free=$(free -m | awk '/^Swap:/ {print $4}')
              if { [ "$avail" -lt 400 ] && [ "${swap_free:-0}" -lt 512 ]; } || [ "$root" -lt 1500 ] || [ "$temp" -lt 1500 ]; then
                echo "watchdog: stopping the build (mem_available=${avail}MB root=${root}MB temp=${temp}MB)" | tee probe/watchdog.txt
                pkill -f 'dotnet build' || true
                pkill -f VBCSCompiler || true
                pkill -f MSBuild.dll || true
                break
              fi
              sleep 5
            done
          ) &
          sampler=$!

          echo 'project,start_utc,end_utc,seconds,exit' > probe/projects.csv
          dotnet sln AiDotNet.sln list | tail -n +3 | tr -d '\r' | sed 's#\\#/#g' | sed '/^\s*$/d' > probe/all-projects.txt
          # The core library first, so its cost is measured on its own.
          { grep -x 'src/AiDotNet.csproj' probe/all-projects.txt; grep -vx 'src/AiDotNet.csproj' probe/all-projects.txt; } > probe/project-list.txt
          echo 'build order:'; cat probe/project-list.txt
          overall=0
          while read -r project; do
            if [ -f probe/watchdog.txt ]; then break; fi
            if [ "$project" = 'src/AiDotNet.Generators/AiDotNet.Generators.csproj' ]; then
              args=()
            else
              args=(-f net10.0)
            fi
            start=$(date -u +%s)
            echo "::group::$project"
            log="probe/$(echo "$project" | tr '/' '_').log"
            # No compiler server and no node reuse: each project's compiler memory is returned when
            # the build exits, instead of being held by VBCSCompiler/MSBuild for the next one.
            if dotnet build "$project" -c Release --no-restore -m:2 -nodeReuse:false                  -p:UseSharedCompilation=false "${args[@]}" < /dev/null > "$log" 2>&1; then code=0; else code=$?; fi
            tail -5 "$log"
            echo '::endgroup::'
            end=$(date -u +%s)
            echo "$project,$(date -u -d @$start +%FT%TZ),$(date -u -d @$end +%FT%TZ),$((end - start)),$code" | tee -a probe/projects.csv
            if [ "$code" -ne 0 ]; then overall=$code; fi
          done < probe/project-list.txt

          kill $sampler 2>/dev/null || true
          sort -t, -k4 -n -r probe/projects.csv | head -15
          echo "peak memory used (MB): $(tail -n +2 "$samples" | cut -d, -f2 | sort -n | tail -1)"
          echo "lowest root free (MB): $(tail -n +2 "$samples" | cut -d, -f5 | sort -n | head -1)"
          echo "largest .sonarqube (MB): $(tail -n +2 "$samples" | cut -d, -f7 | sort -n | tail -1)"
          if [ -f probe/watchdog.txt ]; then exit 90; fi
          exit $overall

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: sonar-build-probe-${{ matrix.variant }}
          path: probe/
          if-no-files-found: warn
          retention-days: 14
