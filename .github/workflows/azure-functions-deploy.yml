name: Deploy Playground Functions to Azure

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'src/AiDotNet.Playground.Functions/**'
      - '.github/workflows/azure-functions-deploy.yml'
      - 'scripts/verify-playground-package.py'
      - 'scripts/check-playground-routes.py'
      - 'scripts/test_playground_package.py'
      - 'scripts/test_playground_routes.py'
      - 'scripts/test_playground_event_state.py'
      - 'website/supabase/migrations/*playground_stripe*.sql'
      - 'tests/AiDotNet.Playground.Functions.Tests/**'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_FUNCTIONAPP_NAME: aidotnet-playground
  AZURE_FUNCTIONAPP_RESOURCE_GROUP: aidotnet-playground_group
  AZURE_FUNCTIONAPP_PACKAGE_PATH: src/AiDotNet.Playground.Functions
  DOTNET_VERSION: '10.0.x'

permissions:
  contents: read

jobs:
  build:
    name: Build and Verify
    runs-on: ubuntu-latest
    # The functions project references src/AiDotNet.csproj, so this build compiles the library's
    # net10.0 target too (about 6.5 minutes on a 128-core workstation; several times that on a
    # 4-core hosted runner, where CodeQL's traced net10.0 build of it takes about 26 minutes).
    # 15 minutes was sized for restoring a prebuilt AiDotNet package.
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore tests/AiDotNet.Playground.Functions.Tests

      - name: Test durable Stripe event state against PostgreSQL
        run: python3 scripts/test_playground_event_state.py

      - name: Build and test webhook and execution contracts
        run: dotnet test tests/AiDotNet.Playground.Functions.Tests -c Release --no-restore -p:GeneratePackageOnBuild=false

      - name: Publish
        # The existing app is Windows Consumption. A portable publish carries mobile/macOS/Linux
        # native libraries and exhausted Kudu's temporary disk during the recovery upload.
        # Keep reference PDBs for diagnostics, but omit XML documentation from the runtime package.
        # Reuse the library built by the test step; only publish the Functions host for Windows.
        run: dotnet publish ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }} -c Release -r win-x64 --self-contained false -o ./publish -p:BuildProjectReferences=false -p:GeneratePackageOnBuild=false -p:AllowedReferenceRelatedFileExtensions=.pdb

      - name: Verify both required functions are packaged
        run: |
          python3 scripts/test_playground_package.py
          python3 scripts/test_playground_routes.py
          python3 scripts/verify-playground-package.py ./publish

      - name: Upload verified deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: playground-functions
          path: ./publish
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: Deploy Verified Artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout route verification script
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/check-playground-routes.py
          sparse-checkout-cone-mode: false

      - name: Download verified deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: playground-functions
          path: ./publish

      - name: Check federated deployment configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_PLAYGROUND_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure federated Azure deployment first; see docs/playground-webhook-recovery.md ($name is missing)."
              exit 1
            fi
          done

      - name: Sign in to Azure without publishing passwords
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_PLAYGROUND_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./publish

      - name: Check public routes reject unsigned or empty requests
        shell: bash
        run: |
          hostname=$(az functionapp show --resource-group "$AZURE_FUNCTIONAPP_RESOURCE_GROUP" --name "$AZURE_FUNCTIONAPP_NAME" --query defaultHostName --output tsv)
          test -n "$hostname"
          echo "DEPLOYED_APP_URL=https://$hostname" >> "$GITHUB_ENV"
          python3 scripts/check-playground-routes.py "https://$hostname"

      - name: Deployment Summary
        if: success()
        run: |
          echo "## Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Azure Functions deployed to:" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name**: ${{ env.AZURE_FUNCTIONAPP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: $DEPLOYED_APP_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **API Endpoint**: $DEPLOYED_APP_URL/api/execute" >> $GITHUB_STEP_SUMMARY
          echo "- **Stripe Webhook**: $DEPLOYED_APP_URL/api/stripe-webhook" >> $GITHUB_STEP_SUMMARY
