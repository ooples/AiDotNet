name: Deploy Playground Functions to Azure

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'src/AiDotNet.Playground.Functions/**'
      - '.github/workflows/azure-functions-deploy.yml'
      - 'scripts/verify-playground-package.py'
      - 'scripts/check-playground-routes.py'
      - 'scripts/test_playground_package.py'
      - 'tests/AiDotNet.Playground.Functions.Tests/**'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_FUNCTIONAPP_NAME: aidotnet-playground
  AZURE_FUNCTIONAPP_PACKAGE_PATH: src/AiDotNet.Playground.Functions
  DOTNET_VERSION: '10.0.x'

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    # The functions project references src/AiDotNet.csproj, so this build compiles the library's
    # net10.0 target too (about 6.5 minutes on a 128-core workstation; several times that on a
    # 4-core hosted runner, where CodeQL's traced net10.0 build of it takes about 26 minutes).
    # 15 minutes was sized for restoring a prebuilt AiDotNet package.
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Check federated deployment configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_PLAYGROUND_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure federated Azure deployment first; see docs/playground-webhook-recovery.md ($name is missing)."
              exit 1
            fi
          done

      - name: Sign in to Azure without publishing passwords
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_PLAYGROUND_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore tests/AiDotNet.Playground.Functions.Tests

      - name: Build and test webhook and execution contracts
        run: dotnet test tests/AiDotNet.Playground.Functions.Tests -c Release --no-restore -p:GeneratePackageOnBuild=false

      - name: Publish
        run: dotnet publish ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }} -c Release -o ./publish --no-build

      - name: Verify both required functions are packaged
        run: |
          python3 scripts/test_playground_package.py
          python3 scripts/verify-playground-package.py ./publish

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./publish

      - name: Check public routes reject unsigned or empty requests
        run: python3 scripts/check-playground-routes.py https://aidotnet-playground-emfxa0abhzdqfyh3.westeurope-01.azurewebsites.net

      - name: Deployment Summary
        if: success()
        run: |
          echo "## Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Azure Functions deployed to:" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name**: ${{ env.AZURE_FUNCTIONAPP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://aidotnet-playground-emfxa0abhzdqfyh3.westeurope-01.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
          echo "- **API Endpoint**: https://aidotnet-playground-emfxa0abhzdqfyh3.westeurope-01.azurewebsites.net/api/execute" >> $GITHUB_STEP_SUMMARY
          echo "- **Stripe Webhook**: https://aidotnet-playground-emfxa0abhzdqfyh3.westeurope-01.azurewebsites.net/api/stripe-webhook" >> $GITHUB_STEP_SUMMARY
