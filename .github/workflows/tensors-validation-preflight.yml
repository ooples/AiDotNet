name: Temporary Tensors artifact preflight
on:
  push:
    branches: [codex/2524-ci-coordination]
    paths:
      - '.github/actions/setup-tensors-validation/**'
      - '.github/scripts/*TensorsValidationFeed.ps1'
      - '.github/tensors-validation.json'
      - '.github/workflows/tensors-validation-preflight.yml'
      - 'Directory.Packages.props'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-restore:
    if: github.repository == 'ooples/AiDotNet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Check validation guards
        shell: pwsh
        run: ./.github/scripts/Test-TensorsValidationFeed.ps1
      - uses: ./.github/actions/setup-tensors-validation
        with:
          artifact-token: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.AUTOFIX_PAT || '' }}
      - name: Restore the selected Tensors package
        shell: pwsh
        run: |
          [xml] $packages = Get-Content Directory.Packages.props -Raw
          $versions = @($packages.SelectNodes('//PackageVersion[@Include="AiDotNet.Tensors"]'))
          if ($versions.Count -ne 1) { throw 'Expected one central Tensors package version.' }
          $version = $versions[0].Version
          $project = Join-Path $env:RUNNER_TEMP 'tensors-restore-smoke.csproj'
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>
            <ItemGroup><PackageReference Include="AiDotNet.Tensors" Version="$version" /></ItemGroup>
          </Project>
          "@ | Set-Content $project
          $restoreArguments = @('restore', $project)
          if ($env:RestoreConfigFile) { $restoreArguments += @('--configfile', $env:RestoreConfigFile) }
          dotnet @restoreArguments
          if ($LASTEXITCODE -ne 0) { throw "Tensors package restore failed: $LASTEXITCODE" }
